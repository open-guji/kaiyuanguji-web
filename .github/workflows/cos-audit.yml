name: COS audit (read-only)

# 手动：只读查 COS 桶列表、生命周期规则、版本控制、未完成分片上传。只发 GET，不写不删。结果在日志里。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
        run: python3 ops/cos_audit.py
