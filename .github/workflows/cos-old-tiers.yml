name: COS 书影旧档清单（只读 dry-run）

# 单版整页（A20 方案 书影单版WebP）上线后，列出各书旧档（300／1200／原宽／src 2400）的对象数与 GB，
# 并把「建议删」的键清单作为工件上传（保留 14 天）。只读，不删任何东西；真删要另写脚本并先经用户点头。
on:
  workflow_dispatch:
    inputs:
      books:
        description: '书 id，逗号分隔'
        type: string
        default: '96mid1ogzk,995ejelvk0,988g7gsqhd,988g3f0wsu,99k3i35yww'

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: List
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          BOOKS: ${{ inputs.books }}
        run: |
          set -euo pipefail
          if ! [[ "$BOOKS" =~ ^[0-9a-z]{10}(,[0-9a-z]{10})*$ ]]; then echo "❌ books 格式不对"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/old-tiers"
          python3 ops/cos_old_tiers.py --books "$BOOKS" --out "$RUNNER_TEMP/old-tiers" | tee "$RUNNER_TEMP/old-tiers/summary.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: old-tiers-${{ github.run_id }}
          path: ${{ runner.temp }}/old-tiers/
          retention-days: 14
