name: COS 整前缀清理（白名单，默认 dry-run）

# 默认 dry-run：只统计白名单前缀（ops/cos_prefix_delete.py 的 ALLOWED，目前只有 staging/）的对象数与 GB。
# 真删要勾 delete 且 confirm 填 DELETE-STAGING；删之前必须有用户本人点头，并经 Deploy 确认近期没有演练。
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: '前缀（白名单内）'
        type: choice
        options: [staging/]
        default: 'staging/'
      delete:
        description: '真删（默认只统计）'
        type: boolean
        default: false
      confirm:
        description: '真删时填 DELETE-STAGING'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Guard
        if: ${{ inputs.delete }}
        run: |
          [ "${{ inputs.confirm }}" = "DELETE-STAGING" ] || { echo "❌ confirm 不对，不删"; exit 1; }
      - name: List (and delete if asked)
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          PREFIX: ${{ inputs.prefix }}
          DO_DELETE: ${{ inputs.delete }}
        run: |
          ARGS=(--prefix "$PREFIX")
          [ "$DO_DELETE" = "true" ] && ARGS+=(--delete)
          python3 ops/cos_prefix_delete.py "${ARGS[@]}"
