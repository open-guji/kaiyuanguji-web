name: COS usage (read-only)

# 手动：按前缀统计 COS 数据桶的对象数与 GB（只发 GET 列举，不写不删）。结果在 Summary 与工件里。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: List and aggregate
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
        run: python3 ops/cos_usage.py --out "$RUNNER_TEMP/cos-usage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cos-usage
          path: ${{ runner.temp }}/cos-usage.json
          retention-days: 14
