name: d1probe-run (临时，测完删)
on:
  push:
    branches: [ claude/d1probe-staging ]
    paths: [ '.github/workflows/d1probe-run.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          T: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
        run: |
          date -u
          echo "token_len=${#T}"
          curl -s -m 600 -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $T" "https://staging.openguji.com/api/d1probe?n=200"
