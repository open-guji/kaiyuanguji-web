name: Data package check and publish (overview#470 P1)
# 显示名带上流程，方便在 Actions 列表里分辨；定时一律是 text
run-name: ${{ format('Data publish ({0}{1})', inputs.flow || 'text', inputs.target == 'staging' && ', staging' || '') }}
# 数据流程（overview#470 设计 §2）：克隆数据仓 → build_derived → 打包 → 上传前包检查 →（受闸控制）上传到数据前缀。
#   · **默认只检查**：不连 COS 写、不上传、不动任何指针。与现有 deploy.yml 的数据发布并行跑，各自独立。
#     只有「发布闸」（Publish gate 一步，逻辑见那一步的注释）放行时，后面的上传步骤才会跑：
#       - 正式前缀：直接放行（deploy.yml 不再写数据，本流程是唯一写者；overview#490 用户定，不再用仓库变量开关），且 prod_ref／text_ref 都是 main；
#       - 演练：手动 target=staging，整条流水线写 staging/ 前缀，不碰正式前缀，不看开关；
#       - 只传 sitemap：手动 only_sitemaps=true，只往 [前缀/]sitemaps/ 这个新目录写，不看开关（翻开关前把 sitemap 先放上去）。
#     **任何上传（包括演练）都只接受 prod_ref／text_ref 都是 main**；别的 ref 必须显式勾 allow_ref_override。
#   · COS 密钥只出现在上传步骤的 step 级 env 里，不进 job 级 env（ops/tests/test_data_workflow.py 守着）。
#     但同一个 job 里会跑数据仓所选 ref 的 build_derived.py，GitHub 托管 runner 上同一台机器的后续步骤挡不住它（可 sudo、可留后台进程），
#     所以真正的防线是"带密钥的上传只跑 main 上的代码"（和现在 deploy.yml 的信任模型一致：main 由数据仓维护者把关）；
#     勾 allow_ref_override 等于让那个分支的代码在带密钥的 job 里跑，只给可信分支用。彻底隔离要把生成和发布拆成两个 job（见 PR 讨论）。
#   · 检查沿用 deploy.yml 里的三道基础闸（ops/data-package-verify.sh，从 deploy.yml 抽出）＋ P0 的 ops/data-package-check.mjs
#     （**只报告，不拦**，两周后校准阈值再开阻断）＋ h1 条目与 current/ 逐字节抽样比对（只报告）。
#   · 上传沿用 deploy.yml 同一套命令：decide（数据没变就跳过）→ current/ 与 h1 条目并行同步（动态并发、state 缓存、写前标记）→ 写同步标记；
#     之后生成并上传条目 sitemap（scripts/upload-sitemaps.mjs，路由代理从 sitemaps/ 取）。state 缓存键与 deploy.yml 的正式站键相同，
#     所以第一次接管时继承 deploy.yml 最后一次的 state。
#   · latest.json 里的 webCommitId：打包出来的 latest.json 没有这个字段（原来由 deploy.yml 注入）。读它的人（promote=data、
#     回滚计划、/api/version）切到 web.json 之前还在用，所以上传前从线上现行 latest.json 带过来，不让数据发布把它抹掉。
#   · 刷新（失效）、上线后抽查、告警、h1 文本（每次重写约 3.7 GB，按设计 §5 走独立任务）在后续 PR 里加。
#
# 两条流程（2026-10-18 用户定：index 与 text 拆开、独立发布；产物路径、COS 前缀沿用原样）：
#   · flow=text ：book-text 取 main，book-index **钉在线上 latest.json 记的 productionCommitId**——只推进文本。自动：
#                 每小时一次轻检查（book-text HEAD 与线上 textCommitId 一样、或有别的数据 run 在跑就几秒结束），
#                 每天 UTC 21:43 照旧完整跑一趟兜底（打包脚本改了、上次同步半途失败、sitemap 没传完）。
#   · flow=index：book-index 取 main（或手填），book-text **钉在线上 textCommitId**——只推进索引。只手动（近期改动大）。
#   · flow=both ：两个仓都按输入，即拆分之前的做法，只手动。
#   钉住的一边就是线上正在用的那一版，打包产物里它那部分不变，增量同步只传真正变了的对象。
#   钉住的 commit 来自线上指针（只有本流程在发布闸下写），所以发布闸把它当作和 main 同等可信。
# 并发：每条流程一个 workflow 级组（publish-data-text／-index／-both），互相不会把对方排队的 run 顶掉；
#   真正写正式前缀的 package 任务共用一把锁 publish-data-writer，任何时刻只有一个写者。不取消在跑的。

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'index = 只发 book-index（book-text 钉在线上版本）；text = 只发 book-text（book-index 钉在线上版本）；both = 两个仓都按下面的 ref（拆分前的做法）'
        type: choice
        options: [index, text, both]
        default: index
      prod_ref:
        description: 'book-index 的分支／tag／commit（默认 main）；flow=text 时忽略（钉在线上版本）'
        type: string
        default: main
      text_ref:
        description: 'book-text 的分支／tag／commit（默认 main）；flow=index 时忽略（钉在线上版本）'
        type: string
        default: main
      target:
        description: 'production = 正式前缀（上传）；staging = 演练：整条流水线写 staging/ 前缀，不碰正式前缀，不看开关。两者都只接受 prod_ref／text_ref 是 main'
        type: choice
        options: [production, staging]
        default: production
      only_sitemaps:
        description: '只生成并上传条目 sitemap 到 [前缀/]sitemaps/（新目录，不动已有对象）；其余上传步骤全部跳过'
        type: boolean
        default: false
      force_sync:
        description: '演练专用（只在 target=staging 时生效）：即使数据与脚本都没变，也强制走数据同步，让 refresh／verify-live／告警路径真跑一遍。target=production 时忽略（日志里会写一行说明）'
        type: boolean
        default: false
      mark_code_pointer:
        description: '演练专用（只在 target=staging 时生效）：让这次上传的 staging/latest.json 带 codePointer 标记，演练“读者以 web.json 为准”那一路。正式前缀不受它影响：那里的上传一律带标记（overview#470 P1 方案 A）'
        type: boolean
        default: false
      allow_ref_override:
        description: '允许 prod_ref／text_ref 不是 main 时仍上传（回滚＝重发上一版数据、用新格式分支演练）。默认不允许：别的 ref 只做检查。勾上＝所选 ref 的代码会在带密钥的 job 里跑，只给可信分支用'
        type: boolean
        default: false
  # 定时都是 flow=text。整点后 17 分：轻检查（没变化几秒结束）；UTC 21:43：每天一次完整跑（见 check 任务）
  schedule:
    - cron: '17 * * * *'
    - cron: '43 21 * * *'

permissions:
  contents: read

concurrency:
  group: publish-data-${{ inputs.flow || 'text' }}
  cancel-in-progress: false

env:
  # >>> hosts：由 ops/sync-hosts.mjs 从 config/hosts.json 生成，勿手改；改域名请改 config/hosts.json 后重跑
  HOST_DATA: https://data.openguji.com
  HOST_LEGACY_DATA: https://data.kaiyuanguji.com
  HOST_API: https://api.kaiyuanguji.com
  HOST_SITE: https://www.openguji.com
  HOST_SITE_APEX: https://openguji.com
  HOST_STAGING: https://staging.kaiyuanguji.com
  HOST_SSR_TEST: https://ssr-test.kaiyuanguji.com
  HOST_LEGACY_SITE: https://www.kaiyuanguji.com
  HOST_LEGACY_APEX: https://kaiyuanguji.com
  HOST_OAUTH_ISSUER: https://www.kaiyuanguji.com
  # <<< hosts

jobs:
  # 定时触发时先比对数据仓 HEAD 与线上（正式站）latest.json，没变化就跳过（同 deploy.yml 的 check，口径一致）。手动一律跑。
  check:
    runs-on: ubuntu-latest
    # issues: write 只给落后告警那一步开 issue 用；actions: read 给轻检查看有没有别的数据 run 在跑
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
    steps:
      # 手动一律跑。定时（都是 flow=text）先看有没有别的数据 run 在跑或排队：有就让路（下个小时再来），
      # 免得在 package 的写锁前排队——GitHub 同一把锁只留一个排队项，后来的会顶掉先排队的手动 index 发布。查不了就当没有。
      # 然后分两种：
      #   · UTC 21:43 那一条（以及取不到是哪条的）：一律跑——「该不该同步」由 package 里的 Decide COS data sync 判
      #     （两仓 commit＋打包脚本指纹＋上次同步是否完整），这里只比 commit 会漏掉打包脚本改了、上次同步半途失败、sitemap 没传完；
      #   · 每小时那一条（轻检查）：book-text main 的 HEAD 与线上 textCommitId 一样就跳过。查不到就当有变化、照跑。
      # 轻检查把线上与 HEAD 的 commit 交给落后告警（每日完整跑不碰网络、直接放行，告警只在轻检查里有数据）。
      - name: Compare data repo HEADs with deployed latest.json
        id: compare
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "· 非定时触发，直接跑"
            exit 0
          fi
          BUSY=$(gh run list --workflow data.yml --limit 20 --json databaseId,status \
                   --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "· 有 $BUSY 个数据 run 在跑或排队：这次定时让路（不在写锁前排队、不顶掉手动发布），下个小时再来"
            exit 0
          fi
          if [ "$SCHEDULE" != "17 * * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "· 每日完整跑：定时一律跑，是否同步由 package 内的同步标记判定"
            exit 0
          fi
          LIVE=$(curl -sf --max-time 30 "$HOST_DATA/latest.json?cb=$(date +%s)" || echo '{}')
          LIVE_PROD=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('productionCommitId',''))" 2>/dev/null || echo '')
          LIVE_TEXT=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('textCommitId',''))" 2>/dev/null || echo '')
          # 查不到（网络抖动）就留空，下面按「无法确认」处理、照常跑，不让这一步因此失败
          HEAD_PROD=$(git ls-remote https://github.com/open-guji/book-index.git refs/heads/main | cut -f1 || true)
          HEAD_TEXT=$(git ls-remote https://github.com/open-guji/book-text.git refs/heads/main | cut -f1 || true)
          echo "book-index: live=$LIVE_PROD head=$HEAD_PROD（flow=text 不发它）"
          echo "book-text:  live=$LIVE_TEXT head=$HEAD_TEXT"
          { echo "live_prod=$LIVE_PROD"; echo "head_prod=$HEAD_PROD"; echo "live_text=$LIVE_TEXT"; echo "head_text=$HEAD_TEXT"; } >> "$GITHUB_OUTPUT"
          if [ -n "$HEAD_TEXT" ] && [ "$LIVE_TEXT" = "$HEAD_TEXT" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "· book-text 没变，跳过"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "· book-text 有更新（或无法确认），发布文本"

      # 落后告警（只在定时跑里）：定时会被 GitHub 延迟甚至偶尔丢掉，上传也可能连着失败；
      # book-text main 的 HEAD 与线上对不上、且那个提交已经过了 6 小时（文本每小时自动发），就开一张（或续一条）data-alert issue。
      # 数据流程已拆出（2026-10-08 起写死，不再看仓库变量），deploy.yml 不写数据，这里是唯一写者。取不到提交时间就不告警（宁可漏一晚，不误报）。
      - name: Data freshness alarm (36 h)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIVE_PROD: ${{ steps.compare.outputs.live_prod }}
          HEAD_PROD: ${{ steps.compare.outputs.head_prod }}
          LIVE_TEXT: ${{ steps.compare.outputs.live_text }}
          HEAD_TEXT: ${{ steps.compare.outputs.head_text }}
          LAG_HOURS: '6'
        run: |
          now=$(date +%s); late=""
          check() {   # check <仓> <live> <head>
            local repo="$1" live="$2" head="$3" d t h
            [ -n "$head" ] && [ "$live" != "$head" ] || return 0
            # 线上指针取不到或不是完整 commit（网络抖动、latest.json 暂时不可读）：不知道线上是什么，就不拿 HEAD 的年龄当落后的证据
            printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$' || { echo "· $repo：取不到有效的线上 commit（'${live:0:12}'），跳过落后判断"; return 0; }
            d=$(gh api "repos/open-guji/$repo/commits/$head" --jq .commit.committer.date 2>/dev/null) || { echo "· $repo：取不到 ${head:0:12} 的提交时间，跳过"; return 0; }
            t=$(date -d "$d" +%s 2>/dev/null) || return 0
            h=$(( (now - t) / 3600 ))
            echo "· $repo：HEAD ${head:0:12}（${h} 小时前）线上 ${live:0:12}"
            if [ "$h" -ge "$LAG_HOURS" ]; then late="$late\n- $repo：HEAD \`${head:0:12}\` 已提交 ${h} 小时，线上还是 \`${live:0:12}\`"; fi
          }
          # 只看 book-text：book-index 改成手动发布（flow=index），落后是常态，不告警
          check book-text "$LIVE_TEXT" "$HEAD_TEXT"
          [ -n "$late" ] || { echo "· 没有落后超过 ${LAG_HOURS} 小时的数据"; exit 0; }
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf '文本数据落后超过 %s 小时（book-text 每小时自动发布，这段时间都没发上去）：%b\n\n- 本次定时检查：%s\n- 排查：看最近几次 `data.yml` 的 run（`package` 任务红在哪一步）；手动补发：Actions → Data package check and publish → Run workflow（`flow=text`、`target=production`）。\n- 补发成功后线上会追上，关本 issue。' "$LAG_HOURS" "$late" "$RUN_URL")
          gh label create data-alert --color B60205 --description '数据流程告警（data.yml）' 2>/dev/null || true
          N=$(gh issue list --label data-alert --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || echo '')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; echo "已在告警 issue #$N 续报" >> "$GITHUB_STEP_SUMMARY"
          else gh issue create --label data-alert --title "数据落后告警：$(date -u +%m-%d\ %H:%MZ)" --body "$BODY"; echo "已开告警 issue" >> "$GITHUB_STEP_SUMMARY"; fi

  package:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_run == 'true' }}
    # 只检查约 15 分钟；上传全量变化（schema 换代）时 current/ 与 h1 各十几万个对象，预留到 2 小时
    timeout-minutes: 120
    # 演练写的 staging/ 前缀，deploy.yml 的测试站构建也写（拆出之前）：两边用同一把锁（deploy.yml 的 build 任务那把），
    # 不会交错写同一批对象和指针。
    # 正式前缀：index／text／both 三条流程各在自己的 workflow 级组里排队，写正式前缀的 package 共用 publish-data-writer 这把锁，
    # 任何时刻只有一个写者（轻检查遇到别的数据 run 在跑会让路，不在这把锁前排队，所以不会顶掉手动的 index 发布）。
    concurrency:
      group: ${{ inputs.target == 'staging' && 'deploy-edgeone-build-staging' || 'publish-data-writer' }}
      cancel-in-progress: false
    env:
      IN_PROD_REF: ${{ inputs.prod_ref }}
      IN_TEXT_REF: ${{ inputs.text_ref }}
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sitemaps_only: ${{ steps.gate.outputs.sitemaps_only }}
      prefix: ${{ steps.gate.outputs.prefix }}
      # current/ 同步成功＝数据真的换了（跳过、失败、没放行都是 false）：刷新和上线后抽查只看它
      data_published: ${{ steps.cos_sync.outcome == 'success' }}
      old_prod_commit: ${{ steps.old_commits.outputs.prod }}
      old_text_commit: ${{ steps.old_commits.outputs.text }}
      new_prod_commit: ${{ steps.clone.outputs.index_sha }}
      new_text_commit: ${{ steps.clone.outputs.text_sha }}
    steps:
      # 不把 GITHUB_TOKEN 留在工作区的 git 配置里：下面会跑数据仓里的 build_derived.py（所选 ref 的代码），不该让它读得到令牌
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # S2：数据产物统一输出到 nextjs/ 之外，脚本都从 KYG_DATA_ROOT 读写（同 deploy.yml）
      - name: Set data output root (outside nextjs/)
        run: echo "KYG_DATA_ROOT=$RUNNER_TEMP/kyg-data" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      # 按流程定两个仓各用哪一版：flow=text 把 book-index 钉在线上（目标前缀的）latest.json 记的 productionCommitId，
      # flow=index 把 book-text 钉在线上 textCommitId，flow=both 都按输入。定时没有输入，一律 text。
      # 钉不住（读不到线上指针、字段不是完整 commit）就停：不能拿 main 顶替，那等于把另一个仓也一起发了。
      - name: Resolve flow refs
        id: flow
        env:
          FLOW: ${{ inputs.flow || 'text' }}
          PREFIX: ${{ inputs.target == 'staging' && 'staging' || '' }}
        run: |
          prod="${IN_PROD_REF:-main}"; text="${IN_TEXT_REF:-main}"; pinned=none; field=""
          case "$FLOW" in
            text)  field=productionCommitId; pinned=prod ;;
            index) field=textCommitId; pinned=text ;;
            both)  ;;
            *) echo "::error::未知的 flow：$FLOW"; exit 1 ;;
          esac
          if [ -n "$field" ]; then
            P="${PREFIX:+$PREFIX/}"
            SHA=$(curl -sf --max-time 30 "$HOST_DATA/${P}latest.json?cb=$(date +%s)" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin).get(sys.argv[1],''))" "$field" 2>/dev/null || true)
            if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::flow=$FLOW 要把另一个仓钉在线上版本，但读不到线上 ${P}latest.json 的 $field（'${SHA:0:12}'），停止"
              exit 1
            fi
            if [ "$pinned" = prod ]; then prod="$SHA"; else text="$SHA"; fi
          fi
          { echo "prod_ref=$prod"; echo "text_ref=$text"; echo "pinned=$pinned"; } >> "$GITHUB_OUTPUT"
          echo "· flow=$FLOW：book-index @ ${prod:0:12}$([ "$pinned" = prod ] && echo '（钉在线上）')，book-text @ ${text:0:12}$([ "$pinned" = text ] && echo '（钉在线上）')"
          { echo "### 流程"; echo "- flow=\`$FLOW\`　book-index=\`${prod:0:12}\`　book-text=\`${text:0:12}\`　钉住=\`$pinned\`"; } >> "$GITHUB_STEP_SUMMARY"

      # 数据仓 ref：来自上一步（定时一律 main＋钉住的一边；手动可指定联调分支）。校验同 deploy.yml 的 resolve
      - name: Check data repo refs
        id: refs
        env:
          FLOW_PROD_REF: ${{ steps.flow.outputs.prod_ref }}
          FLOW_TEXT_REF: ${{ steps.flow.outputs.text_ref }}
        run: |
          for pair in "prod_ref:$FLOW_PROD_REF" "text_ref:$FLOW_TEXT_REF"; do
            k="${pair%%:*}"; v="${pair#*:}"; v="${v:-main}"
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._/-]+$'; then echo "❌ $k 含非法字符：$v"; exit 1; fi
            if ! git check-ref-format "refs/heads/$v" >/dev/null 2>&1; then echo "❌ $k 不是合法的 git ref 名：$v"; exit 1; fi
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      # 发布闸：后面所有会写 COS 的步骤都只看这一步的输出。逻辑从上到下，第一条命中的生效：
      #   ① prod_ref／text_ref 不是 main 且没勾 allow_ref_override → 不放行（任何目标，演练也一样）：
      #      带密钥的上传只跑 main 上的代码；联调分支只做检查
      #   ② target=staging（手动演练）           → 放行，写 staging/ 前缀，不碰正式前缀，不看开关
      #   ③ only_sitemaps（手动）                 → 放行，只写 sitemaps/ 新目录，不看开关
      #   ④ 其余（正式前缀，prod_ref／text_ref 是 main） → 放行，上传到正式前缀（此时 deploy.yml 不再写数据，本流程是唯一写者）
      #   ⑤ 其它                                  → 只做检查，不上传（deploy.yml 仍是正式前缀的写者；定时跑也走这一条）
      # 勾了 allow_ref_override 且 refs 不是 main：照 ②③④ 的条件放行（回滚重发上一版数据、P2 用新格式分支演练），
      # 并在摘要里写明"所选 ref 的代码会在带密钥的 job 里跑"。
      # 输出：publish、sitemaps_only（只传 sitemap）、prefix（空＝正式站根，staging＝演练前缀）、why（写进摘要）。
      - name: Publish gate
        id: gate
        env:
          TARGET: ${{ inputs.target || 'production' }}
          ONLY_SITEMAPS: ${{ inputs.only_sitemaps }}
          ALLOW_OVERRIDE: ${{ inputs.allow_ref_override }}
          SPLIT_VAR: 'true'
          PROD_REF: ${{ steps.refs.outputs.prod_ref }}
          TEXT_REF: ${{ steps.refs.outputs.text_ref }}
          PINNED: ${{ steps.flow.outputs.pinned }}
        run: |
          publish=false; sitemaps_only=false; prefix=''; why=''
          [ "$ONLY_SITEMAPS" = true ] && sitemaps_only=true
          [ "$TARGET" = staging ] && prefix=staging
          # 钉在线上版本的那一边（PINNED=prod|text）当作 main：它就是线上正在用的 commit，只有本流程在发布闸下写过
          refs_main=true
          { { [ "$PROD_REF" = main ] || [ "$PINNED" = prod ]; } && { [ "$TEXT_REF" = main ] || [ "$PINNED" = text ]; }; } || refs_main=false
          if [ "$refs_main" != true ] && [ "$ALLOW_OVERRIDE" != true ]; then
            why="prod_ref／text_ref 不是 main（${PROD_REF}／${TEXT_REF}）：带密钥的上传只跑 main 上的代码，只做检查（确需用别的 ref 请勾 allow_ref_override）"
          elif [ "$TARGET" = staging ]; then
            publish=true; why="演练：写 staging/ 前缀，不碰正式前缀"
          elif [ "$sitemaps_only" = true ]; then
            publish=true; why="only_sitemaps：只往正式前缀的 sitemaps/ 新目录写"
          elif [ "$SPLIT_VAR" = true ]; then
            publish=true; why="正式前缀：上传"
          else
            why="SPLIT_DATA_FLOW 未打开：只做检查，不上传（deploy.yml 仍是正式前缀的写者）"
          fi
          if [ "$publish" = true ] && [ "$refs_main" != true ]; then
            why="$why；⚠ allow_ref_override：用 ${PROD_REF}／${TEXT_REF} 上传，所选 ref 的 build_derived.py 会在带密钥的 job 里跑，只给可信分支用"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sitemaps_only=$sitemaps_only" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "· 发布闸：publish=$publish sitemaps_only=$sitemaps_only prefix='${prefix:-（正式站根）}' — $why"
          { echo "### 发布闸"; echo "- publish=\`$publish\`　sitemaps_only=\`$sitemaps_only\`　前缀=\`${prefix:-（根）}\`"; echo "- $why"; } >> "$GITHUB_STEP_SUMMARY"

      # book-text 浅拉要现压 1.75 GB 的包，实测同一个 commit 从 2.6 分变到 23 分：.git 放进 actions/cache 做增量
      # （逻辑与 deploy.yml 同一份，见 ops/clone-cached.sh 的头注释）
      - name: Restore git cache — book-index
        id: gc_index
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ steps.refs.outputs.prod_ref }}
          restore-keys: |
            git-cache-v1-book-index-

      - name: Restore git cache — book-text
        id: gc_text
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ steps.refs.outputs.text_ref }}
          restore-keys: |
            git-cache-v1-book-text-

      - name: Clone index data repos
        id: clone
        run: |
          source ops/clone-cached.sh
          clone_cached book-index book-index "${{ steps.refs.outputs.prod_ref }}"
          clone_cached book-text book-text "${{ steps.refs.outputs.text_ref }}"
          echo "index_sha=$(git -C book-index rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "text_sha=$(git -C book-text rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Save git cache — book-index
        if: ${{ steps.gc_index.outputs.cache-hit != 'true' && steps.clone.outputs.index_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ steps.clone.outputs.index_sha }}

      - name: Save git cache — book-text
        if: ${{ steps.gc_text.outputs.cache-hit != 'true' && steps.clone.outputs.text_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ steps.clone.outputs.text_sha }}

      # schema-v2（overview#458）：同 deploy.yml——旧 schema 的仓没有 build/build_derived.py 就跳过；退出码非 0 = 自校验失败
      - name: Build derived data (schema-v2)
        run: |
          if [ -f book-index/build/build_derived.py ]; then
            D="$RUNNER_TEMP/book-index-derived"
            s=$SECONDS; echo "▶ build_derived 开始 $(date -u +%H:%M:%S) UTC"
            # overview#506 C：_has_text／_has_collated 从 book-text 的 index/texts 推（脚本支持且目录在才传）
            TI=""; if [ -d "$GITHUB_WORKSPACE/book-text/index/texts" ] && grep -q -- "--text-index" book-index/build/build_derived.py; then TI="--text-index $GITHUB_WORKSPACE/book-text/index/texts"; fi
            (cd book-index && python3 build/build_derived.py --out "$D" $TI)
            echo "✔ build_derived 用时 $((SECONDS - s)) 秒，产物 $(du -sh "$D" | cut -f1)"
            echo "BOOK_INDEX_DERIVED_DIR=$D" >> "$GITHUB_ENV"
            # 05 overview#506 E：旧字段回退已清零；B5-3.2 起严格是 derived.mjs 的默认（STRICT_DERIVED 不再起作用，留着无害）
            echo "STRICT_DERIVED=1" >> "$GITHUB_ENV"
          else
            echo "::error::book-index 没有 build/build_derived.py：打包不再回退读源档（B5-3.2，GUJI-299），必须有 schema-v2 产物"
            exit 1
          fi

      # 对读章生僻字子集字体（GUJI-701）：bundle-data 要 fontTools＋hanamin；三处打包共用同一脚本、同一版本，产物逐字节一致
      - name: Setup chapter-font tools
        run: bash ops/setup-chapter-fonts.sh

      - name: Bundle data
        working-directory: nextjs
        env:
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
          BOOK_TEXT_DIR: ${{ github.workspace }}/book-text
        run: |
          s=$SECONDS; echo "▶ 打包数据开始 $(date -u +%H:%M:%S) UTC"
          node scripts/bundle-data.mjs
          echo "✔ 打包数据用时 $((SECONDS - s)) 秒"

      - name: Verify bundled data (basic gates)
        run: bash ops/data-package-verify.sh book-index

      # P0 的包检查，只报告（脚本恒退出 0；脚本自身出错才非零，这一步 continue-on-error，只标红不拦）。
      # 基线＝正式站现行的 latest.json／meta.json。两周后按实测波动校准阈值再开阻断（--enforce）。
      - name: Data package check (report-only, overview#470)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node ops/data-package-check.mjs \
            --baseline "$HOST_DATA" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "$RUNNER_TEMP/data-package-stats.json"

      - name: Upload data package stats
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: data-package-stats-${{ github.run_id }}
          path: ${{ runner.temp }}/data-package-stats.json
          if-no-files-found: ignore
          retention-days: 30

      # h1 条目与 current/ 逐字节抽样比对（只报告）：这里先在本地把 h1 条目打出来再比（不含 h1 文本，见文件头）
      - name: h1 entry vs current parity sampling (report-only, overview#470)
        continue-on-error: true
        timeout-minutes: 15
        working-directory: nextjs
        env:
          SAMPLE_SIZE: '200'
          SAMPLE_SEED: ${{ github.run_id }}
        run: |
          set +e
          node scripts/bundle-hashed.mjs > "$RUNNER_TEMP/bundle-hashed.log" 2>&1; B=$?
          if [ "$B" -ne 0 ]; then
            tail -20 "$RUNNER_TEMP/bundle-hashed.log"
            echo "::warning title=h1 条目打包失败::bundle-hashed.mjs 退出码 $B（只报告，不拦）"
            exit 0
          fi
          node scripts/verify-hashed-parity.mjs > "$RUNNER_TEMP/parity-entry.log" 2>&1; E1=$?
          {
            echo "## h1 条目与 current/ 逐字节比对（抽样，只报告）"
            echo
            if [ "$E1" -eq 0 ]; then icon="✅"; else icon="🟡"; fi
            echo "- $icon 退出码 $E1：$(grep -E '逐字一致' "$RUNNER_TEMP/parity-entry.log" | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/parity-entry.log"
          [ "$E1" -eq 0 ] || echo "::warning title=h1 与 current/ 抽样不一致::条目比对退出码 $E1（只报告，不拦）"
          exit 0

      # =====================================================================================================
      # 上传（overview#470 P1，设计 §2）。下面每一步都只在「发布闸」放行时才跑；COS 密钥只在 step 级 env 里。
      # 命令与 deploy.yml 的同名步骤一致（decide／state 缓存／动态并发／写前标记／同步标记），改一边要改另一边的话在注释里写明。
      # =====================================================================================================

      # latest.json 里的 webCommitId 带过来：打包出来的 latest.json 没有这个字段（原来由 deploy.yml 在打包后注入）。
      # promote=data、回滚计划、/api/version 切到 web.json 之前还在读它；数据流程上传 latest.json 时若不带，就把它抹掉了。
      # 取不到（首次／线上没有）就不动。同时把「线上现行的 web commit」输出给后面写同步标记用。
      - name: Carry over webCommitId from live latest.json
        id: carry
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        env:
          PREFIX: ${{ steps.gate.outputs.prefix }}
          SPLIT_VAR: 'true'
          TARGET: ${{ inputs.target || 'production' }}
          MARK_INPUT: ${{ inputs.mark_code_pointer }}
        run: |
          P="${PREFIX:+$PREFIX/}"
          URL="$HOST_DATA/${P}latest.json?t=$(date +%s)"
          BODY="$RUNNER_TEMP/live-latest.json"
          CODE=$(curl -s -o "$BODY" -w '%{http_code}' --max-time 30 "$URL" || echo 000)
          case "$CODE" in
            200)
              # 线上有 latest.json：取不到 webCommitId 字段是真的没有（老指针）；但内容读不懂就是出错了，不能当成"没有"
              W=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('webCommitId','') if isinstance(d, dict) else sys.exit(3))" "$BODY") \
                || { echo "::error::线上 ${P}latest.json 不是合法的指针 JSON，停止发布（不能在读不懂线上指针的时候覆盖它）"; exit 1; }
              ;;
            404)
              echo "· 线上还没有 ${P}latest.json（首次发布），不带 webCommitId"; W="" ;;
            *)
              echo "::error::取线上 ${P}latest.json 失败（HTTP $CODE），停止发布：取不到就无法保住指针里的 webCommitId（promote=data、回滚计划、/api/version 还在读它）"
              exit 1 ;;
          esac
          # codePointer 标记（overview#470 P1 方案 A）：读者见到它就以 web.json 为准（ops/code_pointer.py）。
          # 只有"数据流程成为写者"的上传才带：正式前缀的上传（本步骤不跑 only_sitemaps，所以走到这里
          # 的正式前缀上传一定是开关打开的）；staging 演练默认不带，勾 mark_code_pointer 才带，用来演练读者的这一路。
          MARK=false
          if [ -z "$PREFIX" ] && [ "$SPLIT_VAR" = true ]; then MARK=true
          elif [ "$PREFIX" = staging ] && [ "$TARGET" = staging ] && [ "$MARK_INPUT" = true ]; then MARK=true; fi
          if printf '%s' "$W" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "· 带过来线上现行 webCommitId=${W:0:12}"
            echo "web_commit=$W" >> "$GITHUB_OUTPUT"
          else
            [ -z "$W" ] || { echo "::error::线上 webCommitId 不是完整 commit：'$W'，停止发布"; exit 1; }
            echo "· 线上 ${P}latest.json 里没有 webCommitId 字段，latest.json 保持不带该字段"
            echo "web_commit=" >> "$GITHUB_OUTPUT"
          fi
          python3 - "$W" "$MARK" <<'PY'
          import json, os, sys
          p = os.path.join(os.environ['KYG_DATA_ROOT'], 'latest.json')
          with open(p) as f:
              d = json.load(f)
          if sys.argv[1]:
              d['webCommitId'] = sys.argv[1]
          if sys.argv[2] == 'true':
              d['codePointer'] = 'web.json'
          with open(p, 'w') as f:
              json.dump(d, f)
          PY
          if [ "$MARK" = true ]; then
            echo "· latest.json 加标记 codePointer=web.json：读者（回滚计划／核对、/api/version、晋升）此后以 web.json 为准"
            echo "- latest.json 带 \`codePointer: web.json\` 标记" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "· 不加 codePointer 标记（读者仍以 latest.json.webCommitId 为准）"
          fi
          echo "mark=$MARK" >> "$GITHUB_OUTPUT"

      # W2-3：h1 指针翻转之前记下旧 root，刷新阶段据此算「哪些条目变了」（item-changes.mjs）。取不到就留空，按全部新增处理。
      - name: Record previous h1 root
        id: old_root
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        env:
          PREFIX: ${{ steps.gate.outputs.prefix }}
        run: |
          P="${PREFIX:+$PREFIX/}"
          R=$(curl -sf "$HOST_DATA/${P}h1/manifest-root.json?t=$(date +%s)" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('root',''))" 2>/dev/null || true)
          echo "old_h1_root=$R" >> "$GITHUB_OUTPUT"
          echo "OLD_H1_ROOT=$R" >> "$GITHUB_ENV"
          echo "· 发布前 h1 root：${R:-（无）}"

      # 发布前线上的数据 commit：告警里写"回滚＝用这两个 commit 重发"（data.yml 的 prod_ref／text_ref＋allow_ref_override）
      - name: Record previous published commits
        id: old_commits
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        env:
          PREFIX: ${{ steps.gate.outputs.prefix }}
        run: |
          P="${PREFIX:+$PREFIX/}"
          J=$(curl -sf --max-time 30 "$HOST_DATA/${P}latest.json?t=$(date +%s)" || echo '{}')
          g() { echo "$J" | python3 -c "import json,sys; print(json.load(sys.stdin).get('$1',''))" 2>/dev/null || true; }
          echo "prod=$(g productionCommitId)" >> "$GITHUB_OUTPUT"
          echo "text=$(g textCommitId)" >> "$GITHUB_OUTPUT"
          echo "· 发布前线上数据：book-index=$(g productionCommitId | cut -c1-12) book-text=$(g textCommitId | cut -c1-12)"

      - name: Decide COS data sync (skip when data unchanged)
        id: cos_decide
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          FORCE_SYNC: ${{ inputs.force_sync }}
          TARGET: ${{ inputs.target || 'production' }}
        run: |
          cd nextjs
          export PROD_COMMIT="${{ steps.clone.outputs.index_sha }}"
          export TEXT_COMMIT="${{ steps.clone.outputs.text_sha }}"
          node scripts/cos-sync-decision.mjs decide
          # force_sync：只对手动演练（target=staging）生效。同一个输出名后写的覆盖先写的，所以这里把 skip 改回 false，
          # 后面所有"skip != true"的步骤（同步、写标记、sitemap、refresh／verify-live）就都会跑；target=production 一律忽略。
          if [ "$FORCE_SYNC" = true ]; then
            if [ "$TARGET" = staging ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "· force_sync：演练强制走数据同步（decide 的结果被覆盖为不跳过）"
              echo "- force_sync=\`true\`：演练强制走数据同步" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "· force_sync 只对 target=staging 生效，target=$TARGET 下已忽略"
            fi
          fi

      - name: COS sync state — cache key
        id: cos_state_key
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' && steps.cos_decide.outputs.skip != 'true' }}
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: echo "bucket=$(printf '%s' "$COS_BUCKET" | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # 键与 deploy.yml 的同名缓存相同（target 取 production／staging），第一次接管时继承 deploy.yml 最后一次的 state；
      # 取不到或不可信（state-guard 的写前标记对不上）就退回 LIST 重建。要作废：键里的版本号加一（两个文件一起改）
      - name: COS sync state — restore
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' && steps.cos_decide.outputs.skip != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: nextjs/.next/.sync-state.json
          key: cos-sync-state-v2-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cos-sync-state-v2-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-

      - name: COS h1 state — restore
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' && steps.cos_decide.outputs.skip != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            nextjs/.next/.sync-h1-state.json
            nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-state-v1-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cos-h1-state-v1-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-

      # current/ 与 h1 条目两路并行（h1 文本按设计 §5 是单独任务，不在这里）。current/ 失败整步失败（数据没上线）；
      # h1 条目失败只警告（前端默认不读 h1/），但不写同步标记，下次不会把没传全的当成已同步。
      # 并发：两路共用 COS_TOTAL_BUDGET（80），按各路待传数动态分配（scripts/lib/cos-slots.mjs，登记目录 COS_PLAN_DIR）。
      # 定时的夜间发布从 COS 重新 LIST 重建 state（SYNC_REBUILD_STATE=1，同 deploy.yml 的定时路径）。
      - name: Sync data to Tencent COS — current/ + h1 entry, in parallel
        id: cos_sync
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' && steps.cos_decide.outputs.skip != 'true' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          COS_PLAN_DIR: ${{ runner.temp }}/cos-plan
          COS_TOTAL_BUDGET: '80'
          SYNC_REBUILD_STATE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          cd nextjs
          LOGS="$RUNNER_TEMP/cos-sync-logs"; mkdir -p "$LOGS"
          rm -rf "$COS_PLAN_DIR"
          set +e
          ( s=$SECONDS; COS_CONCURRENCY=48 node scripts/sync-to-cos.mjs; rc=$?; echo "· current/ 一路共用时 $((SECONDS - s)) 秒（exit $rc）"; exit $rc ) > "$LOGS/current.log" 2>&1 &
          P_CUR=$!
          ( s=$SECONDS; node scripts/bundle-hashed.mjs && { echo "· h1 条目打包用时 $((SECONDS - s)) 秒"; COS_CONCURRENCY=32 node scripts/sync-h1-to-cos.mjs; }; rc=$?; echo "· h1 条目一路共用时 $((SECONDS - s)) 秒（exit $rc）"; exit $rc ) > "$LOGS/h1-entry.log" 2>&1 &
          P_H1=$!
          ( while :; do sleep 60; node scripts/sync-heartbeat.mjs "$LOGS" || true; done ) &
          HB=$!
          wait $P_CUR; R_CUR=$?
          wait $P_H1;  R_H1=$?
          kill $HB 2>/dev/null
          for pair in "current/:current:$R_CUR" "h1 条目:h1-entry:$R_H1"; do
            title="${pair%%:*}"; rest="${pair#*:}"; f="${rest%%:*}"; rc="${rest##*:}"
            echo "::group::COS 同步 · $title（exit $rc）"
            tr '\r' '\n' < "$LOGS/$f.log" | awk 'BEGIN{last=""} { if ($0 ~ /^  [a-z0-9-]+: [0-9]+\/[0-9]+ \(/) { last=$0; next } if (last != "") { print last; last="" } print } END{ if (last != "") print last }'
            echo "::endgroup::"
          done
          if [ "$R_CUR" -ne 0 ]; then
            echo "❌ current/ 同步失败（exit $R_CUR）——数据没有上线，整步失败"
            exit 1
          fi
          ALL_OK=true
          if [ "$R_H1" -ne 0 ]; then echo "::warning::h1 条目同步失败（exit $R_H1），只警告，不拦发布（前端默认不读 h1/）"; ALL_OK=false; fi
          echo "all_ok=$ALL_OK" >> "$GITHUB_OUTPUT"

      # 同步成功（current/ 那一路成功就会写新的 state）后把它存回缓存；失败或跳过时不存，免得把半截状态传给下一次
      - name: COS sync state — save
        if: ${{ steps.cos_sync.outcome == 'success' && steps.cos_state_key.outputs.bucket != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nextjs/.next/.sync-state.json
          key: cos-sync-state-v2-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: COS h1 state — save
        if: ${{ steps.cos_sync.outputs.all_ok == 'true' && steps.cos_state_key.outputs.bucket != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            nextjs/.next/.sync-h1-state.json
            nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-state-v1-${{ inputs.target || 'production' }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 两路都成功才写标记：下次三仓 commit 与打包脚本都没变时，据此跳过整段同步。
      # 注意：h1 文本这一路还不在本流程里（后续 PR 加单独任务），标记目前不覆盖它——h1 文本生产无读者，见设计 §5。
      - name: Mark COS sync complete
        if: ${{ steps.cos_sync.outputs.all_ok == 'true' }}
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          WEB_COMMIT_ID: ${{ steps.carry.outputs.web_commit }}
        run: |
          cd nextjs
          export PROD_COMMIT="${{ steps.clone.outputs.index_sha }}"
          export TEXT_COMMIT="${{ steps.clone.outputs.text_sha }}"
          node scripts/cos-sync-decision.mjs mark

      # GUJI-557：校对精灵图（proof/）真上传。独立于上面的数据同步：数据没变也跑，失败只警告（continue-on-error，脚本也以 0 退出），不影响发布结论。
      # 跟随发布闸的前缀：staging 演练写 staging/，正式发布写正式前缀（staging 演练 12 张 webp 全 GET 200、字节与 assets.json 一致后开放）。
      # 指针取自 book-text main（稀疏拉 proof/），资产取自 open-guji-dataset 公开 Release，逐册校验 sha256 后才传；COS 密钥沿用现有那三个，只在 step 级 env。
      - name: Fetch sprites pointers from book-text (sparse)
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/open-guji/book-text.git "$RUNNER_TEMP/book-text-pointers"
          git -C "$RUNNER_TEMP/book-text-pointers" sparse-checkout set proof
          echo "· book-text $(git -C "$RUNNER_TEMP/book-text-pointers" rev-parse --short HEAD)；指针 $(find "$RUNNER_TEMP/book-text-pointers/proof" -name sprites.pointer.json 2>/dev/null | wc -l) 个"

      - name: Sync proof sprites to Tencent COS
        if: ${{ steps.gate.outputs.publish == 'true' && steps.gate.outputs.sitemaps_only != 'true' }}
        continue-on-error: true
        working-directory: nextjs
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          SPRITES_UPLOAD: '1'
          SPRITES_RELEASE_REPO: open-guji/open-guji-dataset
          SPRITES_POINTER_ROOT: ${{ runner.temp }}/book-text-pointers
        run: node scripts/sync-proof-sprites.mjs

      # 刷新阶段要的"哪些条目变了"：在这里算（本地有刚打出来的 h1 根和分片，旧 root 在上面记过），交给 refresh 任务。
      # 不拦：算不出来 refresh 里就没有要失效的条目，最坏是条目页按 s-maxage（1 小时）自然过期。
      - name: Compute changed items
        id: item_changes
        if: ${{ steps.cos_sync.outcome == 'success' }}
        continue-on-error: true
        working-directory: nextjs
        env:
          ITEM_DATA_BASE: ${{ env.HOST_DATA }}${{ steps.gate.outputs.prefix && format('/{0}', steps.gate.outputs.prefix) || '' }}
          ITEM_CHANGES_OUT: ${{ runner.temp }}/item-artifact/item-changes.json
        run: |
          mkdir -p "$RUNNER_TEMP/item-artifact"
          node scripts/item-changes.mjs
          # 缓存实测要一个"没改动的热门条目"做对照页；refresh 任务没有本地打包产物，就在这里（有产物）挑好、随工件带过去。
          # 挑不出来（空文件）refresh 里会在摘要里明说"没检查"，不会悄悄跳过。
          node --input-type=module -e "
            import { resolveDataDirs } from './scripts/lib/data-dirs.mjs';
            import { hotItemIds } from './scripts/lib/item-http.mjs';
            import { writeFileSync } from 'node:fs';
            writeFileSync(process.env.RUNNER_TEMP + '/item-artifact/control-ids.txt', hotItemIds(resolveDataDirs().dataDir, 200).join(',') + '\n');
          "
          echo "· 对照页候选 $(tr ',' '\n' < "$RUNNER_TEMP/item-artifact/control-ids.txt" | grep -c .) 个"

      - name: Upload item changes
        if: ${{ steps.item_changes.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: item-changes
          path: ${{ runner.temp }}/item-artifact
          retention-days: 3

      # 线上这版 sitemap 是否用当前两个数据 commit 完整发布过（读 _meta.json＋索引）。没有／对不上（从没传过、上次传到一半失败、
      # 数据又变了）就强制重传：数据没变会在 decide 跳过同步，但路由代理需要这些对象；只看索引存在会把「旧索引＋缺分片」当成好的
      - name: Check whether this sitemap version was fully published
        id: sm_present
        if: ${{ steps.gate.outputs.publish == 'true' }}
        working-directory: nextjs
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          SITEMAP_META: '{"productionCommitId":"${{ steps.clone.outputs.index_sha }}","textCommitId":"${{ steps.clone.outputs.text_sha }}"}'
        run: node scripts/upload-sitemaps.mjs --check-meta

      # 条目 sitemap：数据有变（同步没被跳过）、只传 sitemap、或线上还没有时才生成并上传。<loc> 一律写正式站地址，
      # 路由代理读的时候再换成本站（见 src/lib/server/sitemap-proxy.ts）。数据同步失败时不到这里（默认的成功条件）。
      - name: Generate item sitemaps
        id: sm_gen
        if: ${{ steps.gate.outputs.publish == 'true' && (steps.gate.outputs.sitemaps_only == 'true' || steps.cos_decide.outputs.skip != 'true' || steps.sm_present.outputs.present != 'true') }}
        working-directory: nextjs
        env:
          SITEMAP_SITE: ${{ env.HOST_SITE }}
          SITEMAP_OUT_DIR: ${{ runner.temp }}/item-sitemaps
        run: node scripts/gen-sitemaps.mjs

      - name: Upload item sitemaps
        id: sm_up
        if: ${{ steps.sm_gen.outcome == 'success' }}
        working-directory: nextjs
        env:
          SITEMAP_OUT_DIR: ${{ runner.temp }}/item-sitemaps
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ steps.gate.outputs.prefix }}
          SITEMAP_META: '{"productionCommitId":"${{ steps.clone.outputs.index_sha }}","textCommitId":"${{ steps.clone.outputs.text_sha }}"}'
        run: node scripts/upload-sitemaps.mjs

  # ---------------------------------------------------------------------------------------------------------
  # 刷新（设计 §5）：数据真的换了（current/ 同步成功）才跑。三类事，都不拦（失效没生效最坏是条目页按 s-maxage 一小时自然过期）：
  #   ① 清数据指针的 CDN 缓存（latest.json、h1 根、sitemaps 索引）——只清这几个数据地址，不清整站；
  #   ② 条目页按改动失效（item-revalidate）：正式前缀对 www 和 staging 各一次（拆出后测试站读同一份数据），演练只对 staging 站；
  #   ③ 失效结果核对（item-cache-verify）。
  # 密钥只在 step 级 env；这个任务不跑任何数据仓代码。
  # ---------------------------------------------------------------------------------------------------------
  refresh:
    needs: package
    # !cancelled()：current/ 同步成功之后 package 里还有 sitemap 生成／上传等步骤，它们红了 package 任务就是失败，
    # 但数据已经换上线了——缓存照样得清、条目页照样得失效，不能因为 package 红就跳过
    if: ${{ !cancelled() && needs.package.outputs.data_published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 各步骤 continue-on-error（不拦），但结果要报出去：alert-data 看 ok，false 就告警（清缓存或失效没生效读者会看到旧页）
    outputs:
      ok: ${{ steps.purge.outcome != 'failure' && steps.changes.outcome != 'failure' && steps.reval.outcome != 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Purge data pointers on the CDN
        id: purge
        continue-on-error: true
        env:
          PREFIX: ${{ needs.package.outputs.prefix }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          EDGEONE_DATA_ZONE_ID: ${{ secrets.EDGEONE_DATA_ZONE_ID }}
        run: |
          python3 -m pip install --user tencentcloud-sdk-python-teo -q
          # 只给新域名的地址；ops/purge-urls.py 会把同一路径在旧数据域名下的也一起清
          P="$HOST_DATA/${PREFIX:+$PREFIX/}"
          # h1 版本指针也要清（实测节点把 h1/manifest-root.json 缓存了约 18.7 小时，源站 max-age 被无视）；sitemaps 索引同理
          python3 ops/purge-urls.py "${P}latest.json" "${P}h1/manifest-root.json" "${P}h1/text-manifest-root.json" "${P}sitemaps/sitemap-index.xml"

      - name: Download item changes
        id: changes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: item-changes
          path: ${{ runner.temp }}/item-artifact

      # 页面失效用的密钥由 EDGEONE_API_TOKEN 派生，与两个站构建时烘进去的是同一个（deploy.yml 的 Derive revalidate secret）
      - name: Revalidate changed item pages and check the refresh
        id: reval
        if: ${{ steps.changes.outcome == 'success' }}
        continue-on-error: true
        working-directory: nextjs
        env:
          PREFIX: ${{ needs.package.outputs.prefix }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          ITEM_CHANGES_OUT: ${{ runner.temp }}/item-artifact/item-changes.json
        run: |
          S=$(printf 'kyg-item-revalidate' | openssl dgst -sha256 -hmac "$EDGEONE_API_TOKEN" | awk '{print $NF}')
          echo "::add-mask::$S"
          export KYG_REVALIDATE_SECRET="$S"
          # 未改动页的 CDN 命中检查要一个对照页；这里没有本地打包产物，候选由 package 任务随工件带来
          export ITEM_CONTROL_IDS="$(cat "$RUNNER_TEMP/item-artifact/control-ids.txt" 2>/dev/null || true)"
          if [ -z "$PREFIX" ]; then SITES="$HOST_SITE $HOST_STAGING"; else SITES="$HOST_STAGING"; fi
          rc=0
          for site in $SITES; do
            echo "::group::条目页失效 · $site"
            ITEM_SITE="$site" node scripts/item-revalidate.mjs && ITEM_SITE="$site" node scripts/item-cache-verify.mjs || { echo "::warning::$site 的条目页失效／核对没通过（不拦，按 s-maxage 自然过期）"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  # h1 文本（overview#470 设计 §5 (b)(c)，PR-D）：生产没有读者，所以单独成任务——不拖住刷新／上线后抽查／告警，失败只警告。
  # 它读的是 bundle-data.mjs 打出来的整个 items/，所以要在这里按 package 用的同一对 commit 重新克隆＋build_derived＋打包
  # （缓存命中约 +3～4 分钟，与 refresh／verify-live 并行）。只在「线上 h1 文本指针记的 book-text commit ≠ 这次的」时才做；
  # 演练勾了 force_sync（只 staging 生效）则一定做。写的前缀与 package 一致（演练＝staging/）。
  h1-text:
    needs: package
    if: ${{ !cancelled() && needs.package.outputs.data_published == 'true' && needs.package.outputs.sitemaps_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 任务级 continue-on-error：红了不让整个 run 变红（它是不拦的附属任务）；失败会写 ::warning:: 和摘要
    continue-on-error: true
    outputs:
      ran: ${{ steps.decide.outputs.run }}
    env:
      NEW_PROD: ${{ needs.package.outputs.new_prod_commit }}
      NEW_TEXT: ${{ needs.package.outputs.new_text_commit }}
      PREFIX: ${{ needs.package.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 只读：看线上 h1 文本指针记的 book-text commit。取不到（首次、404、坏 JSON）一律当成要做；force_sync 只在 staging 生效
      - name: Decide (skip when book-text unchanged since the live h1 text pointer)
        id: decide
        env:
          FORCE_SYNC: ${{ inputs.force_sync }}
          TARGET: ${{ inputs.target || 'production' }}
        run: |
          run=true; why=""
          URL="$HOST_DATA/${PREFIX:+$PREFIX/}h1/text-manifest-root.json?cb=$(date +%s)"
          LIVE=$(curl -sf --max-time 30 "$URL" | python3 -c "import json,sys; print((json.load(sys.stdin).get('dataCommit') or {}).get('textCommitId',''))" 2>/dev/null || true)
          if [ "$FORCE_SYNC" = true ] && [ "$TARGET" = staging ]; then
            why="force_sync（演练）：不看指针，照做"
          elif [ -n "$LIVE" ] && [ "$LIVE" = "$NEW_TEXT" ]; then
            run=false; why="线上 h1 文本指针已是 book-text ${NEW_TEXT:0:12}，没变，跳过"
          else
            why="线上 h1 文本指针记的是 '${LIVE:0:12}'，这次 ${NEW_TEXT:0:12}（或读不到指针）：要做"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "· h1 文本：$why"
          echo "### h1 文本（单独任务）" >> "$GITHUB_STEP_SUMMARY"; echo "- $why" >> "$GITHUB_STEP_SUMMARY"

      - name: Set data output root (outside nextjs/)
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: echo "KYG_DATA_ROOT=$RUNNER_TEMP/kyg-data" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ steps.decide.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: ${{ steps.decide.outputs.run == 'true' }}
        working-directory: nextjs
        run: npm ci

      - name: Restore git cache — book-index
        id: gc_index
        if: ${{ steps.decide.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ env.NEW_PROD }}
          restore-keys: |
            git-cache-v1-book-index-

      - name: Restore git cache — book-text
        id: gc_text
        if: ${{ steps.decide.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ env.NEW_TEXT }}
          restore-keys: |
            git-cache-v1-book-text-

      # 克隆 package 用的同一对 commit（不是 ref：package 之后数据仓可能又有新提交，h1 文本要和 current/ 同一版）
      - name: Clone index data repos (same commits as package)
        id: clone
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: |
          source ops/clone-cached.sh
          clone_cached book-index book-index "$NEW_PROD"
          clone_cached book-text book-text "$NEW_TEXT"

      - name: Build derived data (schema-v2)
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: |
          if [ -f book-index/build/build_derived.py ]; then
            D="$RUNNER_TEMP/book-index-derived"
            s=$SECONDS; echo "▶ build_derived 开始 $(date -u +%H:%M:%S) UTC"
            # overview#506 C：_has_text／_has_collated 从 book-text 的 index/texts 推（脚本支持且目录在才传）
            TI=""; if [ -d "$GITHUB_WORKSPACE/book-text/index/texts" ] && grep -q -- "--text-index" book-index/build/build_derived.py; then TI="--text-index $GITHUB_WORKSPACE/book-text/index/texts"; fi
            (cd book-index && python3 build/build_derived.py --out "$D" $TI)
            echo "✔ build_derived 用时 $((SECONDS - s)) 秒，产物 $(du -sh "$D" | cut -f1)"
            echo "BOOK_INDEX_DERIVED_DIR=$D" >> "$GITHUB_ENV"
            # 05 overview#506 E：旧字段回退已清零；B5-3.2 起严格是 derived.mjs 的默认（STRICT_DERIVED 不再起作用，留着无害）
            echo "STRICT_DERIVED=1" >> "$GITHUB_ENV"
          else
            echo "::error::book-index 没有 build/build_derived.py：打包不再回退读源档（B5-3.2，GUJI-299），必须有 schema-v2 产物"
            exit 1
          fi

      # 对读章生僻字子集字体（GUJI-701）：bundle-data 要 fontTools＋hanamin；三处打包共用同一脚本、同一版本，产物逐字节一致
      - name: Setup chapter-font tools
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: bash ops/setup-chapter-fonts.sh

      - name: Bundle data
        if: ${{ steps.decide.outputs.run == 'true' }}
        working-directory: nextjs
        env:
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
          BOOK_TEXT_DIR: ${{ github.workspace }}/book-text
        run: |
          s=$SECONDS; echo "▶ 打包数据开始 $(date -u +%H:%M:%S) UTC"
          node scripts/bundle-data.mjs
          echo "✔ 打包数据用时 $((SECONDS - s)) 秒"

      # 同 package：基础闸（含私有文本泄漏检查）——上传的是 items/ 里的文本，泄漏检查要在带密钥的步骤之前
      - name: Verify bundled data (basic gates)
        if: ${{ steps.decide.outputs.run == 'true' }}
        run: bash ops/data-package-verify.sh book-index

      - name: COS h1 text state — restore
        id: h1t_state
        if: ${{ steps.decide.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-text-state-v1-${{ inputs.target || 'production' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cos-h1-text-state-v1-${{ inputs.target || 'production' }}-
            cos-h1-state-v1-${{ inputs.target || 'production' }}-

      - name: Sync h1 text to Tencent COS
        id: sync
        if: ${{ steps.decide.outputs.run == 'true' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ needs.package.outputs.prefix }}
          COS_CONCURRENCY: '32'
          SYNC_REBUILD_STATE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          cd nextjs
          s=$SECONDS; echo "▶ h1 文本打包开始 $(date -u +%H:%M:%S) UTC"
          node scripts/bundle-hashed-text.mjs
          echo "✔ h1 文本打包用时 $((SECONDS - s)) 秒"
          s=$SECONDS; echo "▶ h1 文本同步开始 $(date -u +%H:%M:%S) UTC"
          node scripts/sync-h1-text-to-cos.mjs
          echo "✔ h1 文本同步用时 $((SECONDS - s)) 秒"

      - name: COS h1 text state — save
        if: ${{ steps.sync.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-text-state-v1-${{ inputs.target || 'production' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Warn when the h1 text sync failed (does not block anything)
        if: ${{ always() && steps.sync.outcome == 'failure' }}
        run: |
          echo "::warning::h1 文本同步失败（不拦发布；h1 文本目前生产无读者）。下次 book-text 变化或手动重跑会再试"
          echo "- ⚠ h1 文本同步失败（不拦发布）" >> "$GITHUB_STEP_SUMMARY"

  # 上线后抽查要用"线上现在跑的代码"对应的 e2e：e2e 必须和被测站点是同一版代码（verify.yml 头注释）。
  # 正式站取 web.json（代码指针），取不到退回 latest.json 里的 webCommitId，再不行用 main。
  live-ref:
    needs: package
    # !cancelled()：同上，package 在同步之后红了（sitemap 等）也要抽查
    if: ${{ !cancelled() && needs.package.outputs.data_published == 'true' && needs.package.outputs.sitemaps_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.r.outputs.ref }}
    steps:
      - id: r
        env:
          PREFIX: ${{ needs.package.outputs.prefix }}
        run: |
          P="$HOST_DATA/${PREFIX:+$PREFIX/}"
          pick() { curl -sf --max-time 30 "$1?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('webCommitId',''))" 2>/dev/null || true; }
          REF=$(pick "${P}web.json")
          printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || REF=$(pick "${P}latest.json")
          printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "· 取不到线上代码 commit，e2e 用 main"; REF=main; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "· 上线后抽查用的 e2e ref：$REF"

  # 上线后抽查（设计 §2）：复用 verify.yml——contract＋UI 冒烟＋read-links（数据相关，约 4～6 分钟，设计原稿定的）。
  # 正式前缀验正式站；演练（staging/ 前缀）验测试站、数据基址取 staging/ 前缀。第一期失败只告警、不自动回滚。
  verify-live:
    needs: [package, refresh, live-ref]
    if: ${{ !cancelled() && needs.package.outputs.data_published == 'true' && needs.live-ref.result == 'success' }}
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ needs.package.outputs.prefix == 'staging' && 'staging' || 'production' }}
      ref: ${{ needs.live-ref.outputs.ref }}
      wait_cdn: true
      read_links: true

  # 告警：正式前缀的数据发布失败（上传红了）或上线后抽查没过，开一张（或续一条）data-alert issue。
  # 只告警，不自动回滚：回滚＝用发布前的数据 commit 再发一次（allow_ref_override），约 10 分钟。
  # 演练（staging/ 前缀）和只传 sitemap 的手动 run 不告警，看 run 本身即可。
  alert-data:
    needs: [package, refresh, verify-live]
    if: ${{ !cancelled() && needs.package.outputs.publish == 'true' && needs.package.outputs.prefix == '' && needs.package.outputs.sitemaps_only != 'true' && (needs.package.result == 'failure' || needs.verify-live.result == 'failure' || needs.refresh.outputs.ok == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update data alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ needs.package.result }}
          PUBLISHED: ${{ needs.package.outputs.data_published }}
          REFRESH_OK: ${{ needs.refresh.outputs.ok }}
          VERIFY: ${{ needs.verify-live.result }}
          OLD_PROD: ${{ needs.package.outputs.old_prod_commit }}
          OLD_TEXT: ${{ needs.package.outputs.old_text_commit }}
          NEW_PROD: ${{ needs.package.outputs.new_prod_commit }}
          NEW_TEXT: ${{ needs.package.outputs.new_text_commit }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # 说法要跟着"数据到底有没有换上线"走（published＝current/ 同步成功）：同步成功之后 package 里还有 sitemap 等步骤，
          # 它们红了数据也已经是新的了，不能说成"线上还是上一版"
          WHAT=""
          add() { WHAT="${WHAT:+$WHAT；}$1"; }
          if [ "$PACKAGE" = failure ] && [ "$PUBLISHED" != true ]; then
            add "**数据发布失败**（package：$PACKAGE）——线上数据多半还是上一版（current/ 同步没成功就不会换指针），读者不受影响，但这次没发上去"
          elif [ "$PACKAGE" = failure ]; then
            add "**数据已换上线，但之后的步骤失败了**（package：$PACKAGE，多半是 sitemap 生成／上传，看 run 里哪一步红）——新数据已经是线上的，读者看到的是新版"
          fi
          if [ "$VERIFY" = failure ]; then
            add "**数据已发布、但上线后抽查失败**（verify-live：$VERIFY）——新数据已在线上，请尽快看是不是读者可见的回归"
          fi
          if [ "$REFRESH_OK" = false ]; then
            add "**缓存刷新没完全生效**（refresh：清数据指针缓存或条目页失效／核对没通过，看 run 里 refresh 任务）——数据本身没问题，但读者可能还看到旧指针／旧条目页，条目页最迟一小时（s-maxage）自然过期，h1 指针的节点缓存可能更久"
          fi
          BODY=$(printf '正式站数据发布出错：%s\n\n- run：%s\n- 新数据：book-index `%s`，book-text `%s`\n- 发布前线上：book-index `%s`，book-text `%s`\n\n**回滚**（重发发布前的数据，约 10 分钟）：Actions → Data package check and publish → Run workflow：`flow=both`、`target=production`，`prod_ref`、`text_ref` 填上面"发布前线上"的两个 commit，勾 `allow_ref_override`。\n\n修好、线上恢复后关本 issue。' \
            "$WHAT" "$RUN_URL" "${NEW_PROD:0:40}" "${NEW_TEXT:0:40}" "${OLD_PROD:-（取不到）}" "${OLD_TEXT:-（取不到）}")
          gh label create data-alert --color B60205 --description '数据流程告警（data.yml）' 2>/dev/null || true
          N=$(gh issue list --label data-alert --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || echo '')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
            echo "已在告警 issue #$N 续报" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --label data-alert --title "数据发布告警：$(date -u +%m-%d\ %H:%MZ)" --body "$BODY"
            echo "已开告警 issue" >> "$GITHUB_STEP_SUMMARY"
          fi

  # GUJI-557：校对精灵图同步。非阻塞：continue-on-error，不在 verify-live／alert-data／refresh 的 needs 里，
  # 红了也不改变本次 run 的结论、不触发 data-alert。不用任何 secret、不连 COS（只算上传计划；真上传另走现有 COS 同步，上线前先 staging 演练）。
  # 指针：book-text main 的 proof/<书>/<册>/sprites.pointer.json（稀疏拉，只取 proof/）；资产：open-guji-dataset 的公开 Release（匿名下载）。
  # 没有指针＝正常跳过。规格：ai-team 仓 team/网站/GUJI-557-sprites-同步job规格.md
  sprites:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch sprites pointers from book-text (sparse)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/open-guji/book-text.git "$RUNNER_TEMP/book-text-pointers"
          git -C "$RUNNER_TEMP/book-text-pointers" sparse-checkout set proof
          echo "· book-text $(git -C "$RUNNER_TEMP/book-text-pointers" rev-parse --short HEAD)；指针 $(find "$RUNNER_TEMP/book-text-pointers/proof" -name sprites.pointer.json 2>/dev/null | wc -l) 个"
      - name: Sync proof sprites (release source, dry-run)
        working-directory: nextjs
        env:
          SPRITES_RELEASE_REPO: open-guji/open-guji-dataset
          SPRITES_POINTER_ROOT: ${{ runner.temp }}/book-text-pointers
        run: node scripts/sync-proof-sprites.mjs
