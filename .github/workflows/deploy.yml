name: Deploy to EdgeOne
# 显示名原为「Deploy to GitHub Pages」——2026-05 起早已不部署 GitHub Pages，
# 产物推到 edgeone-release 分支由 EdgeOne Pages 托管。2026-09-06 改名以免误导新人。
# CUT2（2026-09-28，overview#241）起两站都是全栈、CLI 直传：测试站 kyg-staging，
# 正式站 kyg-ssr-spike（www）。edgeone-release／旧项目 kaiyuanguji 不再推送。
#
# overview#341（10-01 用户定）：push 到 main → 测试站 → verify 全绿 → 自动上正式站。
#   push 的这次 run 里，与测试站并行再构建一份正式站产物（同一版代码、同一份数据，prod-artifact 任务），
#   加密存成本 run 的工件；测试站 verify 全绿后 auto-promote 派一次 target=production from_run=<本 run>，
#   正式站那次 run 不再重新构建，直接部署这份产物（数据没变时也不重拉、不重传数据）。
#   开关：仓库变量 AUTO_PROMOTE_CODE 设成 'false' 就停（回滚期间用，见 docs/runbook.md §8）；手动 promote 照旧可用。

# 正式站 promote 的 run 起个可辨认的名字：push 的「让路」只等定时／手动的测试站部署，不等正式站 promote
# （正式站不碰测试站，等它只会白白推迟下一次测试站部署）。其它触发保持默认名字。
run-name: ${{ inputs.target == 'production' && format('Promote to production ({0}{1})', inputs.promote, inputs.from_run != '' && format(', from run {0}', inputs.from_run) || '') || '' }}

on:
  # 2026-09-28（overview#182，Actions 额度 90%）：本仓私有、按分钟计费，一次部署约 17 分钟。
  # ① 只有会改变站点的改动才触发部署：文档、e2e、ops 脚本、其它 workflow、indexer、perf、
  #    测试文件改了不部署（需要时手动 dispatch）。deploy.yml 自己改了仍部署。
  # ② 去掉 repository_dispatch: data-updated——数据仓每推一次就整套重部署，一夜 19 次。
  #    数据上线只走每日定时（下方 schedule，三仓无变化即跳过）或手动触发。
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!e2e/**'
      - '!ops/**'
      - '!indexer/**'
      - '!perf/**'
      - '!.claude/**'
      - '!**/__tests__/**'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!**/*.test.mjs'
      - '!.github/**'
      - '.github/workflows/deploy.yml'
  # 手动触发（Actions 页面 Run workflow 按钮 / API）
  # T1（2026-09-27）：target=staging 重建测试站（默认）；target=production 是
  # 人手动 promote——把测试站验过的版本（或仅数据）打到正式站。
  workflow_dispatch:
    inputs:
      target:
        description: 'staging = 重建测试站；production = 把测试站验过的版本手动 promote 到正式站'
        type: choice
        options: [staging, production]
        default: staging
      promote:
        description: '仅 target=production 有效。code = 只发代码（必须填 from_run，数据一个字节都不动，自动晋升用这个）；code+data = 测试站的代码与数据一起上正式站（数据上线要用户本人确认）；data = 正式站代码不动，只换数据。数据流程已拆出（仓库变量 SPLIT_DATA_FLOW=true）后只发代码：code+data 当作只发代码，data 不再支持（数据上线走 data.yml）'
        type: choice
        options: [code, code+data, data]
        default: code
      # 联调用（只影响手动触发、且只对 target=staging 生效）：默认都是 main。
      # 代码版本不在这里选——在「Use workflow from」里选分支，web 取该分支的 HEAD。
      prod_ref:
        description: '仅 target=staging：book-index 的分支／tag／commit（默认 main）'
        type: string
        default: main
      text_ref:
        description: '仅 target=staging：book-text 的分支／tag／commit（默认 main），联调文本迁移用'
        type: string
        default: main
      # overview#341：钉死「验过的那一次」。自动 promote 都带它；手动也可以填（Actions 里测试站那次 run 的编号）。
      from_run:
        description: '仅 target=production：测试站那次部署的 run id——代码与数据都钉成那次验过的；code+data 且那次存了正式站产物时直接部署产物、不重新构建。空＝按测试站指针（老办法）'
        type: string
        default: ''
      rehearse_artifact:
        description: '仅 target=staging：演练产物复用——同时构建并存正式站产物（不部署），测试站改用打包、加密、解包后的产物部署'
        type: boolean
        default: false
      rehearse_split:
        description: '仅 target=staging：演练数据流程拆出后的代码流程（等价于只对这一次打开 SPLIT_DATA_FLOW，不动仓库变量）——不克隆、不打包、不传数据，测试站读正式站数据。下一次 push 部署会恢复原样；不会自动晋升'
        type: boolean
        default: false
  # 每日定时兜底：数据仓的 notify-web webhook 依赖跨仓 PAT
  # （REPO_DISPATCH_TOKEN），换账号后曾长期 Bad credentials 导致数据
  # 5 天没上线（2026-08 事故）。定时任务不依赖任何跨仓凭证，数据没
  # 变化时由 check job 提前跳过，不浪费构建。UTC 20:30 = 北京 04:30。
  schedule:
    - cron: '30 20 * * *'

permissions:
  contents: write
  actions: write   # T1：数据自动 promote 时由 verify job 触发本 workflow（workflow_dispatch）
  issues: write    # overview#341：正式站发布／验收失败时 alert-production 开（或续）告警 issue

# 并发（overview#267；此前 push 会取消正在跑的定时发布，09-27、09-28 各一次，当天数据没上线）：
#   - push：自成一组 deploy-edgeone-push，cancel-in-progress=true——连推时只跑最后一次（省分钟数，overview#182），
#     但只取消 push，够不着别的组；
#   - schedule／dispatch：按目标各一组（deploy-edgeone-staging／deploy-edgeone-production），
#     **不取消在跑的**，也不会被 push 取消。正式站原本就是这样，路径没动；
#   - 两组之间不会同时部署测试站，靠两层：① resolve 里 push 先等非 push 的 run 跑完（再进 build）；
#     ② build 任务在测试站上共用一把锁（见 build 的 concurrency），万一 ① 没拦住也是排队，不并行。
#     不用「一个组里 cancel 设成 false」：GitHub 同组只留一个排队项，后来的会顶掉先排队的——
#     push 会把排在后面的定时发布顶掉，和取消一样。
# 组名里的 target 与 resolve 一致：没有 inputs（schedule）按 staging。
concurrency:
  group: deploy-edgeone-${{ github.event_name == 'push' && 'push' || inputs.target || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # 定时触发时先比对数据仓 HEAD 与线上（正式站）latest.json，没变化就跳过整个构建。
  # push / dispatch / 手动触发一律直接部署。
  # 注：这里的比对口径不随 T1 改变——仍然只问「正式站」是否已是最新数据，
  # 测试站配置齐不齐、这次要不要先落测试站，交给 resolve job 决定。
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
    steps:
      - name: Compare data repo HEADs with deployed latest.json
        id: compare
        env:
          SPLIT_DATA_FLOW: ${{ vars.SPLIT_DATA_FLOW }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "· 非定时触发，直接部署"
            exit 0
          fi
          # overview#470 P1：SPLIT_DATA_FLOW 打开后，每晚的数据发布归数据流程（data.yml），代码流程的定时部署不再有事可做
          if [ "$SPLIT_DATA_FLOW" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "· SPLIT_DATA_FLOW 已打开：定时的数据发布由 data.yml 负责，本流程跳过"
            exit 0
          fi
          LIVE=$(curl -sf --max-time 30 https://data.kaiyuanguji.com/latest.json || echo '{}')
          LIVE_PROD=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('productionCommitId',''))" || echo '')
          LIVE_TEXT=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('textCommitId',''))" || echo '')
          HEAD_PROD=$(git ls-remote https://github.com/open-guji/book-index.git refs/heads/main | cut -f1)
          HEAD_TEXT=$(git ls-remote https://github.com/open-guji/book-text.git refs/heads/main | cut -f1)
          echo "production: live=$LIVE_PROD head=$HEAD_PROD"
          echo "book-text:  live=$LIVE_TEXT head=$HEAD_TEXT"
          # 线上 latest.json 缺字段（旧版产物）或比对不上 → 部署
          # 两仓皆须比对得上方可跳过。少比一项即：该仓单独有改动时被判「无变化」，
          # 其更新永远上不了线（2026-08-26 加 book-text 一项）。草稿仓不再参与（overview#432）。
          if [ -n "$HEAD_PROD" ] && [ "$LIVE_PROD" = "$HEAD_PROD" ] \
             && [ -n "$HEAD_TEXT" ] && [ "$LIVE_TEXT" = "$HEAD_TEXT" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "· 数据无变化，跳过部署"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "· 数据有更新（或无法确认），执行部署"
          fi

  # T1：定这次发往哪个站、用哪一版代码、哪一版数据。两种 mode——
  #   staging ：不是手动 promote。代码=触发的 commit，数据=三仓 HEAD
  #   promote ：workflow_dispatch target=production，人手动按的。
  #             数据=测试站 staging/latest.json 里记下的三仓 commit（钉死，不取 HEAD）；
  #             代码 = code+data 时取测试站记下的 webCommitId，data 时取正式站现有 webCommitId
  # CUT2（overview#241）：原来还有第三种 fallback（EDGEONE_API_TOKEN 缺时跳过测试站、直接推
  # edgeone-release 发旧项目 kaiyuanguji）。切站后正式站也是 CLI 直传 kyg-ssr-spike，没有
  # token 哪个站都发不了，旧项目又不再接收推送——fallback 去掉，缺 token 直接报错。
  resolve:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_deploy == 'true' }}
    outputs:
      target: ${{ steps.r.outputs.target }}
      mode: ${{ steps.r.outputs.mode }}
      web_ref: ${{ steps.r.outputs.web_ref }}
      prod_ref: ${{ steps.r.outputs.prod_ref }}
      text_ref: ${{ steps.r.outputs.text_ref }}
      # overview#341：两个数据仓 ref 解析成的完整 commit（解析不了的留空，例如手填的短 SHA）。
      # build 据此在克隆之前就判断「数据有没有变」，没变就不克隆（见 build 的 Data fast path）。
      prod_sha: ${{ steps.sha.outputs.prod_sha }}
      text_sha: ${{ steps.sha.outputs.text_sha }}
      # overview#341：非空＝正式站直接部署这个 run 存的正式站产物（不重新构建）
      artifact_run: ${{ steps.r.outputs.artifact_run }}
      # overview#470 P1：'true'＝数据流程已拆出（仓库变量 SPLIT_DATA_FLOW）：代码流程不克隆、不打包、不传数据，
      # 测试站读正式站数据前缀，sitemap 走路由代理，晋升只发代码。from_run 的晋升取那次 run 的口径（manifest 的 dataSplit）。
      split: ${{ steps.r.outputs.split }}
    steps:
      # push 部署要让路给定时／手动部署：有非 push 的 deploy run 在排队或在跑就等它跑完再往下走。
      # 只有最新的 push 会在这里等（push 组 cancel-in-progress，新 push 会取消旧的等待者）。
      # 查不了（API 报错）或等满 60 分钟都放行——这一步只是让路，不能反过来卡住部署；
      # 真要并行也被 build 的测试站锁挡住。
      - name: Yield to scheduled / manual deploys (push only)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy_runs() {
            local total=0 n st
            for st in in_progress queued waiting pending; do
              # overview#341：正式站 promote（run-name 以 Promote to production 开头）不碰测试站，不等它
              n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status "$st" --limit 50 \
                    --json event,displayTitle \
                    --jq '[.[] | select(.event != "push" and (.displayTitle | startswith("Promote to production") | not))] | length') || return 1
              total=$((total + n))
            done
            echo "$total"
          }
          for i in $(seq 1 120); do
            if ! n=$(busy_runs); then
              echo "⚠️ 查不了其他部署 run 的状态，不等了，直接往下走（build 的测试站锁仍会排队）"
              exit 0
            fi
            if [ "$n" = "0" ]; then
              [ "$i" -gt 1 ] && echo "· 定时／手动部署已结束，继续"
              exit 0
            fi
            echo "· 有 $n 个定时／手动部署在排队或在跑，30 秒后再看（第 $i/120 次）"
            sleep 30
          done
          echo "⚠️ 等了 60 分钟仍有定时／手动部署在跑，放行（build 的测试站锁会排队）"

      - id: r
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          # 经 env 传入，不把输入直接拼进脚本
          IN_PROD_REF: ${{ inputs.prod_ref }}
          IN_TEXT_REF: ${{ inputs.text_ref }}
          IN_FROM_RUN: ${{ inputs.from_run }}
          IN_PROMOTE: ${{ inputs.promote }}
          GH_TOKEN: ${{ github.token }}
          SPLIT_VAR: ${{ vars.SPLIT_DATA_FLOW }}
          IN_REHEARSE_SPLIT: ${{ inputs.rehearse_split }}
        run: |
          REQ="${{ inputs.target || 'staging' }}"
          # overview#470 P1：数据流程是否已拆出（from_run 的晋升下面按那次 run 的 manifest 改写）
          SPLIT=false; [ "$SPLIT_VAR" = "true" ] && SPLIT=true
          # 演练：手动触发的测试站部署勾 rehearse_split，只对这一次按「已拆出」跑，不用动仓库变量（push／定时／晋升不受影响）
          if [ "$REQ" = staging ] && [ "$IN_REHEARSE_SPLIT" = true ]; then SPLIT=true; echo "· 演练：按 SPLIT_DATA_FLOW=true 跑这一次测试站部署（仓库变量不动）"; fi
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "❌ EDGEONE_API_TOKEN 未配置：测试站 kyg-staging 与正式站 kyg-ssr-spike 都是 CLI 直传，没有它哪个站都发不了"
            exit 1
          fi

          # overview#341：from_run——钉死测试站验过的那一次（代码＝那次的 commit，数据＝那次用的三仓 commit）。
          # 核对：那次是本仓 deploy.yml 的 run、验收任务（verify / *）全绿、有它存的 promote-manifest。
          # code+data 且那次存了正式站产物（prod-edgeone）→ artifact_run，build 直接部署产物、不重新构建；
          # data → 代码仍取正式站现有的 webCommitId，只把数据钉成那次的（重新构建，同老办法）。
          if [ "$REQ" = "production" ] && [ -n "$IN_FROM_RUN" ]; then
            if ! printf '%s' "$IN_FROM_RUN" | grep -Eq '^[0-9]{1,20}$'; then echo "❌ from_run 应是 run 的数字 id：$IN_FROM_RUN"; exit 1; fi
            R=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_FROM_RUN" --jq '[.path, .head_sha] | @tsv') \
              || { echo "❌ 查不到 run $IN_FROM_RUN"; exit 1; }
            RUN_PATH=$(printf '%s' "$R" | cut -f1); RUN_SHA=$(printf '%s' "$R" | cut -f2)
            case "$RUN_PATH" in .github/workflows/deploy.yml*) ;; *) echo "❌ run $IN_FROM_RUN 不是 deploy.yml 的（$RUN_PATH）"; exit 1 ;; esac
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_FROM_RUN/jobs?per_page=100" --paginate \
              --jq '.jobs[] | [.name, (.conclusion // .status)] | @tsv' > "$RUNNER_TEMP/src-jobs.tsv"
            echo "· run $IN_FROM_RUN 的任务："; sed 's/^/    /' "$RUNNER_TEMP/src-jobs.tsv"
            grep -q '^verify / ' "$RUNNER_TEMP/src-jobs.tsv" || { echo "❌ run $IN_FROM_RUN 没有验收任务（verify / *）"; exit 1; }
            BAD=$(grep '^verify / ' "$RUNNER_TEMP/src-jobs.tsv" | awk -F'\t' '$2 != "success" && $2 != "skipped"' || true)
            [ -z "$BAD" ] || { echo "❌ run $IN_FROM_RUN 的验收没有全绿："; echo "$BAD"; exit 1; }
            grep -q $'^verify / .*\tsuccess$' "$RUNNER_TEMP/src-jobs.tsv" || { echo "❌ run $IN_FROM_RUN 的验收一项都没跑成"; exit 1; }
            gh run download "$IN_FROM_RUN" --repo "$GITHUB_REPOSITORY" -n promote-manifest -D "$RUNNER_TEMP/manifest" \
              || { echo "❌ run $IN_FROM_RUN 没有 promote-manifest 工件（过期了？工件只留 3 天）"; exit 1; }
            M="$RUNNER_TEMP/manifest/promote-manifest.json"
            mget() { python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" "$M" "$1"; }
            M_WEB=$(mget webCommitId)
            [ "$M_WEB" = "$RUN_SHA" ] || { echo "❌ manifest 的 webCommitId（$M_WEB）与 run 的 commit（$RUN_SHA）不一致"; exit 1; }
            # overview#470 P1：那次 run 是数据拆出之后跑的（manifest 的 dataSplit），晋升就只发代码，manifest 里没有数据 commit
            case "$(mget dataSplit)" in True|true) SPLIT=true ;; *) SPLIT=false ;; esac
            if [ "$SPLIT" != true ]; then
              for k in productionCommitId textCommitId; do
                printf '%s' "$(mget $k)" | grep -Eq '^[0-9a-f]{40}$' || { echo "❌ manifest 的 $k 不是完整 commit：$(mget $k)"; exit 1; }
              done
            elif [ "$IN_PROMOTE" = data ]; then
              echo "❌ 数据流程已拆出（run $IN_FROM_RUN 是拆出后跑的）：promote=data 不再支持，数据上线走 data.yml"; exit 1
            fi
            echo "split=$SPLIT" >> "$GITHUB_OUTPUT"
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "target=production" >> "$GITHUB_OUTPUT"
            if [ "$IN_PROMOTE" = code ]; then
              # 只发代码：必须有那次存的正式站产物（sitemap 已烘在里面）。没有就报错，不退回重新构建——
              # 重新构建要克隆、打包数据，会把数据一起带上去，正是 code 要避开的。
              WEB="$M_WEB"
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_FROM_RUN/artifacts?per_page=100" \
                   --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx prod-edgeone \
                 && grep -q $'^prod-artifact\tsuccess$' "$RUNNER_TEMP/src-jobs.tsv"; then
                ART="$IN_FROM_RUN"
              else
                echo "❌ promote=code 需要 run $IN_FROM_RUN 存的正式站产物（prod-edgeone），但没有可用的；要连数据一起发请手动选 code+data"; exit 1
              fi
            elif [ "$IN_PROMOTE" = data ]; then
              WEB=$(curl -sf https://data.kaiyuanguji.com/latest.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('webCommitId',''))" || true)
              [ -n "$WEB" ] || { echo "❌ 正式站 latest.json 没有 webCommitId（首次 promote 请用 code+data）"; exit 1; }
              ART=''
            else
              WEB="$M_WEB"
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_FROM_RUN/artifacts?per_page=100" \
                   --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx prod-edgeone \
                 && grep -q $'^prod-artifact\tsuccess$' "$RUNNER_TEMP/src-jobs.tsv"; then
                ART="$IN_FROM_RUN"
              else
                ART=''
                echo "::warning::run $IN_FROM_RUN 没有可用的正式站产物，按钉死的代码与数据重新构建"
              fi
            fi
            echo "web_ref=$WEB" >> "$GITHUB_OUTPUT"
            echo "prod_ref=$(mget productionCommitId)" >> "$GITHUB_OUTPUT"
            echo "text_ref=$(mget textCommitId)" >> "$GITHUB_OUTPUT"
            echo "artifact_run=$ART" >> "$GITHUB_OUTPUT"
            if [ -n "$ART" ]; then HOW='部署那次存的正式站产物'; else HOW='重新构建'; fi
            if [ "$SPLIT" = true ]; then DATA_NOTE='数据不随这次发布（数据流程已拆出）'; else DATA_NOTE='数据=那次的三仓 commit'; fi
            echo "· promote($IN_PROMOTE) from run $IN_FROM_RUN：web=$WEB $DATA_NOTE；$HOW"
            exit 0
          fi

          if [ "$REQ" = "production" ]; then
            if [ "$IN_PROMOTE" = code ]; then
              echo "❌ promote=code 必须填 from_run（只发那次验过并存了产物的代码）"; exit 1
            fi
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "split=$SPLIT" >> "$GITHUB_OUTPUT"
            if [ "$SPLIT" = true ]; then
              # 数据流程已拆出：只发代码，取测试站代码指针 staging/web.json 记下的 webCommitId；不带数据 commit
              [ "$IN_PROMOTE" != data ] || { echo "❌ 数据流程已拆出：promote=data 不再支持，数据上线走 data.yml"; exit 1; }
              WEB=$(curl -sf https://data.kaiyuanguji.com/staging/web.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('webCommitId',''))" || true)
              [ -n "$WEB" ] || { echo "❌ staging/web.json 里没有 webCommitId（需先有一次成功的测试站部署）"; exit 1; }
              echo "web_ref=$WEB" >> "$GITHUB_OUTPUT"
              echo "prod_ref=" >> "$GITHUB_OUTPUT"
              echo "text_ref=" >> "$GITHUB_OUTPUT"
              echo "· promote（只发代码，数据流程已拆出）：web=$WEB"
              exit 0
            fi
            S=$(curl -sf https://data.kaiyuanguji.com/staging/latest.json)
            P=$(curl -sf https://data.kaiyuanguji.com/latest.json || echo '{}')
            get() { echo "$1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('$2',''))"; }
            if [ "${{ inputs.promote }}" = data ]; then WEB=$(get "$P" webCommitId); else WEB=$(get "$S" webCommitId); fi
            if [ -z "$WEB" ]; then
              echo "❌ 指针里没有 webCommitId（首次 promote 请用 code+data，且需先有一次成功的测试站部署）"
              exit 1
            fi
            echo "web_ref=$WEB" >> "$GITHUB_OUTPUT"
            echo "prod_ref=$(get "$S" productionCommitId)" >> "$GITHUB_OUTPUT"
            echo "text_ref=$(get "$S" textCommitId)" >> "$GITHUB_OUTPUT"
            echo "· promote(${{ inputs.promote }})：web=$WEB 数据=测试站所记三仓 commit"
            exit 0
          fi

          echo "mode=staging" >> "$GITHUB_OUTPUT"
          echo "target=staging" >> "$GITHUB_OUTPUT"
          echo "split=$SPLIT" >> "$GITHUB_OUTPUT"
          echo "web_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          # 数据仓 ref：push／定时没有输入，一律 main；手动触发可指定（联调分支）。
          # 只接受 git ref 常见字符，其余当作 main 之外的非法输入直接报错。
          for pair in "prod_ref:$IN_PROD_REF" "text_ref:$IN_TEXT_REF"; do
            k="${pair%%:*}"; v="${pair#*:}"; v="${v:-main}"
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "❌ $k 含非法字符：$v"; exit 1
            fi
            # 语法上也要是合法的 ref 名（拒绝 .. 、foo. 、foo.lock 等，免得到 clone 步骤才失败）；
            # 7～40 位十六进制的 commit SHA 同样能过这条
            if ! git check-ref-format "refs/heads/$v" >/dev/null 2>&1; then
              echo "❌ $k 不是合法的 git ref 名：$v"; exit 1
            fi
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          if [ "$SPLIT" = true ]; then
            echo "· 部署到测试站 kyg-staging（web=${{ github.sha }}；数据流程已拆出，不克隆数据仓，prod_ref／text_ref 不起作用）"
          else
            echo "· 部署到测试站 kyg-staging（web=${{ github.sha }} prod=${IN_PROD_REF:-main} text=${IN_TEXT_REF:-main}）"
          fi

      # overview#341：把三个 ref 解析成完整 commit。分支／tag 用 ls-remote；本来就是 40 位 SHA 的原样用；
      # 解析不了（短 SHA、网络失败）就留空——build 照老路克隆，只是用不上「数据没变就跳过」。
      - id: sha
        if: ${{ steps.r.outputs.split != 'true' }}
        env:
          PROD_REF: ${{ steps.r.outputs.prod_ref }}
          TEXT_REF: ${{ steps.r.outputs.text_ref }}
        run: |
          sha_of() {
            local repo="$1" ref="$2" out
            if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then echo "$ref"; return; fi
            out=$(git ls-remote "https://github.com/open-guji/$repo.git" "refs/heads/$ref" 2>/dev/null | head -1 | cut -f1)
            if [ -z "$out" ]; then
              # tag：优先取 peel 过的 commit（附注 tag 的 ^{} 行）
              out=$(git ls-remote "https://github.com/open-guji/$repo.git" "refs/tags/$ref^{}" "refs/tags/$ref" 2>/dev/null \
                    | sort -k2 -r | head -1 | cut -f1)
            fi
            printf '%s' "$out" | grep -Eq '^[0-9a-f]{40}$' && echo "$out" || echo ''
          }
          for pair in "prod_sha:book-index:$PROD_REF" "text_sha:book-text:$TEXT_REF"; do
            k="${pair%%:*}"; rest="${pair#*:}"; repo="${rest%%:*}"; ref="${rest#*:}"
            v=$(sha_of "$repo" "$ref")
            echo "$k=$v" >> "$GITHUB_OUTPUT"
            echo "· $repo $ref → ${v:-（解析不了，build 照常克隆）}"
          done

  build:
    runs-on: ubuntu-latest
    needs: resolve
    # 测试站的构建＋部署共用一把锁，push 与定时／手动部署不会同时写测试站（EdgeOne 项目、COS staging/ 前缀）。
    # 不取消在跑的：排队者等着（同组只留最后一个排队项，见文件上方并发说明——push 在 resolve 里已让路，
    # 不会有 push 来顶掉排着的定时发布）。正式站每个 run 一个独一无二的组，等于不加锁：
    # 它由上面的 workflow 级 deploy-edgeone-production 组排队，这里不改正式站的行为。
    concurrency:
      group: ${{ needs.resolve.outputs.target == 'staging' && 'deploy-edgeone-build-staging' || format('deploy-edgeone-build-{0}-{1}', needs.resolve.outputs.target, github.run_id) }}
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ needs.resolve.outputs.target }}
      DEPLOY_MODE: ${{ needs.resolve.outputs.mode }}
      # 测试站：数据写同桶 staging/ 前缀（current/、v/、h1/、latest.json 全在其下），与正式站互不覆盖
      COS_PATH_PREFIX: ${{ needs.resolve.outputs.target == 'staging' && 'staging' || '' }}
      # overview#341：正式站直接部署测试站那次 run 存的正式站产物（不重新构建、不重跑单测、不生成 sitemap）
      FROM_ARTIFACT: ${{ needs.resolve.outputs.artifact_run != '' }}
      # promote=code：只发代码，数据不碰（不克隆、不打包、不同步，只把线上 latest.json 的 webCommitId 改成新代码）
      CODE_ONLY: ${{ needs.resolve.outputs.mode == 'promote' && inputs.promote == 'code' }}
      # 演练（仅手动 target=staging）：测试站产物打包、加密、删掉构建目录后再解包部署，走一遍 promote 的那条路
      REHEARSE_ARTIFACT: ${{ needs.resolve.outputs.target == 'staging' && inputs.rehearse_artifact == true }}
      # overview#470 P1：数据流程已拆出（见 resolve 的 split 输出）。为 'true' 时下面所有数据步骤都跳过（DATA_FAST），
      # 测试站读正式站数据前缀，sitemap 走路由代理。不设变量（默认）时本任务与拆出之前逐步骤一致。
      SPLIT_DATA: ${{ needs.resolve.outputs.split }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.web_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci 严格按 lockfile 安装（与 test.yml 保持一致）；
      # 原先的 npm install 会在 CI 里悄悄升级依赖，导致「本地能过、线上挂」
      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      # 部署前先跑单测：push 到 main 会直接上线，不能把未验证的代码发出去
      # （部署现成产物时不跑：那份产物在测试站那次 run 里已经跑过单测、过了 verify）
      - name: Unit tests
        if: ${{ env.FROM_ARTIFACT != 'true' }}
        working-directory: nextjs
        run: npm test

      # overview#470 P1：数据流程已拆出——代码流程不碰数据。下面所有数据步骤（克隆、build_derived、打包、检查、COS 同步、
      # 条目失效计算）本来就以 DATA_FAST != 'true' 为条件，这里把它置为 true 就全部跳过；
      # 「数据没变」快路的判定与写 latest.json 的步骤另行跳过（不再写 latest.json，数据指针只归数据流程）。
      - name: Split data flow — skip all data steps (overview#470 P1)
        if: ${{ env.SPLIT_DATA == 'true' }}
        run: |
          echo "DATA_FAST=true" >> "$GITHUB_ENV"
          echo "· SPLIT_DATA_FLOW：本流程不克隆、不打包、不上传数据；数据由 data.yml 负责"

      # --- overview#341：数据没变就不克隆、不打包、不同步 ---
      # 只改代码的部署原来照样要克隆三个数据仓（book-text 检出约 5 GB，约 3 分钟）、打包（约 40 秒）——
      # 打包出来和线上那份一模一样，下面的 COS 同步判定也会跳过上传，白花的只是克隆和打包。
      # 克隆和打包产物在「数据没变」时只剩一个用处：条目 sitemap（gen-sitemaps 读 entry/*.json）。
      # 所以这里在克隆之前就判定，两条都满足才走快路：
      #   ① 与下面 COS 同步判定同一口径（cos-sync-decision.mjs decide）：三仓 commit（resolve 解析出的）
      #      ＋打包脚本指纹，与线上「上次完整同步」标记、线上 latest.json 全对得上；
      #   ② 条目 sitemap 有缓存：键＝站点＋三仓 commit＋打包脚本指纹，上次照常打包时存的（actions/cache）。
      # 快路上只写 latest.json 的 webCommitId（同原来「数据没变」那一步），失败就退回老路照常克隆、打包、同步。
      # 任何一条不满足、读不到，都走老路，行为与原来一样。
      - name: Data fast path — decide before cloning (overview#341)
        id: data_pre
        if: ${{ env.CODE_ONLY != 'true' && env.HAS_COS_SECRETS == 'true' && env.SPLIT_DATA != 'true' && needs.resolve.outputs.prod_sha != '' && needs.resolve.outputs.text_sha != '' }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          PROD_COMMIT: ${{ needs.resolve.outputs.prod_sha }}
          TEXT_COMMIT: ${{ needs.resolve.outputs.text_sha }}
        run: |
          cd nextjs
          FP=$(node -e "import('./scripts/lib/cos-sync-decision.mjs').then((m) => console.log(m.computeBundleFingerprint(process.env.GITHUB_WORKSPACE)))")
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          node scripts/cos-sync-decision.mjs decide

      # promote=code：数据一个字节都不动。不依赖「数据没变」的判定（打包脚本变了它会走同步），
      # 让后面所有数据步骤（克隆、打包、检查、COS 同步、h1、失效）全部跳过。
      # latest.json 的 webCommitId 要等产物检查和 EdgeOne 部署成功之后才改（见后面的 "Code-only promote — record webCommitId"），
      # 不然检查或部署失败时，线上还是旧代码，指针却已经指向没发出去的版本。
      - name: Code-only promote — leave production data untouched
        id: code_only
        if: ${{ env.CODE_ONLY == 'true' }}
        run: |
          [ "$FROM_ARTIFACT" = true ] || { echo "❌ promote=code 必须部署现成产物"; exit 1; }
          echo "DATA_FAST=true" >> "$GITHUB_ENV"
          echo "✅ 只发代码：数据不动（不克隆、不打包、不同步 COS）"

      - name: Data fast path — restore item sitemaps
        id: sitemap_cache
        if: ${{ steps.data_pre.outputs.skip == 'true' && env.FROM_ARTIFACT != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/item-sitemaps
          key: item-sitemaps-v1-${{ needs.resolve.outputs.target }}-${{ needs.resolve.outputs.prod_sha }}-${{ needs.resolve.outputs.text_sha }}-${{ steps.data_pre.outputs.fingerprint }}

      - name: Data fast path — write latest.json only
        id: fast_latest
        # 部署现成产物时 sitemap 已在产物里，不需要缓存
        if: ${{ steps.data_pre.outputs.skip == 'true' && (steps.sitemap_cache.outputs.cache-hit == 'true' || env.FROM_ARTIFACT == 'true') }}
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          WEB_COMMIT_ID: ${{ needs.resolve.outputs.web_ref }}
        run: |
          cd nextjs
          node scripts/cos-sync-decision.mjs latest-only
          echo "DATA_FAST=true" >> "$GITHUB_ENV"
          echo "✅ 数据没变：跳过克隆数据仓、打包、COS 同步；条目 sitemap 用缓存"

      # --- 步骤 1：为 EdgeOne 构建（cos 模式） ---
      #
      # 克隆 book-index（正式仓）与 book-text。overview#432 起不再克隆草稿仓 book-index-draft：
      # 草稿条目不上站。bundle-data.mjs 缺正式仓、或缺其根目录的站点内容文件
      # （resource*.json／recommended.json／promotions.json）都会**报错退出**，不会静默打出空站。
      # overview#470 P1：book-text 浅拉要现压 1.75 GB 的包（实测 08:15 2.6 分 → 16:27 23 分，同一个 commit，随 GitHub 负载忽快忽慢）。
      # 把两个仓的 .git 放进 actions/cache（键＝仓名＋commit，取最近一份），之后在已有对象上只拉新增的；同一个 commit 直接复用；
      # 取不到、或缓存的 .git 超过上限（防只增不减）就退回全量浅拉。缓存只存 .git，工作区文件每次由 checkout 还原。
      - name: Restore git cache — book-index
        id: gc_index
        if: ${{ env.DATA_FAST != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ needs.resolve.outputs.prod_sha || github.run_id }}
          restore-keys: |
            git-cache-v1-book-index-

      - name: Restore git cache — book-text
        id: gc_text
        if: ${{ env.DATA_FAST != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ needs.resolve.outputs.text_sha || github.run_id }}
          restore-keys: |
            git-cache-v1-book-text-

      - name: Clone index data repos
        id: clone
        if: ${{ env.DATA_FAST != 'true' }}
        run: |
          # --- clone_cached:begin（overview#470 P1。正本是 ops/clone-cached.sh；deploy.yml 的 build、prod-artifact 内联两份同文——build 检出的可能是更早的 web 提交，那一版没有这个文件——ops/tests/test_clone_cache.py 守着）
          set -o pipefail
          GIT_BASE_URL="${GIT_BASE_URL:-https://github.com/open-guji}"
          GIT_CACHE_MAX_MB="${GIT_CACHE_MAX_MB:-4096}"
          # git 的 --progress 输出带回车、刷得很密：只留每 15 秒一行（和结束那行）
          git_progress() {
            local last=-99 line
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [ $((SECONDS - last)) -ge 15 ] || [[ "$line" == *", done"* ]]; then echo "    $line"; last=$SECONDS; fi
            done
          }
          # clone_cached <仓名> <目录> <ref>：目录里若有从 actions/cache 取回的 .git，就在已有对象上只拉新增的；没有（或太大）就全量浅拉。
          # 同一个 commit 缓存里已经有的，不再 fetch。每个仓打印开始、结束、用时和 .git 大小。
          clone_cached() {
            local repo="$1" dest="$2" ref="$3" t0=$SECONDS mb had_cache="" neg=""
            echo "▶ 克隆 $repo @ ${ref:0:12}"
            if [ -d "$dest/.git" ]; then
              mb=$(du -sm "$dest/.git" | cut -f1)
              if [ "$mb" -gt "$GIT_CACHE_MAX_MB" ]; then
                echo "· 缓存的 .git 已 ${mb} MB，超过 ${GIT_CACHE_MAX_MB} MB 上限，丢弃后全量浅拉"; rm -rf "$dest/.git"
              else
                echo "· 用缓存的 .git（${mb} MB）：只拉新增对象"; had_cache=1
              fi
            else
              echo "· 没有缓存：全量浅拉"
            fi
            [ -d "$dest/.git" ] || git init -q "$dest"
            if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$' && git -C "$dest" cat-file -e "${ref}^{commit}" 2>/dev/null; then
              echo "· 缓存里已有这个 commit，不再 fetch"
              git -C "$dest" checkout -q -f "$ref"
            else
              # 浅拉（--depth 1）默认不拿本地已有的对象去和服务端对账，缓存再大也会把整棵树重传一遍（2026-10-07 实测 book-text：
              # 缓存是上一个 commit，仍收 218048 个对象、1.75 GiB、229 秒，和全量浅拉一样）。显式给对账起点 --negotiation-tip=HEAD，
              # 服务端才只发新增的（同一对 commit 的 book-index 实测 203915 个对象／106 MiB／26 秒 → 70252 个／12.7 MiB／6 秒）。
              if [ -n "$had_cache" ] && git -C "$dest" rev-parse -q --verify HEAD >/dev/null 2>&1; then neg="--negotiation-tip=HEAD"; fi
              git -C "$dest" fetch --depth 1 $neg --progress "$GIT_BASE_URL/$repo.git" "$ref" 2>&1 | tr '\r' '\n' | git_progress
              git -C "$dest" checkout -q -f FETCH_HEAD
              # 增量拉完 .git 超过上限：就地重来一次全量浅拉，让随后存进缓存的永远是不大的那份（否则超大的条目会一直被恢复）
              mb=$(du -sm "$dest/.git" | cut -f1)
              if [ "$mb" -gt "$GIT_CACHE_MAX_MB" ] && [ -n "${had_cache:-}" ]; then
                echo "· 增量后 .git 已 ${mb} MB，超过 ${GIT_CACHE_MAX_MB} MB 上限：重来一次全量浅拉，避免把超大的缓存存下去"
                rm -rf "$dest/.git"; git init -q "$dest"
                git -C "$dest" fetch --depth 1 --progress "$GIT_BASE_URL/$repo.git" "$ref" 2>&1 | tr '\r' '\n' | git_progress
                git -C "$dest" checkout -q -f FETCH_HEAD
              fi
            fi
            echo "✔ $repo 用时 $((SECONDS - t0)) 秒，.git $(du -sh "$dest/.git" | cut -f1)，commit $(git -C "$dest" rev-parse --short=12 HEAD)"
          }
          # --- clone_cached:end
          # T1：按 resolve 给的 ref 取（staging=main；promote=测试站钉下的 commit）
          # overview#341：resolve 解析出了完整 commit 就按 commit 取，保证与上面「数据没变」的判断是同一版
          clone_cached book-index book-index "${{ needs.resolve.outputs.prod_sha || needs.resolve.outputs.prod_ref }}"
          # 文本仓（2026-08-26 自 book-index 拆出）：整理本／辑佚／全文／抓取素材。
          # 不 clone 则 items/ 全空，而 bundle-data 的 existsSync 为假只是静默跳过，
          # 构建照样成功——整理本页在站上空白，无人得知。
          clone_cached book-text book-text "${{ needs.resolve.outputs.text_sha || needs.resolve.outputs.text_ref }}"
          echo "index_sha=$(git -C book-index rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "text_sha=$(git -C book-text rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Save git cache — book-index
        if: ${{ env.DATA_FAST != 'true' && steps.gc_index.outputs.cache-hit != 'true' && steps.clone.outputs.index_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ steps.clone.outputs.index_sha }}

      - name: Save git cache — book-text
        if: ${{ env.DATA_FAST != 'true' && steps.gc_text.outputs.cache-hit != 'true' && steps.clone.outputs.text_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ steps.clone.outputs.text_sha }}

      # S2：数据产物统一输出到 nextjs/ 之外（全栈 SSR 前提；也从源头杜绝数据混进 Pages 产物）。
      # 后续所有步骤与脚本（scripts/lib/data-dirs.mjs）都从 KYG_DATA_ROOT 读写。
      - name: Set data output root (outside nextjs/)
        run: echo "KYG_DATA_ROOT=$RUNNER_TEMP/kyg-data" >> "$GITHUB_ENV"

      # schema-v2（overview#458）：新 schema 的源档不再存反向／派生字段（Work.books、Entity.works、_classifications…），
      # 网站打包前在检出的 book-index 上跑 build/build_derived.py，产物写临时目录，
      # 打包脚本经 BOOK_INDEX_DERIVED_DIR 读（scripts/lib/derived.mjs）。仓里没有该脚本（旧 schema）就跳过，
      # 打包照旧读源档——双兼容：数据切换那天不用改这里。退出码非 0 = 自校验失败，整个构建失败，不继续打包。
      - name: Build derived data (schema-v2)
        if: ${{ env.DATA_FAST != 'true' }}
        run: |
          if [ -f book-index/build/build_derived.py ]; then
            D="$RUNNER_TEMP/book-index-derived"
            s=$SECONDS; echo "▶ build_derived 开始 $(date -u +%H:%M:%S) UTC"
            (cd book-index && python3 build/build_derived.py --out "$D")
            echo "✔ build_derived 用时 $((SECONDS - s)) 秒，产物 $(du -sh "$D" | cut -f1)"
            echo "BOOK_INDEX_DERIVED_DIR=$D" >> "$GITHUB_ENV"
          else
            echo "book-index 没有 build/build_derived.py：旧 schema，打包读源档"
          fi

      - name: Bundle data for EdgeOne
        if: ${{ env.DATA_FAST != 'true' }}
        working-directory: nextjs
        env:
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
          BOOK_TEXT_DIR: ${{ github.workspace }}/book-text
        run: |
          s=$SECONDS; echo "▶ 打包数据开始 $(date -u +%H:%M:%S) UTC"
          node scripts/bundle-data.mjs
          echo "✔ 打包数据用时 $((SECONDS - s)) 秒"
          # T1：指针里记下这次用的网站代码 commit，promote 时据此取同一版代码
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['KYG_DATA_ROOT'], 'latest.json')
          with open(p) as f:
              d = json.load(f)
          d['webCommitId'] = '${{ needs.resolve.outputs.web_ref }}'
          with open(p, 'w') as f:
              json.dump(d, f)
          PY

      - name: Verify bundled data
        if: ${{ env.DATA_FAST != 'true' }}
        run: |
          # S2：public/ 下不应再有任何数据产物
          for f in data data-h1 data-h1-text latest.json; do
            if [ -e "nextjs/public/$f" ]; then
              echo "❌ nextjs/public/$f 不应存在（数据产物应在 KYG_DATA_ROOT=$KYG_DATA_ROOT）" && exit 1
            fi
          done
          cd "$KYG_DATA_ROOT/data"
          # 历史遗留产物（Phase 1 之前的 index.json / search_s.json，Phase 2 的 chunks/）
          # 若仍存在说明 bundle-data.mjs 没走干净，提前阻止上线
          for f in index.json search_s.json; do
            if [ -f "$f" ]; then
              echo "❌ Stale $f should not be present" && exit 1
            fi
          done
          if [ -d chunks ]; then
            echo "❌ Stale chunks/ should not be present (Phase 3 改 entry/)" && exit 1
          fi
          for f in meta.json resource.json resource-catalog.json resource-collection.json resource-site.json recommended.json version.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing $f" && exit 1
            fi
            echo "✓ $f ($(wc -c < "$f") bytes)"
          done
          # 14.7 万文件时 ls entry/*.json 参数展开过长，一直打印 0（S2 发现），改用 find 并设下限
          N_ENTRY=$(find entry -maxdepth 1 -name '*.json' | wc -l)
          echo "✓ $N_ENTRY entry files"
          if [ "$N_ENTRY" -lt 100000 ]; then
            echo "❌ entry 文件只有 $N_ENTRY 个（应在 14 万以上），打包可能不完整" && exit 1
          fi
          ls search/core-*.json | wc -l | xargs -I{} echo "✓ {} search shards"
          # latest.json 由 bundle-data.mjs 输出到 public/ (data/ 同级)，sync-to-cos.mjs 单独上传
          [ -f ../latest.json ] && echo "✓ latest.json ($(wc -c < ../latest.json) bytes)" || (echo "❌ Missing \$KYG_DATA_ROOT/latest.json" && exit 1)

      # 守卫：production（已升格）条目必须进入产物。
      # bundle-data.mjs 在 production 仓缺失时是**静默**跳过的，只靠上面的
      # 文件存在性检查发现不了 —— 这里逐个比对正式库索引里的 ID。
      - name: Verify production entries bundled
        if: ${{ env.DATA_FAST != 'true' }}
        run: |
          node -e "
          const fs = require('fs');
          const prodIndex = JSON.parse(
            fs.readFileSync('book-index/index/collections.json', 'utf-8'));
          const ids = Object.keys(prodIndex);
          if (ids.length === 0) {
            console.log('· production 索引为空，跳过校验');
            process.exit(0);
          }
          const missing = ids.filter(
            id => !fs.existsSync(process.env.KYG_DATA_ROOT + '/data/entry/' + id + '.json'));
          if (missing.length) {
            console.error('❌ ' + missing.length + '/' + ids.length +
              ' 个正式条目未进入产物（BOOK_INDEX_PRODUCTION_DIR 没生效？）');
            console.error('   缺失示例: ' + missing.slice(0, 5).join(', '));
            process.exit(1);
          }
          console.log('✓ ' + ids.length + ' 个正式丛编条目均已打包');
          "

      # 私有文本（P1-私有文本后端）设计上从不进 bundle-data.mjs：上面 Bundle 步骤
      # 没传 BOOK_TEXT_PRIVATE_DIR 给它，它压根不知道这个目录存在。这一步是事后
      # 防线——防的是「以后有人手滑把私有目录接进 bundle-data.mjs」，而不是防
      # 这一次没接。命令与判据都在这（PR 里贴的实测即这一步的日志）。
      - name: Verify no private text leaked into public data
        if: ${{ env.DATA_FAST != 'true' }}
        run: |
          cd "$KYG_DATA_ROOT/data"
          if grep -rl "book-text-private\|仅内部校对使用\|不得公开" . ; then
            echo "❌ 公开产物里出现了私有文本相关内容，上一条命令列出的文件即命中位置" && exit 1
          fi
          echo "✓ public/data 全量 grep 私有文本标记（book-text-private／仅内部校对使用／不得公开）：0 命中"

      # overview#470 P0：数据包检查，**只报告、不阻断**（continue-on-error；脚本本身在只报告模式下也恒退出 0）。
      # 在打好的数据包上查格式契约（ops/data-contract.mjs）、条目数下限、与上一次发布相比数量有没有突降，
      # 结果写进 job summary，统计 JSON 存成工件（30 天）。攒两周数据校准阈值（ops/data-package-check.mjs 的 THRESHOLDS）后再开阻断。
      # 对比基线＝本目标上一次发布的 latest.json／meta.json（测试站是 staging/ 前缀）；读不到只记一条提示。
      - name: Data package check (report-only, overview#470 P0)
        id: dpc
        if: ${{ env.DATA_FAST != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node ops/data-package-check.mjs \
            --baseline "https://data.kaiyuanguji.com${COS_PATH_PREFIX:+/$COS_PATH_PREFIX}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "$RUNNER_TEMP/data-package-stats.json"

      - name: Upload data package stats (overview#470 P0)
        if: ${{ always() && env.DATA_FAST != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: data-package-stats-${{ needs.resolve.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/data-package-stats.json
          if-no-files-found: ignore
          retention-days: 30

      # --- COS 数据同步（overview#293 提速：数据没变就不传；没变不了就三路并行）---
      #
      # 原来是串行的五步：同步 current/ → 打包 h1 → 记旧 root → 同步 h1 → 打包 h1 文本 → 同步 h1 文本，约 8 分钟。
      # 现在：
      #   ① 先判定（cos-sync-decision.mjs decide）：三个数据仓的 commit、网站打包脚本的指纹，和线上
      #      「上次完整同步」的标记、线上 latest.json 全部对得上，才跳过；任何读不到／对不上都照常同步。
      #      只比三仓 commit 不够：网站的打包脚本（总目、阅读索引、搜索分片、h1 哈希）一改，产物就变，
      #      数据仓却没动——那样跳过会让新产物永远上不了线；所以脚本指纹也要一致（见 lib/cos-sync-decision.mjs 头注释）。
      #   ② 跳过时 latest.json 仍然要写：以线上现有的为底只改 webCommitId（promote 靠它决定上正式站的代码），
      #      其它字段原样保留。这一步失败就退回照常同步。
      #   ③ 不跳过时，三路（current/、h1/ 条目、h1/ 文本）并行，COS 并发各自调小、总数不超过串行时的 80。
      #   ④ 三路都成功才写「同步标记」（_deploy/sync-marker.json）——h1 两路失败只警告（同以前），
      #      但不写标记，下次不会把没传全的当成已同步。
      - name: Decide COS data sync (skip when data unchanged)
        id: cos_decide
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
        run: |
          cd nextjs
          # 这次实际用来打包的数据仓 commit（与 latest.json 里 productionCommitId／textCommitId 同口径；fullCommitId 即 productionCommitId）
          export PROD_COMMIT="$(git -C "$GITHUB_WORKSPACE/book-index" rev-parse HEAD)"
          export TEXT_COMMIT="$(git -C "$GITHUB_WORKSPACE/book-text" rev-parse HEAD)"
          node scripts/cos-sync-decision.mjs decide

      - name: Write latest.json only (data unchanged, skip COS data upload)
        id: cos_latest_only
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' && steps.cos_decide.outputs.skip == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          WEB_COMMIT_ID: ${{ needs.resolve.outputs.web_ref }}
        run: |
          cd nextjs
          node scripts/cos-sync-decision.mjs latest-only

      # W2-3：测试站在 h1 指针翻转之前记下旧 root，部署后据此算「哪些条目变了」
      # （item-changes.mjs）。取不到（首次发布／指针格式旧）就留空，按全部新增处理。
      # CUT2 起正式站也全栈：部署到 kyg-ssr-spike 后据此按改动失效 www 的条目页。
      # 必须在下面的 h1 同步（会翻转指针）之前；数据没变时它就是现行 root，item-changes 算出来是「没变」。
      - name: Record previous h1 root (W2-3)
        if: ${{ env.SPLIT_DATA != 'true' }}
        run: |
          P="${COS_PATH_PREFIX:+$COS_PATH_PREFIX/}"
          R=$(curl -sf "https://data.kaiyuanguji.com/${P}h1/manifest-root.json?t=$(date +%s)" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('root',''))" 2>/dev/null || true)
          echo "OLD_H1_ROOT=$R" >> "$GITHUB_ENV"
          echo "· 发布前 ${DEPLOY_TARGET} h1 root：${R:-（无）}"

      # 三路并行，各自写不同的前缀，互不覆盖：
      #   current/ 与 v/<cacheKey>/search/（sync-to-cos.mjs，失败则整步失败，同以前）
      #   h1/entry、h1/manifest…（bundle-hashed.mjs → sync-h1-to-cos.mjs；A3 第一期，失败只警告）
      #   h1/text、h1/text-manifest…（bundle-hashed-text.mjs → sync-h1-text-to-cos.mjs；A3b 第二期，失败只警告）
      # h1 两路 continue-on-error 的理由不变：新链路不能拖累 current/ 已经成功的发布。
      # COS 限流：三个脚本的并发原来都是 80（串行，同一时刻只有一个在传）；并行时各自调小，
      # 加起来仍是 80（COS_CONCURRENCY，见 lib/cos-sync-decision.mjs），不会因为叠加而撞限流。
      # 并发分配（2026-10-01 按文本迁移后第一次全量上传的实测重分：每个并发槽约 4 个对象/秒，上传耗时只与「对象数／并发」有关）：
      #   current/ 13.3 万个对象 c=48 用了 657 秒（≈203 个/秒）；h1 文本 12.7 万个对象 c=8 用了约 66 分钟（≈32 个/秒）。
      #   h1 条目平时只传增量、很轻，h1 文本在数据大换血（如文本迁移）时才重。三路加起来仍是 80：
      #   current/ 36＋h1 条目 12＋h1 文本 32，同样的全量上传三路都在 15～17 分钟内结束（原来文本那一路拖 66 分钟）。
      # 2026-10-07（overview#469、#470 P0）：上面的静态分配改成动态——三路共用 COS_TOTAL_BUDGET（80）的名额，按各路「剩余待传数」
      # 的比例随时分配（scripts/lib/cos-slots.mjs，登记目录 COS_PLAN_DIR；每路至少 4 个，没活的路让出名额）。
      # 原因：平时只有一路有活，静态切法让另外两路的名额闲着；全量变化（文本迁移、schema-v2）时 h1 条目 14.7 万个对象
      # 只有 12 个并发，10-07 那次 77 分钟没传完。下面各路命令行里的静态 COS_CONCURRENCY 只在分配器起不来时兜底。
      # 各路日志先落文件、结束后按组打印（并行时混在一起没法读）；期间每分钟打一行心跳。
      # overview#410：sync-to-cos 增量同步靠 nextjs/.next/.sync-state.json（上次成功同步时 current/ 的远端状态：相对路径 → md5）。
      # 它不在 checkout 里，CI 每次都是全新环境，于是每次真同步都要先把 current/ 整个 LIST 一遍（约 330～700 次请求）。
      # 现在存进 actions/cache：键含目标站（测试站写 staging/ 前缀、正式站写根，两份状态不能混）和桶名的哈希（换桶自动作废），
      # 取最近一份（精确键带 run_id 和 run_attempt：重跑老 run 时不会命中它自己当年存的旧状态，而是取最新的）；同步成功后存一份新的。缓存拿不到或取到的状态不可信，都退回 LIST 重建，行为与原来一样。
      # 要强制作废：把下面三处键里的版本号加一（如 v2→v3），或在仓库 Actions → Caches 里删掉 cos-sync-state-*。
      # 2026-10-07 已作废一次（v1→v2）：run 37580114922（prod_ref=schema-v2）在 current/ 同步完、存缓存前被取消，
      # 下一次 run 取回更早的旧 state，判定条目「没变」而没重传，staging current/ 留着 schema-v2 产物（contract 抓到）。
      - name: COS sync state — cache key (overview#410)
        id: cos_state_key
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' && (steps.cos_decide.outputs.skip != 'true' || steps.cos_latest_only.outcome == 'failure') }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: echo "bucket=$(printf '%s' "$COS_BUCKET" | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: COS sync state — restore (overview#410)
        id: cos_state_restore
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' && (steps.cos_decide.outputs.skip != 'true' || steps.cos_latest_only.outcome == 'failure') }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
        uses: actions/cache/restore@v4
        with:
          path: nextjs/.next/.sync-state.json
          key: cos-sync-state-v2-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cos-sync-state-v2-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-

      # 第二轮提速：h1 条目、h1 文本两路同步各有一份 state（.next/.sync-h1-state.json、.sync-h1-text-state.json，
      # 格式同上：相对路径 → md5）。它们以前不进缓存，每次真同步两路各把 h1/ 整个 LIST 一遍（约 38 万个对象，实测每路 3～3.5 分钟，
      # 两路并行抢同一个限流），是同步这一步的长杆。做法与上面 current/ 的缓存一致（键含目标站与桶名哈希、取最近一份、
      # 取不到或不可信就退回 LIST 重建），另有三层保险：
      #   ⓪ **state 可信度保护（三路都有，scripts/lib/state-guard.mjs）**：动桶之前先往 COS 写 dirty 标记，全部成功后才改 clean，
      #      state 里记着对应的版本；用缓存前先读标记与现行指针，对不上（取消、半截失败、别的写入者）就丢掉 state、LIST 重建。
      #      这一层才是「取消／中途失败」的根本修复，不再靠改键（10-07 run 37580114922 被取消后 37588367536 取回旧 state 的事故）。
      #   ① 只在三路都成功（all_ok）之后才存缓存——多一道，哪怕标记逻辑有漏也不把失败那轮的 state 传下去；
      #   ② 夜间数据发布（定时的测试站部署、自动派的正式站 promote=data）强制重建（SYNC_REBUILD_STATE=1，见同步步骤）；
      #      数据没变的那天不同步、也就不重建，所以桶被手工改过时最迟在下一次数据有变化的夜间发布自愈。
      # 手工动过桶里 h1/（删前缀、重传）之后，把下面三处键里的 v1 改成 v2 立即作废。
      - name: COS h1 state — restore (second-round speedup)
        id: cos_h1_state_restore
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' && (steps.cos_decide.outputs.skip != 'true' || steps.cos_latest_only.outcome == 'failure') }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            nextjs/.next/.sync-h1-state.json
            nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-state-v1-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cos-h1-state-v1-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-

      - name: Sync data to Tencent COS — current/ + h1 entry + h1 text, in parallel
        id: cos_sync
        if: ${{ env.HAS_COS_SECRETS == 'true' && env.DATA_FAST != 'true' && (steps.cos_decide.outputs.skip != 'true' || steps.cos_latest_only.outcome == 'failure') }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          # 三路共用并发预算、按待传数动态分配（scripts/lib/cos-slots.mjs）；不设 COS_PLAN_DIR 就是各路静态的 COS_CONCURRENCY
          COS_PLAN_DIR: ${{ runner.temp }}/cos-plan
          COS_TOTAL_BUDGET: '80'
          # 数据发布那条夜间路径不信缓存里的 state，从 COS 重新 LIST 重建（三个脚本都认 SYNC_REBUILD_STATE=1）：
          # 定时的测试站部署，以及它自动派的正式站 promote=data（那是单独的 workflow_dispatch，所以要单列）。
          # 只在这次真的要同步时才生效——数据没变的定时 run 在上面的 decide 就跳过了同步，没有东西可重建；
          # 所以「桶被手工改过」最迟在下一次数据有变化的夜间发布时自愈，不是每天都保证。
          # push 和 code+data 的 promote（from_run）照用缓存；手工动过桶就改键 v1→v2 立即作废。
          SYNC_REBUILD_STATE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.promote == 'data')) && '1' || '' }}
        run: |
          cd nextjs
          LOGS="$RUNNER_TEMP/cos-sync-logs"; mkdir -p "$LOGS"
          rm -rf "$COS_PLAN_DIR"
          set +e
          # 各路的用时打在各自日志末尾（并行时看不出谁是长杆，这是下一轮提速要用的数）
          ( s=$SECONDS; COS_CONCURRENCY=36 node scripts/sync-to-cos.mjs; rc=$?; echo "· current/ 一路共用时 $((SECONDS - s)) 秒（exit $rc）"; exit $rc ) > "$LOGS/current.log" 2>&1 &
          P_CUR=$!
          ( s=$SECONDS; node scripts/bundle-hashed.mjs && { echo "· h1 条目打包用时 $((SECONDS - s)) 秒"; COS_CONCURRENCY=12 node scripts/sync-h1-to-cos.mjs; }; rc=$?; echo "· h1 条目一路共用时 $((SECONDS - s)) 秒（exit $rc）"; exit $rc ) > "$LOGS/h1-entry.log" 2>&1 &
          P_H1=$!
          ( s=$SECONDS; node scripts/bundle-hashed-text.mjs && { echo "· h1 文本打包用时 $((SECONDS - s)) 秒"; COS_CONCURRENCY=32 node scripts/sync-h1-text-to-cos.mjs; }; rc=$?; echo "· h1 文本一路共用时 $((SECONDS - s)) 秒（exit $rc）"; exit $rc ) > "$LOGS/h1-text.log" 2>&1 &
          P_TXT=$!
          # 心跳：每分钟一行，写各路的已完成／总数／速率／预计剩余（读各路日志里 runQueue 的进度，scripts/sync-heartbeat.mjs；
          # 部署的是早于它的代码时没有这个文件，退回只打时间）
          ( while :; do sleep 60; if [ -f scripts/sync-heartbeat.mjs ]; then node scripts/sync-heartbeat.mjs "$LOGS" || true; else echo "· COS 同步进行中 $(date -u +%H:%M:%S) UTC"; fi; done ) &
          HB=$!
          wait $P_CUR; R_CUR=$?
          wait $P_H1;  R_H1=$?
          wait $P_TXT; R_TXT=$?
          kill $HB 2>/dev/null
          for pair in "current/:current:$R_CUR" "h1 条目:h1-entry:$R_H1" "h1 文本:h1-text:$R_TXT"; do
            title="${pair%%:*}"; rest="${pair#*:}"; f="${rest%%:*}"; rc="${rest##*:}"
            echo "::group::COS 同步 · $title（exit $rc）"
            tr '\r' '\n' < "$LOGS/$f.log" | awk 'BEGIN{last=""} { if ($0 ~ /^  [a-z0-9-]+: [0-9]+\/[0-9]+ \(/) { last=$0; next } if (last != "") { print last; last="" } print } END{ if (last != "") print last }'
            echo "::endgroup::"
          done
          if [ "$R_CUR" -ne 0 ]; then
            echo "❌ current/ 同步失败（exit $R_CUR）——数据没有上线，整步失败"
            exit 1
          fi
          ALL_OK=true
          if [ "$R_H1" -ne 0 ];  then echo "::warning::h1 条目同步失败（exit $R_H1），只警告，不拦发布（A3 第一期，前端默认不读 h1/）"; ALL_OK=false; fi
          if [ "$R_TXT" -ne 0 ]; then echo "::warning::h1 文本同步失败（exit $R_TXT），只警告，不拦发布（A3b 第二期，前端默认不读 h1/）"; ALL_OK=false; fi
          echo "all_ok=$ALL_OK" >> "$GITHUB_OUTPUT"

      # 同步成功（current/ 那一路成功就会写新的 state）后把它存回缓存；失败或跳过时不存，免得把半截状态传给下一次
      - name: COS sync state — save (overview#410)
        if: ${{ steps.cos_sync.outcome == 'success' && steps.cos_state_key.outputs.bucket != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nextjs/.next/.sync-state.json
          key: cos-sync-state-v2-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: COS h1 state — save (second-round speedup)
        if: ${{ steps.cos_sync.outputs.all_ok == 'true' && steps.cos_state_key.outputs.bucket != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            nextjs/.next/.sync-h1-state.json
            nextjs/.next/.sync-h1-text-state.json
          key: cos-h1-state-v1-${{ needs.resolve.outputs.target }}-${{ steps.cos_state_key.outputs.bucket }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 三路都成功才写标记：下次三仓 commit 与打包脚本都没变时，据此跳过整段同步
      - name: Mark COS sync complete
        if: ${{ env.HAS_COS_SECRETS == 'true' && steps.cos_sync.outputs.all_ok == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          WEB_COMMIT_ID: ${{ needs.resolve.outputs.web_ref }}
        run: |
          cd nextjs
          export PROD_COMMIT="$(git -C "$GITHUB_WORKSPACE/book-index" rev-parse HEAD)"
          export TEXT_COMMIT="$(git -C "$GITHUB_WORKSPACE/book-text" rev-parse HEAD)"
          node scripts/cos-sync-decision.mjs mark

      # overview#470 P0：h1 与 current/ 逐字节比对（抽样，**只报告**）。这两个脚本早就有（verify-hashed-parity.mjs／
      # verify-hashed-text-parity.mjs，A3／A3b 的完成判据），但没有任何 workflow 在跑。用 run id 当种子，每次抽到不同的条目，
      # 覆盖面随部署次数累积；不一致时只发 ::warning:: 与 job summary，不拦发布（步骤恒退出 0，且 continue-on-error）。
      # 放在 COS 同步之后：h1 目录由同步步骤里的 bundle-hashed*.mjs 打出；数据没变、同步被跳过时没有 h1 目录，这一步跳过。
      - name: h1 vs current parity sampling (report-only, overview#470 P0)
        id: parity
        if: ${{ steps.cos_sync.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        working-directory: nextjs
        env:
          SAMPLE_SIZE: '200'
          SAMPLE_SEED: ${{ github.run_id }}
        run: |
          set +e
          node scripts/verify-hashed-parity.mjs > "$RUNNER_TEMP/parity-entry.log" 2>&1; E1=$?
          node scripts/verify-hashed-text-parity.mjs > "$RUNNER_TEMP/parity-text.log" 2>&1; E2=$?
          {
            echo "## h1 与 current/ 逐字节比对（抽样，只报告，overview#470 P0）"
            echo
            for pair in "条目:$E1:parity-entry" "阅读文本:$E2:parity-text"; do
              name="${pair%%:*}"; rest="${pair#*:}"; rc="${rest%%:*}"; f="${rest##*:}"
              if [ "$rc" -eq 0 ]; then icon="✅"; else icon="🟡"; fi
              echo "- $icon **$name**（退出码 $rc）：$(grep -E '逐字一致' "$RUNNER_TEMP/$f.log" | head -1)"
              if [ "$rc" -ne 0 ]; then
                echo '  ```'
                grep -E '不一致|❌|不存在|找不到' "$RUNNER_TEMP/$f.log" | head -20 | sed 's/^/  /'
                echo '  ```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/parity-entry.log" "$RUNNER_TEMP/parity-text.log"
          # ::warning:: 要打到步骤日志里才成注释，不能写进上面重定向到 summary 的那一块
          [ "$E1" -eq 0 ] || echo "::warning title=h1 与 current/ 抽样不一致::条目比对退出码 $E1，见 job summary（只报告，不拦发布）"
          [ "$E2" -eq 0 ] || echo "::warning title=h1 与 current/ 抽样不一致::阅读文本比对退出码 $E2，见 job summary（只报告，不拦发布）"
          exit 0

      # W2-3（31 卡 §A.7）：条目 sitemap 分片，写进 nextjs/public/ 随全栈产物发布；<loc> 按目标指向 www 或测试站
      # （测试站 robots.txt 全禁、不列 sitemap）。overview#341：数据没变的快路上用缓存（同一站点、同一份数据、
      # 同一版打包脚本生成的，内容一样）；照常打包时生成后存一份缓存，下次快路用。
      - name: Item sitemaps (W2-3)
        # overview#470 P1：数据流程已拆出时 sitemap 走路由代理（数据前缀 sitemaps/），构建不生成
        if: ${{ env.FROM_ARTIFACT != 'true' && env.SPLIT_DATA != 'true' }}
        working-directory: nextjs
        env:
          SITEMAP_SITE: ${{ needs.resolve.outputs.target == 'staging' && 'https://staging.kaiyuanguji.com' || 'https://www.kaiyuanguji.com' }}
        run: |
          OUT="$RUNNER_TEMP/item-sitemaps"
          if [ "$DATA_FAST" != true ]; then
            rm -rf "$OUT"
            SITEMAP_OUT_DIR="$OUT" node scripts/gen-sitemaps.mjs
          else
            echo "· 用缓存的条目 sitemap（$(ls "$OUT"/sitemaps | wc -l) 个分片）"
          fi
          test -f "$OUT/sitemap-index.xml" && ls "$OUT"/sitemaps/*.xml > /dev/null \
            || { echo "❌ 条目 sitemap 不全"; ls -la "$OUT"; exit 1; }
          grep -q "<loc>$SITEMAP_SITE/" "$OUT/sitemap-index.xml" \
            || { echo "❌ sitemap 索引里的地址不是 $SITEMAP_SITE"; head -c 600 "$OUT/sitemap-index.xml"; exit 1; }
          rm -rf public/sitemaps public/sitemap-index.xml
          cp -r "$OUT/sitemaps" public/sitemaps
          cp "$OUT/sitemap-index.xml" public/sitemap-index.xml

      - name: Save item sitemaps cache (overview#341)
        if: ${{ env.DATA_FAST != 'true' && env.FROM_ARTIFACT != 'true' && steps.data_pre.outputs.fingerprint != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/item-sitemaps
          key: item-sitemaps-v1-${{ needs.resolve.outputs.target }}-${{ needs.resolve.outputs.prod_sha }}-${{ needs.resolve.outputs.text_sha }}-${{ steps.data_pre.outputs.fingerprint }}

      # W2-3：条目页按需失效接口（/internal/revalidate）的密钥。由 EDGEONE_API_TOKEN
      # 派生（HMAC），不需要另建 secret；构建期写进服务端代码，部署后的失效步骤用同一个值。
      # overview#341：两站都在这里派生（原来正式站在自己的构建步骤里派生）——部署现成产物时不构建，失效步骤也要它。
      - name: Derive revalidate secret (W2-3)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          S=$(printf 'kyg-item-revalidate' | openssl dgst -sha256 -hmac "$EDGEONE_API_TOKEN" | awk '{print $NF}')
          echo "::add-mask::$S"
          echo "KYG_REVALIDATE_SECRET=$S" >> "$GITHUB_ENV"

      # CUT2（overview#241）：正式站＝全栈项目 kyg-ssr-spike（www 已于 09-28 换绑过去）。
      # 原来的静态导出＋推 edgeone-release（发旧项目 kaiyuanguji）去掉：旧项目保留 4 周作回滚目标，
      # 回滚靠控制台换绑，CI 不再推它（docs/cutover.md「切完以后」）。
      # 本步骤即原 W2b 双跑那一步转正：同一套全栈构建，失败就拦发布（不再 continue-on-error）。
      # 为什么经 ops/edgeone-fullstack-build.py、为什么先 makers build 再 deploy：见下面测试站那一步的注释。
      # overview#341：prod-artifact 任务里有一份同样的构建（env 必须一致，ops/tests/test_deploy_workflow.py 守着）。
      - name: Build for EdgeOne (production, fullstack → kyg-ssr-spike)
        if: ${{ env.DEPLOY_TARGET == 'production' && env.FROM_ARTIFACT != 'true' }}
        env:
          # E1：只用来读 kyg-ssr-spike 的项目环境变量；不进构建子进程
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          KYG_RENDER_MODE: fullstack
          # /api/version 的 target：全栈＋正式站配置按默认会记成 ssr-test（双跑期口径），这里显式写 production
          KYG_DEPLOY_TARGET: production
          NEXT_PUBLIC_MODE: ''
          # 数据源 = cos：浏览器与云函数都从 data.kaiyuanguji.com 拉，靠 latest.json 解析版本
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
          NEXT_PUBLIC_COS_BASE: https://data.kaiyuanguji.com
          # overview#470 P1：数据流程已拆出时 sitemap 走路由代理（构建时开关；build 与 prod-artifact 两份必须一致）
          NEXT_PUBLIC_SITEMAP_PROXY: ${{ needs.resolve.outputs.split == 'true' && '1' || '' }}
          NEXT_PUBLIC_SITE_ENV: ''
          NEXT_PUBLIC_SITE_URL: https://www.kaiyuanguji.com
          # Hybrid 搜索：L1 = Meilisearch on 上海云（EdgeOne 反代）
          # L1 失败时自动 fallback 到 worker 索引（L2，COS 或 /data/search）
          NEXT_PUBLIC_MEILI_URL: https://api.kaiyuanguji.com
          # 兜底值是「公开只读搜索 key」（本来就随 JS 发给每个浏览器，非机密；
          # 绝不能在这里放 master key）。secret 缺失曾导致构建时 key 为空、
          # 线上搜索全 401（2026-08 事故）。轮换 key 后请同步更新这里和 secret。
          NEXT_PUBLIC_MEILI_KEY: ${{ secrets.MEILI_SEARCH_KEY || '1b0b438f7eadd34e1a6b53c76d63bd3614822d3ec9856251c9340a78456c5465' }}
          # 访问统计站点 ID（G-24）：仓库 Settings → Variables 里配 BAIDU_TONGJI_ID / GA_ID。
          # 非机密（本来就写在页面里）；没配则不加载统计脚本。
          # 双跑期 ssr-test 不带（免得与 www 重复计数）；现在它就是 www，照旧带上
          NEXT_PUBLIC_BAIDU_TONGJI_ID: ${{ vars.BAIDU_TONGJI_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_BASE_PATH: ''
        run: |
          if [ "$NEXT_PUBLIC_DATA_SOURCE" != "cos" ]; then
            echo "❌ 全栈构建只支持 cos 数据源（COS secrets 缺失）：函数按请求从 COS 取条目，没有降级路径"
            exit 1
          fi
          # 条目页按需失效接口的密钥 KYG_REVALIDATE_SECRET 已由上面「Derive revalidate secret」写进环境
          cd nextjs
          # 条目 sitemap 分片（W2-3）已由上面「Item sitemaps」一步放进 public/（<loc> 指向 www），这里不能删
          rm -rf .next out .edgeone edge-functions
          # 边缘函数（/api/*、/oauth/*）随全栈产物一起编译：CLI 只认项目根下的 edge-functions/
          cp -r ../edge-functions ./edge-functions
          # E1：带 kyg-ssr-spike 的项目变量构建并查产物（脚本内含 3 次重试，只重试构建本身）
          s=$SECONDS; echo "▶ EdgeOne 全栈构建开始 $(date -u +%H:%M:%S) UTC"
          python3 ../ops/edgeone-fullstack-build.py -n kyg-ssr-spike --forbid-env EDGEONE_API_TOKEN \
            --require AUTH_JWT_SECRET --require ERROR_VIEW_TOKEN \
            -- npx -y edgeone@1.6.41 makers build
          echo "✔ EdgeOne 全栈构建用时 $((SECONDS - s)) 秒"
          du -sh .edgeone | xargs echo "EdgeOne (fullstack) bundle size:"
          find .edgeone -type f | wc -l | xargs echo "EdgeOne (fullstack) file count:"

      # W2（31 卡 §A）：测试站全栈构建——静态页照旧构建期预渲染，/item/[id] 由云函数按请求渲染。
      # 为什么先 `makers build` 再 `makers deploy .edgeone`、不让 deploy 自动构建：
      # deploy 自动构建时**不继承本步骤的环境变量**（只用控制台项目变量＋./.env），
      # NEXT_PUBLIC_*、KYG_RENDER_MODE 全丢——spike 分支当年只好把开关写死。
      # `makers build` 则继承 process.env（edgeone 1.6.41 源码与本地实跑均已核对）。
      # E1（2026-09-27）：它还把构建进程的**整份** process.env 当字面量烘进边缘函数的 context.env，
      # 控制台配的项目变量运行时并不注入（/api/auth/me 因此 503）。所以两支全栈构建都经
      # ops/edgeone-fullstack-build.py 跑：读项目变量只放进白名单环境的构建子进程（CI 的 token
      # 等进不去），构建后查产物无 .env、项目变量只在边缘函数里、CI 机密不在产物里。不打印值。
      # CLI 版本钉死：构建产物格式须与部署时的 CLI 一致。
      - name: Build for EdgeOne (staging, fullstack)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        env:
          # E1：只用来读 kyg-staging 的项目环境变量；不进构建子进程
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          KYG_RENDER_MODE: fullstack
          NEXT_PUBLIC_MODE: ''
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
          # overview#470 P1：数据流程已拆出时测试站直接读正式站数据前缀（没有自己的数据）
          NEXT_PUBLIC_COS_BASE: ${{ needs.resolve.outputs.split == 'true' && 'https://data.kaiyuanguji.com' || 'https://data.kaiyuanguji.com/staging' }}
          NEXT_PUBLIC_SITEMAP_PROXY: ${{ needs.resolve.outputs.split == 'true' && '1' || '' }}
          NEXT_PUBLIC_SITE_ENV: staging
          NEXT_PUBLIC_SITE_URL: https://staging.kaiyuanguji.com
          NEXT_PUBLIC_MEILI_URL: https://api.kaiyuanguji.com
          # 兜底值同正式站那一步：公开只读搜索 key，非机密
          NEXT_PUBLIC_MEILI_KEY: ${{ secrets.MEILI_SEARCH_KEY || '1b0b438f7eadd34e1a6b53c76d63bd3614822d3ec9856251c9340a78456c5465' }}
          # 测试站不上报统计
          NEXT_PUBLIC_BAIDU_TONGJI_ID: ''
          NEXT_PUBLIC_GA_ID: ''
          NEXT_PUBLIC_BASE_PATH: ''
        run: |
          if [ "$NEXT_PUBLIC_DATA_SOURCE" != "cos" ]; then
            echo "❌ 测试站全栈构建只支持 cos 数据源（COS secrets 缺失）：函数按请求从 COS 取条目，没有降级路径"
            exit 1
          fi
          cd nextjs
          rm -rf .next out .edgeone edge-functions
          # 边缘函数（/api/*、/oauth/*）随全栈产物一起编译：CLI 只认项目根下的 edge-functions/
          cp -r ../edge-functions ./edge-functions
          # E1：带 kyg-staging 的项目变量构建并查产物（脚本内含与正式站那一步同样的 3 次重试，
          # 只重试构建本身——Google Fonts 偶发抖动）
          s=$SECONDS; echo "▶ EdgeOne 全栈构建开始 $(date -u +%H:%M:%S) UTC"
          python3 ../ops/edgeone-fullstack-build.py -n kyg-staging --forbid-env EDGEONE_API_TOKEN \
            --require AUTH_JWT_SECRET --require ERROR_VIEW_TOKEN \
            -- npx -y edgeone@1.6.41 makers build
          echo "✔ EdgeOne 全栈构建用时 $((SECONDS - s)) 秒"
          du -sh .edgeone | xargs echo "EdgeOne (fullstack) bundle size:"
          find .edgeone -type f | wc -l | xargs echo "EdgeOne (fullstack) file count:"

      # overview#341：正式站部署测试站那次 run 存的正式站产物（prod-artifact 任务构建、加密），不重新构建
      - name: Fetch production artifact (from staging run)
        if: ${{ env.FROM_ARTIFACT == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: prod-edgeone
          run-id: ${{ needs.resolve.outputs.artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prod-artifact

      - name: Unpack production artifact
        if: ${{ env.FROM_ARTIFACT == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          bash ops/edgeone-artifact.sh unpack "$RUNNER_TEMP/prod-artifact/prod-edgeone.tgz.enc" nextjs
          echo "· 产物来自 run ${{ needs.resolve.outputs.artifact_run }}（web ${{ needs.resolve.outputs.web_ref }}）"

      # 演练（rehearse_artifact，仅手动 target=staging）：把刚构建好的测试站产物走一遍 promote 那条路——
      # 打包加密、删掉 .edgeone 与 .next、解包，再由下面照常检查、部署。验证产物离开构建目录后照样能部署。
      - name: Rehearse artifact round trip (staging, manual only)
        if: ${{ env.REHEARSE_ARTIFACT == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          bash ops/edgeone-artifact.sh pack nextjs "$RUNNER_TEMP/rehearse.tgz.enc"
          rm -rf nextjs/.edgeone nextjs/.next
          bash ops/edgeone-artifact.sh unpack "$RUNNER_TEMP/rehearse.tgz.enc" nextjs

      - name: Verify EdgeOne build mode
        run: |
          MODE="${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}"
          # W2／CUT2：两站都是全栈产物，客户端 chunk 在 .edgeone/assets 下
          CHUNKS=nextjs/.edgeone/assets/_next/static/chunks/
          if grep -r "\"$MODE\"" "$CHUNKS" > /dev/null 2>&1; then
            echo "✓ EdgeOne build confirmed using $MODE mode"
          else
            echo "❌ EdgeOne build not using $MODE mode!" && exit 1
          fi

      # T1 判据：测试站产物必须 robots 全禁＋noindex＋角标；正式站产物三者皆无。
      - name: Verify staging artifacts (robots / noindex / badge)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        run: |
          # W2：测试站是全栈产物，静态页在 nextjs/.edgeone/assets/
          A=nextjs/.edgeone/assets
          grep -qx 'Disallow: /' $A/robots.txt && echo "✓ robots.txt 全禁" \
            || { echo "❌ robots.txt 未全禁:"; cat $A/robots.txt; exit 1; }
          grep -q 'noindex' $A/index.html && echo "✓ index.html 含 noindex meta" \
            || { echo "❌ index.html 缺 noindex meta"; exit 1; }
          grep -q 'staging-badge' $A/index.html && echo "✓ 测试站角标已渲染" \
            || { echo "❌ 角标未出现"; exit 1; }
          # W2-1：/item/<id> 必须落在云函数路由里，否则部署上去是 404
          grep -q '"\^/item/' nextjs/.edgeone/cloud-functions/ssr-node/config.json && echo "✓ /item/[id] 已由云函数渲染" \
            || { echo "❌ 云函数路由里没有 /item/[id]"; cat nextjs/.edgeone/cloud-functions/ssr-node/config.json; exit 1; }
          test -f nextjs/.edgeone/edge-functions/config.json && echo "✓ 边缘函数（/api/*）已随全栈产物编译" \
            || { echo "❌ 全栈产物里没有 edge-functions"; exit 1; }
          # W2-3：sitemap 索引＋分片进了产物，失效接口在云函数路由里
          # overview#470 P1：数据流程已拆出时 sitemap 走路由代理，产物里没有静态文件，改查路由
          if [ "$SPLIT_DATA" = true ]; then
            # 反向断言：测试站（非演练）不读 staging 数据前缀，读正式站的
            ! grep -rq 'data.kaiyuanguji.com/staging' $A/_next/static/chunks/ || { echo "❌ SPLIT 模式：测试站产物里还有 staging 数据前缀"; exit 1; }
            test ! -e $A/sitemap-index.xml && grep -q '"\^/sitemap-proxy' nextjs/.edgeone/cloud-functions/ssr-node/config.json \
              && echo "✓ sitemap 走路由代理（产物里无静态文件，云函数有 /sitemap-proxy）" \
              || { echo "❌ SPLIT 模式：产物里不该有静态 sitemap，且云函数路由里要有 /sitemap-proxy"; exit 1; }
          else
            test -f $A/sitemap-index.xml && ls $A/sitemaps/*.xml > /dev/null && echo "✓ sitemap 索引＋$(ls $A/sitemaps/*.xml | wc -l) 个分片已进产物" \
              || { echo "❌ 产物里没有 sitemap-index.xml／sitemaps/"; exit 1; }
          fi
          grep -q '"\^/internal/revalidate' nextjs/.edgeone/cloud-functions/ssr-node/config.json && echo "✓ /internal/revalidate 已由云函数处理" \
            || { echo "❌ 云函数路由里没有 /internal/revalidate"; exit 1; }

      # 正式站产物：正式站配置（无 noindex、无角标、robots 允许收录、读正式数据）＋条目页由云函数渲染
      # （原 W2b 双跑构建步骤里的产物校验，转正后单列一步）
      - name: Verify production artifacts (fullstack)
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        # 判据抽到 ops/check-edgeone-artifact.sh（prod-artifact 任务构建时也用同一份）；部署现成产物时同样再查一遍
        run: bash ops/check-edgeone-artifact.sh nextjs "${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}" "${{ needs.resolve.outputs.split == 'true' && 'proxy' || 'static' }}"

      # 闸：产物文件数异常时直接失败，别让部署静默不生效（2026-09-27 h1 数据混进产物、
      # Pages 静默不发布的教训）。全栈产物里多了云函数（opennext 打包的 node_modules，
      # 2026-09-27 本地实测约 2,500 个文件），总数约 2,850；静态部分仍须远低于平台 2 万上限。
      # CUT2 起两站同一道闸。
      - name: Guard EdgeOne bundle file count (fullstack)
        run: |
          N=$(find nextjs/.edgeone -type f | wc -l)
          echo "EdgeOne (fullstack) bundle file count: $N"
          if [ "$N" -gt 5000 ]; then
            echo "❌ 产物 $N 个文件（上限 5000）——数据目录混进来了？按目录统计："
            find nextjs/.edgeone -type f | awk -F/ '{print $3"/"$4}' | sort | uniq -c | sort -rn | head -10
            exit 1
          fi

      # --- 步骤 2：部署 ---
      # 测试站：直接上传型项目 kyg-staging（CLI）。正式站见下一步（kyg-ssr-spike，同一条路）
      - name: Deploy to EdgeOne (staging, direct upload)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        # W2：部署上一步 makers build 出的全栈产物（给了目录就不再自动构建）
        working-directory: nextjs
        run: |
          s=$SECONDS; echo "▶ EdgeOne 部署（测试站）开始 $(date -u +%H:%M:%S) UTC"
          npx -y edgeone@1.6.41 makers deploy .edgeone -n kyg-staging -t "$EDGEONE_API_TOKEN"
          echo "✔ EdgeOne 部署（测试站）用时 $((SECONDS - s)) 秒"

      # overview#341：记下这次测试站用的代码与数据（完整 commit），存成工件。正式站 promote 带 from_run=<本 run>
      # 时据此钉死版本，不再读测试站指针「此刻」的值（指针可能已被后来的部署改写）。
      - name: Write promote manifest (staging)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        env:
          WEB: ${{ needs.resolve.outputs.web_ref }}
          R_PROD: ${{ needs.resolve.outputs.prod_sha }}
          R_TEXT: ${{ needs.resolve.outputs.text_sha }}
        run: |
          # 照常克隆时取克隆下来的 commit；快路上没克隆，就是 resolve 解析出的（快路的判定用的也是它们）
          head_of() { git -C "$1" rev-parse HEAD 2>/dev/null || echo "$2"; }
          mkdir -p "$RUNNER_TEMP/manifest"
          python3 - "$RUNNER_TEMP/manifest/promote-manifest.json" <<PY
          import json, sys
          json.dump({
              'webCommitId': '$WEB',
              'productionCommitId': '$(head_of book-index "$R_PROD")',
              'textCommitId': '$(head_of book-text "$R_TEXT")',
              'runId': '${{ github.run_id }}',
              # overview#470 P1：数据流程已拆出时 manifest 里没有数据 commit；晋升据此只发代码
              'dataSplit': ${{ needs.resolve.outputs.split == 'true' && 'True' || 'False' }},
          }, open(sys.argv[1], 'w'), indent=2)
          PY
          cat "$RUNNER_TEMP/manifest/promote-manifest.json"

      - name: Upload promote manifest (staging)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: promote-manifest
          path: ${{ runner.temp }}/manifest/promote-manifest.json
          retention-days: 3

      # CUT2：正式站＝kyg-ssr-spike（www），与测试站同一条 CLI 直传。不再推 edgeone-release——
      # 旧项目 kaiyuanguji 保留作回滚目标，回滚时在控制台把 www 换绑回去（docs/cutover.md）。
      - name: Deploy to EdgeOne (production, kyg-ssr-spike)
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        working-directory: nextjs
        run: |
          s=$SECONDS; echo "▶ EdgeOne 部署（正式站）开始 $(date -u +%H:%M:%S) UTC"
          npx -y edgeone@1.6.41 makers deploy .edgeone -n kyg-ssr-spike -t "$EDGEONE_API_TOKEN"
          echo "✔ EdgeOne 部署（正式站）用时 $((SECONDS - s)) 秒"

      # 发布记录：kyg-ssr-spike 是直传项目，没有 edgeone-release 那样的发布分支可以翻历史，
      # 「上一个正式版本」（ops/rollback-plan.py）改从 release-log 分支读。每次正式发布在该分支
      # 追加一个空提交（树恒为空，不含任何产物），提交信息带源 commit，格式见 rollback-plan.py 的 RELEASE_RE。
      # 部署已成功，本步失败不拦（只影响回滚时自动推算「上一版」，手填 web_commit 不受影响）。
      - name: Record production release (release-log)
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        continue-on-error: true
        env:
          WEB: ${{ needs.resolve.outputs.web_ref }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EMPTY=$(git hash-object -t tree /dev/null)
          PARENT=''
          if git fetch -q --depth 1 origin release-log 2>/dev/null; then PARENT="-p $(git rev-parse FETCH_HEAD)"; fi
          C=$(git commit-tree "$EMPTY" $PARENT -m "Released to kyg-ssr-spike from @ ${{ github.repository }}@$WEB 🚀 (promote=${PROMOTE:-?}, run ${{ github.run_id }})")
          git push -q origin "$C:refs/heads/release-log"
          echo "· release-log ← ${C:0:12}（web ${WEB:0:12}）"

      # overview#470 P1：代码指针 web.json（正式站在根、测试站在 staging/），部署成功之后写。
      # 过渡期两边都写：latest.json 里的 webCommitId 仍由上面打包／快路那几步写，晋升与回滚计划仍读它；
      # web.json 先落地、被观察一阵，数据流程（data.yml）独立之后才由读者切过来（见 nextjs/scripts/lib/web-pointer.mjs 头注释）。
      # 不拦发布：写失败只是 web.json 暂时落后，下一次部署会再写。
      - name: Write web pointer web.json (overview#470 P1)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          WEB_COMMIT_ID: ${{ needs.resolve.outputs.web_ref }}
        run: |
          cd nextjs
          node scripts/write-web-pointer.mjs

      # promote=code：部署成功之后才把线上 latest.json 的 webCommitId 改成新代码（其余字段沿用线上）。
      # 不 continue-on-error：改不了就让这次 promote 红，别让指针悄悄落后（之后的 promote=data 按它重建代码）。
      - name: Code-only promote — record webCommitId in latest.json (after deploy)
        id: code_only_pointer
        # 数据流程已拆出（SPLIT_DATA）时 latest.json 只归数据流程写，这里不再动它
        if: ${{ env.CODE_ONLY == 'true' && env.SPLIT_DATA != 'true' }}
        # 这时新代码已经部署成功：指针写不了不能再把整个 job 标红（那会跳过清缓存、预热和 verify，告警还会说成"部署失败"）。
        # 所以先重试几次，仍失败就大声警告（错误标注＋摘要里写明怎么补），continue-on-error 让后面的步骤照常跑。
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          WEB_COMMIT_ID: ${{ needs.resolve.outputs.web_ref }}
        run: |
          cd nextjs
          for i in 1 2 3; do
            if node scripts/cos-sync-decision.mjs latest-only; then exit 0; fi
            echo "· 第 $i 次写 latest.json 失败，$((i * 10)) 秒后重试"; sleep $((i * 10))
          done
          echo "::error::新代码已部署，但线上 latest.json 的 webCommitId 没改成功（指针仍是上一版）"
          {
            echo "### ⚠️ 代码已发布，但 latest.json 的 webCommitId 没更新"
            echo "指针还停在上一版：**在补上之前不要发 \`promote=data\`**（它会按指针重建旧代码）。"
            echo "补法：用同一个 \`from_run\` 再派一次 \`promote=code\`（同一份产物，幂等，会重写指针）。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # --- 步骤 3：清除 EdgeOne CDN 缓存 ---
      - name: Purge EdgeOne CDN cache
        if: ${{ env.HAS_EDGEONE_SECRETS == 'true' }}
        env:
          HAS_EDGEONE_SECRETS: ${{ secrets.TENCENT_SECRET_ID != '' }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: |
          python3 -m pip install --user tencentcloud-sdk-python-teo -q
          python3 -c "
          import json, os
          from tencentcloud.common import credential
          from tencentcloud.teo.v20220901 import teo_client, models

          cred = credential.Credential(os.environ['TENCENT_SECRET_ID'], os.environ['TENCENT_SECRET_KEY'])
          client = teo_client.TeoClient(cred, '')

          # ⚠️ EdgeOne 这个 zone 注册的加速域名是裸域名 kaiyuanguji.com，
          # www.kaiyuanguji.com 没有单独注册（它的流量靠 DNS 指到同一套边缘节点，
          # 但 purge_url 按注册域名精确匹配）。2026-08-30~2026-09-02 期间一直用
          # www.kaiyuanguji.com 做 purge_url 目标，EdgeOne 返回 FailedList
          # domain not found，purge 从未真正生效过，网站页面只能靠 CDN 节点 TTL
          # 自然过期——查 DescribeAccelerationDomains 确认注册域名列表后改为
          # purge_host kaiyuanguji.com（整站，含 www 在内的所有子路径/子域名都会被清）。
          # 注意：本段是 bash 双引号包裹的 python3 -c 内联脚本，注释里绝不能出现
          # 半角双引号——曾因写入 FailedList 这个词的 JSON 字面量形式（半角双引号
          # 包住）导致 shell 提前截断整段字符串，后半段 Python 代码整体消失不执行，
          # 且 step 仍然 exit 0（截断后剩下的部分恰好是合法的空程序，不报错）。
          # data.kaiyuanguji.com/latest.json 单独 purge_url（新版本指针，让浏览器
          # 拉到新 commit）；不 purge_host data.kaiyuanguji.com 整站——那 318MB
          # 缓存白丢，回源费贵。
          # CUT2：www 已换绑到全栈项目 kyg-ssr-spike，同测试站一样是 Pages 自定义域名，
          # purge_host kaiyuanguji.com 清不到 www 的页面（只清裸域那条 301）；www 的静态页随新部署
          # 更新，条目页靠下面的按需失效。数据指针仍靠这里的 purge_url。
          # T1：按目标清——测试站清 staging.kaiyuanguji.com 与 staging/latest.json；
          # 正式站照旧。purge_host 对「未开站点加速」方式绑定的自定义域名是否生效
          # 待网站总管核实（31 卡 §B.8.6），本步骤先按同一逻辑发出，不影响正式站。
          staging = os.environ.get('DEPLOY_TARGET') == 'staging'

          req_pointer = models.CreatePurgeTaskRequest()
          req_pointer.ZoneId = os.environ['EDGEONE_ZONE_ID']
          req_pointer.Type = 'purge_url'
          # 09-27：h1 版本指针也要清——实测节点把 h1/manifest-root.json 缓存了约 18.7 小时
          # （源站 max-age=120 被无视）；另在控制台规则引擎给它们配节点不缓存
          pfx = 'https://data.kaiyuanguji.com/' + ('staging/' if staging else '')
          req_pointer.Targets = [pfx + 'latest.json', pfx + 'web.json', pfx + 'h1/manifest-root.json', pfx + 'h1/text-manifest-root.json']
          resp_pointer = client.CreatePurgeTask(req_pointer)
          print('✅ latest.json purged:', resp_pointer.to_json_string())

          # 测试站不清整站：staging.kaiyuanguji.com 是 Pages 项目自定义域名，不是本 zone 的
          # 加速域名，purge_host 返回 DomainNotFound（09-27 首跑实测）；CLI 直接上传后
          # Pages 本身就发新版，只清数据指针即可。
          if staging:
              print('· 测试站跳过 purge_host（Pages 自定义域名不在 zone 加速域名内）')
          else:
              req_site = models.CreatePurgeTaskRequest()
              req_site.ZoneId = os.environ['EDGEONE_ZONE_ID']
              req_site.Type = 'purge_host'
              req_site.Targets = ['kaiyuanguji.com']
              resp_site = client.CreatePurgeTask(req_site)
              print('✅ EdgeOne cache purged:', resp_site.to_json_string())
          "

      # --- W2-3：条目页按改动失效、实测（31 卡 §A.6）---
      # overview#293：原来最后还有一步「预热」（并发 4 请求 2000 个条目页，约 19 分钟，verify 要等它跑完才开始），
      # 用户 09-30 定「完全没必要预热」，已删。条目页失效后第一次访问是冷渲染，之后走 CDN 缓存。
      # 测试站与 www（CUT2 起）都是 Pages 自定义域名，不在 zone 加速域名里，purge_url 清不到（T1 实测）；
      # 改走 Next 的按需失效（EdgeOne 全栈项目把它接到了自家 CDN）。
      # CUT2：正式站同一套步骤，对象是 www（原 W2b 双跑时打的是 ssr-test）。
      # 这几步都不拦发布：失效没生效，最坏是条目页按 s-maxage（1 小时）自然过期。
      # 但「实测」一步失败会在 job 摘要里标 ✗——首跑几次都绿之后，改成拦发布（去掉 continue-on-error）。
      - name: Compute changed items (W2-3)
        id: item_changes
        # 快路上数据没变，也没有本地 h1 产物可比——没有要失效的条目
        if: ${{ env.DATA_FAST != 'true' }}
        continue-on-error: true
        working-directory: nextjs
        env:
          ITEM_DATA_BASE: ${{ env.DEPLOY_TARGET == 'staging' && 'https://data.kaiyuanguji.com/staging' || 'https://data.kaiyuanguji.com' }}
        run: node scripts/item-changes.mjs

      - name: Revalidate changed item pages (W2-3)
        if: ${{ steps.item_changes.outcome == 'success' }}
        id: item_revalidate
        continue-on-error: true
        working-directory: nextjs
        env:
          ITEM_SITE: ${{ env.DEPLOY_TARGET == 'staging' && 'https://staging.kaiyuanguji.com' || 'https://www.kaiyuanguji.com' }}
        run: node scripts/item-revalidate.mjs

      - name: Verify item cache refresh (W2-3)
        if: ${{ steps.item_revalidate.outcome == 'success' }}
        continue-on-error: true
        working-directory: nextjs
        env:
          ITEM_SITE: ${{ env.DEPLOY_TARGET == 'staging' && 'https://staging.kaiyuanguji.com' || 'https://www.kaiyuanguji.com' }}
        run: node scripts/item-cache-verify.mjs

      # overview#322 方案 A：正式站部署、清缓存后预热热门阅读页（featured 全部＋各节点第 1 页），
      # 让新实例热起来、把这批页写进 ISR 缓存，读者和随后的冒烟 verify 都不撞冷启动。结果不计成败。
      # 测试站那一支在单独的 warm-staging 任务里，与 verify 并行（与它等 CDN 的时间重叠）。
      - name: Warm hot reading pages (production, overview#322)
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          TARGET: https://www.kaiyuanguji.com
          DATA_BASE: https://data.kaiyuanguji.com
        # 部署的是早于本脚本的代码（promote=data、回滚）时没有它，跳过
        run: '[ -f ops/warm-read-pages.mjs ] && node ops/warm-read-pages.mjs || echo "· 这一版代码没有 ops/warm-read-pages.mjs，跳过预热"'

  # overview#322 方案 A（测试站）：部署后预热热门阅读页，与 verify 并行，不拦任何东西。
  # 正式站的预热在 build 的最后一步（要排在冒烟 verify 前面）。
  warm-staging:
    needs: [resolve, build]
    if: ${{ needs.build.result == 'success' && needs.resolve.outputs.target == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.web_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Warm hot reading pages (staging, overview#322)
        env:
          TARGET: https://staging.kaiyuanguji.com
          DATA_BASE: ${{ needs.resolve.outputs.split == 'true' && 'https://data.kaiyuanguji.com' || 'https://data.kaiyuanguji.com/staging' }}
        # 部署的是早于本脚本的代码（promote=data、回滚）时没有它，跳过
        run: '[ -f ops/warm-read-pages.mjs ] && node ops/warm-read-pages.mjs || echo "· 这一版代码没有 ops/warm-read-pages.mjs，跳过预热"'

  # overview#341：正式站产物——与测试站同一个 run、同一版代码（web_ref）、同一份数据（resolve 解析出的三仓 commit），
  # 与 build 并行构建，加密存成本 run 的工件 prod-edgeone（3 天）。测试站 verify 全绿后，正式站那次 promote
  # （from_run=本 run）直接部署它，不再重拉数据、重打包、重构建。
  # 为什么不能直接把测试站产物发到正式站：NEXT_PUBLIC_*（数据地址、站点地址、角标、noindex）和项目变量在构建期烘进产物，
  # 两站的产物本来就不一样（见 build 的两支构建）。所以是「同一次构建流程里多出一份正式站配置的产物」。
  # 只有 push 才建（自动 promote 只对 push）；手动 target=staging 勾 rehearse_artifact 时也建，用来演练。
  # 失败不影响测试站那一支（verify 不依赖本任务），只是这次不会自动 promote（auto-promote 依赖本任务成功）。
  prod-artifact:
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'staging' && (github.event_name == 'push' || inputs.rehearse_artifact == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_TARGET: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.web_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      # 条目 sitemap（<loc> 指向 www）要读打包好的 entry/*.json。数据没变时用缓存（键同 build：站点＋三仓 commit＋打包脚本指纹），
      # 缓存没有才克隆、打包——那样多花三四分钟，但与测试站那一支并行，测试站 verify 一般比它晚结束，不拖总时间。
      - name: Bundle fingerprint
        id: fp
        working-directory: nextjs
        run: |
          FP=$(node -e "import('./scripts/lib/cos-sync-decision.mjs').then((m) => console.log(m.computeBundleFingerprint(process.env.GITHUB_WORKSPACE)))")
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Restore item sitemaps (www)
        id: sitemap_cache
        if: ${{ needs.resolve.outputs.split != 'true' && needs.resolve.outputs.prod_sha != '' && needs.resolve.outputs.text_sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/item-sitemaps
          key: item-sitemaps-v1-production-${{ needs.resolve.outputs.prod_sha }}-${{ needs.resolve.outputs.text_sha }}-${{ steps.fp.outputs.fingerprint }}

      - name: Restore git cache — book-index
        id: gc_index
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ needs.resolve.outputs.prod_sha || github.run_id }}
          restore-keys: |
            git-cache-v1-book-index-

      - name: Restore git cache — book-text
        id: gc_text
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ needs.resolve.outputs.text_sha || github.run_id }}
          restore-keys: |
            git-cache-v1-book-text-

      - name: Clone, bundle and generate item sitemaps (cache miss)
        id: gen
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' }}
        env:
          KYG_DATA_ROOT: ${{ runner.temp }}/kyg-data
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
          BOOK_TEXT_DIR: ${{ github.workspace }}/book-text
          SITEMAP_SITE: https://www.kaiyuanguji.com
          SITEMAP_OUT_DIR: ${{ runner.temp }}/item-sitemaps
        run: |
          # overview#470 P1：同 build 任务的克隆缓存
          # --- clone_cached:begin（overview#470 P1。正本是 ops/clone-cached.sh；deploy.yml 的 build、prod-artifact 内联两份同文——build 检出的可能是更早的 web 提交，那一版没有这个文件——ops/tests/test_clone_cache.py 守着）
          set -o pipefail
          GIT_BASE_URL="${GIT_BASE_URL:-https://github.com/open-guji}"
          GIT_CACHE_MAX_MB="${GIT_CACHE_MAX_MB:-4096}"
          # git 的 --progress 输出带回车、刷得很密：只留每 15 秒一行（和结束那行）
          git_progress() {
            local last=-99 line
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [ $((SECONDS - last)) -ge 15 ] || [[ "$line" == *", done"* ]]; then echo "    $line"; last=$SECONDS; fi
            done
          }
          # clone_cached <仓名> <目录> <ref>：目录里若有从 actions/cache 取回的 .git，就在已有对象上只拉新增的；没有（或太大）就全量浅拉。
          # 同一个 commit 缓存里已经有的，不再 fetch。每个仓打印开始、结束、用时和 .git 大小。
          clone_cached() {
            local repo="$1" dest="$2" ref="$3" t0=$SECONDS mb had_cache="" neg=""
            echo "▶ 克隆 $repo @ ${ref:0:12}"
            if [ -d "$dest/.git" ]; then
              mb=$(du -sm "$dest/.git" | cut -f1)
              if [ "$mb" -gt "$GIT_CACHE_MAX_MB" ]; then
                echo "· 缓存的 .git 已 ${mb} MB，超过 ${GIT_CACHE_MAX_MB} MB 上限，丢弃后全量浅拉"; rm -rf "$dest/.git"
              else
                echo "· 用缓存的 .git（${mb} MB）：只拉新增对象"; had_cache=1
              fi
            else
              echo "· 没有缓存：全量浅拉"
            fi
            [ -d "$dest/.git" ] || git init -q "$dest"
            if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$' && git -C "$dest" cat-file -e "${ref}^{commit}" 2>/dev/null; then
              echo "· 缓存里已有这个 commit，不再 fetch"
              git -C "$dest" checkout -q -f "$ref"
            else
              # 浅拉（--depth 1）默认不拿本地已有的对象去和服务端对账，缓存再大也会把整棵树重传一遍（2026-10-07 实测 book-text：
              # 缓存是上一个 commit，仍收 218048 个对象、1.75 GiB、229 秒，和全量浅拉一样）。显式给对账起点 --negotiation-tip=HEAD，
              # 服务端才只发新增的（同一对 commit 的 book-index 实测 203915 个对象／106 MiB／26 秒 → 70252 个／12.7 MiB／6 秒）。
              if [ -n "$had_cache" ] && git -C "$dest" rev-parse -q --verify HEAD >/dev/null 2>&1; then neg="--negotiation-tip=HEAD"; fi
              git -C "$dest" fetch --depth 1 $neg --progress "$GIT_BASE_URL/$repo.git" "$ref" 2>&1 | tr '\r' '\n' | git_progress
              git -C "$dest" checkout -q -f FETCH_HEAD
              # 增量拉完 .git 超过上限：就地重来一次全量浅拉，让随后存进缓存的永远是不大的那份（否则超大的条目会一直被恢复）
              mb=$(du -sm "$dest/.git" | cut -f1)
              if [ "$mb" -gt "$GIT_CACHE_MAX_MB" ] && [ -n "${had_cache:-}" ]; then
                echo "· 增量后 .git 已 ${mb} MB，超过 ${GIT_CACHE_MAX_MB} MB 上限：重来一次全量浅拉，避免把超大的缓存存下去"
                rm -rf "$dest/.git"; git init -q "$dest"
                git -C "$dest" fetch --depth 1 --progress "$GIT_BASE_URL/$repo.git" "$ref" 2>&1 | tr '\r' '\n' | git_progress
                git -C "$dest" checkout -q -f FETCH_HEAD
              fi
            fi
            echo "✔ $repo 用时 $((SECONDS - t0)) 秒，.git $(du -sh "$dest/.git" | cut -f1)，commit $(git -C "$dest" rev-parse --short=12 HEAD)"
          }
          # --- clone_cached:end
          # 与 build 取同一版（resolve 解析出的完整 commit；解析不了时同 build 退回 ref）
          clone_cached book-index book-index "${{ needs.resolve.outputs.prod_sha || needs.resolve.outputs.prod_ref }}"
          clone_cached book-text book-text "${{ needs.resolve.outputs.text_sha || needs.resolve.outputs.text_ref }}"
          echo "index_sha=$(git -C book-index rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "text_sha=$(git -C book-text rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # schema-v2（overview#458）：同 build job，旧 schema 的仓没有该脚本就跳过
          if [ -f book-index/build/build_derived.py ]; then
            export BOOK_INDEX_DERIVED_DIR="$RUNNER_TEMP/book-index-derived"
            s=$SECONDS; echo "▶ build_derived 开始 $(date -u +%H:%M:%S) UTC"
            (cd book-index && python3 build/build_derived.py --out "$BOOK_INDEX_DERIVED_DIR")
            echo "✔ build_derived 用时 $((SECONDS - s)) 秒"
          fi
          cd nextjs
          s=$SECONDS; echo "▶ 打包数据开始 $(date -u +%H:%M:%S) UTC"
          node scripts/bundle-data.mjs
          echo "✔ 打包数据用时 $((SECONDS - s)) 秒"
          rm -rf "$SITEMAP_OUT_DIR"
          node scripts/gen-sitemaps.mjs

      - name: Save git cache — book-index
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' && steps.gc_index.outputs.cache-hit != 'true' && steps.gen.outputs.index_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-index/.git
          key: git-cache-v1-book-index-${{ steps.gen.outputs.index_sha }}

      - name: Save git cache — book-text
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' && steps.gc_text.outputs.cache-hit != 'true' && steps.gen.outputs.text_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: book-text/.git
          key: git-cache-v1-book-text-${{ steps.gen.outputs.text_sha }}

      - name: Save item sitemaps cache (www)
        if: ${{ needs.resolve.outputs.split != 'true' && steps.sitemap_cache.outputs.cache-hit != 'true' && needs.resolve.outputs.prod_sha != '' && needs.resolve.outputs.text_sha != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/item-sitemaps
          key: item-sitemaps-v1-production-${{ needs.resolve.outputs.prod_sha }}-${{ needs.resolve.outputs.text_sha }}-${{ steps.fp.outputs.fingerprint }}

      - name: Place item sitemaps
        if: ${{ needs.resolve.outputs.split != 'true' }}
        working-directory: nextjs
        run: |
          OUT="$RUNNER_TEMP/item-sitemaps"
          test -f "$OUT/sitemap-index.xml" && ls "$OUT"/sitemaps/*.xml > /dev/null \
            || { echo "❌ 条目 sitemap 不全"; ls -la "$OUT"; exit 1; }
          rm -rf public/sitemaps public/sitemap-index.xml
          cp -r "$OUT/sitemaps" public/sitemaps
          cp "$OUT/sitemap-index.xml" public/sitemap-index.xml

      - name: Derive revalidate secret (W2-3)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          S=$(printf 'kyg-item-revalidate' | openssl dgst -sha256 -hmac "$EDGEONE_API_TOKEN" | awk '{print $NF}')
          echo "::add-mask::$S"
          echo "KYG_REVALIDATE_SECRET=$S" >> "$GITHUB_ENV"

      # 与 build 的正式站构建步骤是同一份（env 与命令一致，ops/tests/test_deploy_workflow.py 守着）
      - name: Build for EdgeOne (production, fullstack → kyg-ssr-spike)
        env:
          # E1：只用来读 kyg-ssr-spike 的项目环境变量；不进构建子进程
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          KYG_RENDER_MODE: fullstack
          # /api/version 的 target：全栈＋正式站配置按默认会记成 ssr-test（双跑期口径），这里显式写 production
          KYG_DEPLOY_TARGET: production
          NEXT_PUBLIC_MODE: ''
          # 数据源 = cos：浏览器与云函数都从 data.kaiyuanguji.com 拉，靠 latest.json 解析版本
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
          NEXT_PUBLIC_COS_BASE: https://data.kaiyuanguji.com
          # overview#470 P1：数据流程已拆出时 sitemap 走路由代理（构建时开关；build 与 prod-artifact 两份必须一致）
          NEXT_PUBLIC_SITEMAP_PROXY: ${{ needs.resolve.outputs.split == 'true' && '1' || '' }}
          NEXT_PUBLIC_SITE_ENV: ''
          NEXT_PUBLIC_SITE_URL: https://www.kaiyuanguji.com
          # Hybrid 搜索：L1 = Meilisearch on 上海云（EdgeOne 反代）
          # L1 失败时自动 fallback 到 worker 索引（L2，COS 或 /data/search）
          NEXT_PUBLIC_MEILI_URL: https://api.kaiyuanguji.com
          # 兜底值是「公开只读搜索 key」（本来就随 JS 发给每个浏览器，非机密；
          # 绝不能在这里放 master key）。secret 缺失曾导致构建时 key 为空、
          # 线上搜索全 401（2026-08 事故）。轮换 key 后请同步更新这里和 secret。
          NEXT_PUBLIC_MEILI_KEY: ${{ secrets.MEILI_SEARCH_KEY || '1b0b438f7eadd34e1a6b53c76d63bd3614822d3ec9856251c9340a78456c5465' }}
          # 访问统计站点 ID（G-24）：仓库 Settings → Variables 里配 BAIDU_TONGJI_ID / GA_ID。
          # 非机密（本来就写在页面里）；没配则不加载统计脚本。
          # 双跑期 ssr-test 不带（免得与 www 重复计数）；现在它就是 www，照旧带上
          NEXT_PUBLIC_BAIDU_TONGJI_ID: ${{ vars.BAIDU_TONGJI_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_BASE_PATH: ''
        run: |
          if [ "$NEXT_PUBLIC_DATA_SOURCE" != "cos" ]; then
            echo "❌ 全栈构建只支持 cos 数据源（COS secrets 缺失）：函数按请求从 COS 取条目，没有降级路径"
            exit 1
          fi
          # 条目页按需失效接口的密钥 KYG_REVALIDATE_SECRET 已由上面「Derive revalidate secret」写进环境
          cd nextjs
          # 条目 sitemap 分片（W2-3）已由上面「Item sitemaps」一步放进 public/（<loc> 指向 www），这里不能删
          rm -rf .next out .edgeone edge-functions
          # 边缘函数（/api/*、/oauth/*）随全栈产物一起编译：CLI 只认项目根下的 edge-functions/
          cp -r ../edge-functions ./edge-functions
          # E1：带 kyg-ssr-spike 的项目变量构建并查产物（脚本内含 3 次重试，只重试构建本身）
          s=$SECONDS; echo "▶ EdgeOne 全栈构建开始 $(date -u +%H:%M:%S) UTC"
          python3 ../ops/edgeone-fullstack-build.py -n kyg-ssr-spike --forbid-env EDGEONE_API_TOKEN \
            --require AUTH_JWT_SECRET --require ERROR_VIEW_TOKEN \
            -- npx -y edgeone@1.6.41 makers build
          echo "✔ EdgeOne 全栈构建用时 $((SECONDS - s)) 秒"
          du -sh .edgeone | xargs echo "EdgeOne (fullstack) bundle size:"
          find .edgeone -type f | wc -l | xargs echo "EdgeOne (fullstack) file count:"

      - name: Verify production artifacts (fullstack)
        run: bash ops/check-edgeone-artifact.sh nextjs "${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}" "${{ needs.resolve.outputs.split == 'true' && 'proxy' || 'static' }}"

      - name: Pack production artifact (encrypted)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/prod-artifact"
          bash ops/edgeone-artifact.sh pack nextjs "$RUNNER_TEMP/prod-artifact/prod-edgeone.tgz.enc"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-edgeone
          path: |
            ${{ runner.temp }}/prod-artifact/prod-edgeone.tgz.enc
            ${{ runner.temp }}/prod-artifact/prod-edgeone.tgz.enc.sha256
          retention-days: 3
          # 已是 gzip＋密文，再压缩没用
          compression-level: 0

  # --- 部署后验收：确认功能没坏、数据真的上线了 ---
  #
  # 老 smoke 只看网络层（字节数/404/pageerror），2026-09-02~03 那批故障
  # （整理本 tab 消失、"0 部书"、书名不渲染）它一个都发现不了——那些请求全是
  # 200。验收断言的是「内容」。
  # overview#293：验收的步骤抽成了可复用工作流 verify.yml（workflow_call），本处与它自己的手动入口
  # （workflow_dispatch，只重跑验收，不构建、不部署、不 promote）共用同一份，避免两份漂移。
  verify:
    needs: [resolve, build]
    # 部署失败就没必要验收了；但 build 被 check 跳过时（数据无变化）也不必跑
    if: needs.build.result == 'success'
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      # e2e 必须和被测站点是同一版代码：promote=data 时正式站代码可能比 main 旧，
      # 用 main 的 e2e 去测会命中「线上前端不比本 commit 要求的旧」而误报红。
      ref: ${{ needs.resolve.outputs.web_ref }}
      # 刚部署完：CDN purge 在边缘节点传播需要时间，直接跑会拿到旧产物
      wait_cdn: true
      # overview#470 P1：数据流程已拆出时测试站读正式站数据前缀，验收的 DATA_BASE 跟着指过去
      data_from_prod: ${{ needs.resolve.outputs.split == 'true' }}

  # T1：数据自动上正式站——用户批的是「数据自动推正式站」，默认开；
  # 仓库变量 AUTO_PROMOTE_DATA 只有显式设成 'false' 才关（不用配这个变量
  # 就是默认开，符合用户预期，也符合网站总管已告诉用户「不用配」的口径）。
  # 只在 mode=staging（真的经过了测试站且 e2e 已验）且触发是数据（dispatch／
  # 定时）时生效——mode=promote 不该再自己触发下一轮 promote。走 data 模式：正式站代码不动，只换数据——所以
  # 没 promote 的代码不会被数据发布夹带上线。
  # overview#293 前它是 verify 任务的最后一步，验收抽成可复用工作流后单列一个任务，条件不变
  # （needs.verify.result == 'success' 即原来的 success()）。
  auto-promote:
    needs: [resolve, verify]
    # overview#470 P1：数据流程已拆出时数据上线归 data.yml，这里不再派 promote=data
    if: ${{ needs.verify.result == 'success' && needs.resolve.outputs.split != 'true' && needs.resolve.outputs.mode == 'staging' && vars.AUTO_PROMOTE_DATA != 'false' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    steps:
      - name: Auto-promote data to production
        env:
          GH_TOKEN: ${{ github.token }}
          # 这几个任务不 checkout，gh 认不出当前仓，要显式给（否则 failed to run git: not a git repository）
          GH_REPO: ${{ github.repository }}
        run: |
          # promote=data 读的是正式站现有 latest.json 的 webCommitId（T1 之前
          # 生成的正式站 latest.json 没有这个字段，得先手动 promote=code+data
          # 一次才会有）。缺失时是「正式站还没做过第一次 promote」，不是故障，
          # 打一行警告跳过即可，不能让 workflow 报红；手动 promote 仍按 resolve
          # job 现在的逻辑报错（那边是人在等结果，缺字段就该让人知道）。
          WEB=$(curl -sf https://data.kaiyuanguji.com/latest.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('webCommitId',''))" 2>/dev/null || echo '')
          if [ -z "$WEB" ]; then
            echo "⚠️ 正式站 latest.json 还没有 webCommitId（尚未做过一次 promote=code+data），自动 promote 跳过。请先手动 workflow_dispatch target=production promote=code+data 一次。"
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f target=production -f promote=data

  # overview#341（10-01 用户定「测试站通过就自动上正式站」）：push 的这次 run 测试站 verify 全绿、
  # 且 prod-artifact（同一版代码、同一份数据构建的正式站产物）成功，就派一次正式站 promote，
  # from_run 钉死本 run——正式站那次只核对、下载、部署这份产物，不重新构建（见 resolve 的 from_run 核对）。
  # 开关：仓库变量 AUTO_PROMOTE_CODE 显式设成 'false' 才关（回滚期间必须先关，见 docs/runbook.md §8）。
  # 只在 push 上：定时／手动的测试站部署不自动带代码上正式站（数据另由上面的 auto-promote 走 promote=data）。
  auto-promote-code:
    needs: [resolve, verify, prod-artifact]
    if: ${{ github.event_name == 'push' && needs.resolve.outputs.mode == 'staging' && needs.verify.result == 'success' && needs.prod-artifact.result == 'success' && vars.AUTO_PROMOTE_CODE != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Auto-promote code only to production (from this run)
        env:
          GH_TOKEN: ${{ github.token }}
          # 这几个任务不 checkout，gh 认不出当前仓，要显式给（否则 failed to run git: not a git repository）
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          # main 已经有更新的 commit：那次 push 的 run 会自己验、自己 promote，这里不抢先把旧版发上去。
          # （push 组 cancel-in-progress 一般已把本 run 取消；这一道防的是新 push 落在本 run verify 刚结束之后。）
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha 2>/dev/null || echo '')
          if [ -n "$HEAD" ] && [ "$HEAD" != "$RUN_SHA" ]; then
            echo "⏭️ main 已前进到 $HEAD（本 run 是 $RUN_SHA），交给那次 push 的 run 去 promote，这里跳过。"
            echo "⏭️ main 已有更新的 commit，本次不自动 promote（由更新那次的 run 负责）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f target=production -f promote=code -f from_run="$GITHUB_RUN_ID"
          echo "🚀 已派正式站 promote：code（只发代码，数据不动），from_run=$GITHUB_RUN_ID（commit $RUN_SHA）" >> "$GITHUB_STEP_SUMMARY"

  # overview#341：正式站 promote（自动或手动）的发布或验收失败 → 在本仓开一张告警 issue（已有未关的就续一条评论），
  # 写清哪次 run、哪一步、怎么回滚。只告警，不自动回滚：要不要回滚由人看了再定（runbook §8）。
  alert-production:
    needs: [resolve, build, verify]
    if: ${{ always() && needs.resolve.outputs.mode == 'promote' && (needs.build.result == 'failure' || needs.verify.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update production alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          # 这几个任务不 checkout，gh 认不出当前仓，要显式给（否则 failed to run git: not a git repository）
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ needs.build.result }}
          VERIFY: ${{ needs.verify.result }}
          WEB_REF: ${{ needs.resolve.outputs.web_ref }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$BUILD" = "failure" ]; then
            WHAT="**部署失败**（build：$BUILD）——正式站多半还是上一版，读者不受影响，但这次没发上去。"
          else
            WHAT="**已部署、但正式站验收失败**（verify：$VERIFY）——新版已在线上，请尽快看是不是读者可见的回归。"
          fi
          BODY=$(cat <<MD
          正式站 promote 出错：$WHAT

          - run：$RUN_URL
          - 代码：\`$WEB_REF\`${FROM_RUN:+；来自测试站 run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN}

          **先止血**：仓库变量 \`AUTO_PROMOTE_CODE\` 设成 \`false\`（停掉 push 后自动上正式站；数据的 \`AUTO_PROMOTE_DATA\` 视情况也设 \`false\`）。

          **回滚**（docs/runbook.md §8）：
          1. 首选 Actions → Rollback：\`target=production\`、\`dry_run\` 先跑看计划，再按 start → promote → check 三段执行；
          2. 读者正受影响、等不了约 20 分钟：EdgeOne 控制台 → Pages → kyg-ssr-spike → 部署记录，重新发布上一次成功的生产部署；
          3. 修好、正式站恢复后，把上面的变量改回（删掉或设成 \`true\`），再关本 issue。
          MD
          )
          BODY=$(printf '%s\n' "$BODY" | sed 's/^          //')
          gh label create deploy-alert --color B60205 --description '正式站发布／验收失败告警（deploy.yml alert-production）' 2>/dev/null || true
          N=$(gh issue list --label deploy-alert --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || echo '')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
            echo "已在告警 issue #$N 续报" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --label deploy-alert --title "正式站发布告警：$(date -u +%m-%d\ %H:%MZ) promote 出错" --body "$BODY"
            echo "已开告警 issue" >> "$GITHUB_STEP_SUMMARY"
          fi
