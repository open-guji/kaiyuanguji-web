name: Deploy to EdgeOne
# 显示名原为「Deploy to GitHub Pages」——2026-05 起早已不部署 GitHub Pages，
# 产物推到 edgeone-release 分支由 EdgeOne Pages 托管。2026-09-06 改名以免误导新人。

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ data-updated ]
  # 手动触发（Actions 页面 Run workflow 按钮 / API）
  # T1（2026-09-27）：target=staging 重建测试站（默认）；target=production 是
  # 人手动 promote——把测试站验过的版本（或仅数据）打到正式站。
  workflow_dispatch:
    inputs:
      target:
        description: 'staging = 重建测试站；production = 把测试站验过的版本手动 promote 到正式站'
        type: choice
        options: [staging, production]
        default: staging
      promote:
        description: '仅 target=production 有效。code+data = 测试站的代码与数据一起上正式站；data = 正式站代码不动，只换数据'
        type: choice
        options: [code+data, data]
        default: code+data
  # 每日定时兜底：book-index-draft 的 notify-web webhook 依赖跨仓 PAT
  # （REPO_DISPATCH_TOKEN），换账号后曾长期 Bad credentials 导致数据
  # 5 天没上线（2026-08 事故）。定时任务不依赖任何跨仓凭证，数据没
  # 变化时由 check job 提前跳过，不浪费构建。UTC 20:30 = 北京 04:30。
  schedule:
    - cron: '30 20 * * *'

permissions:
  contents: write
  actions: write   # T1：数据自动 promote 时由 verify job 触发本 workflow（workflow_dispatch）

# 同一时间只允许一个部署在跑；连续 push 时取消旧的排队任务，
# 避免两个 job 争抢 edgeone-release 分支导致部署乱序。
# T1：测试站与正式站各排各的队，互不阻塞。
concurrency:
  group: deploy-edgeone-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  # 定时触发时先比对数据仓 HEAD 与线上（正式站）latest.json，没变化就跳过整个构建。
  # push / dispatch / 手动触发一律直接部署。
  # 注：这里的比对口径不随 T1 改变——仍然只问「正式站」是否已是最新数据，
  # 测试站配置齐不齐、这次要不要先落测试站，交给 resolve job 决定。
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
    steps:
      - name: Compare data repo HEADs with deployed latest.json
        id: compare
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "· 非定时触发，直接部署"
            exit 0
          fi
          LIVE=$(curl -sf --max-time 30 https://data.kaiyuanguji.com/latest.json || echo '{}')
          LIVE_DRAFT=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('fullCommitId',''))" || echo '')
          LIVE_PROD=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('productionCommitId',''))" || echo '')
          LIVE_TEXT=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('textCommitId',''))" || echo '')
          HEAD_DRAFT=$(git ls-remote https://github.com/open-guji/book-index-draft.git refs/heads/main | cut -f1)
          HEAD_PROD=$(git ls-remote https://github.com/open-guji/book-index.git refs/heads/main | cut -f1)
          HEAD_TEXT=$(git ls-remote https://github.com/open-guji/book-text.git refs/heads/main | cut -f1)
          echo "draft:      live=$LIVE_DRAFT head=$HEAD_DRAFT"
          echo "production: live=$LIVE_PROD head=$HEAD_PROD"
          echo "book-text:  live=$LIVE_TEXT head=$HEAD_TEXT"
          # 线上 latest.json 缺字段（旧版产物）或比对不上 → 部署
          # 三仓皆须比对得上方可跳过。少比一项即：该仓单独有改动时被判「无变化」，
          # 其更新永远上不了线（2026-08-26 加 book-text 一项）。
          if [ -n "$HEAD_DRAFT" ] && [ "$LIVE_DRAFT" = "$HEAD_DRAFT" ] \
             && [ -n "$HEAD_PROD" ] && [ "$LIVE_PROD" = "$HEAD_PROD" ] \
             && [ -n "$HEAD_TEXT" ] && [ "$LIVE_TEXT" = "$HEAD_TEXT" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "· 数据无变化，跳过部署"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "· 数据有更新（或无法确认），执行部署"
          fi

  # T1：定这次发往哪个站、用哪一版代码、哪一版数据。三种 mode——
  #   staging ：测试站配置齐、且不是手动 promote。代码=触发的 commit，数据=三仓 HEAD
  #   fallback：EDGEONE_API_TOKEN 缺（测试站没配好）。整段跳过测试站，
  #             代码/数据取法与 T1 改造前完全一致，直接部署正式站——不许被测试站配置卡住
  #   promote ：workflow_dispatch target=production，人手动按的。
  #             数据=测试站 staging/latest.json 里记下的三仓 commit（钉死，不取 HEAD）；
  #             代码 = code+data 时取测试站记下的 webCommitId，data 时取正式站现有 webCommitId
  resolve:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_deploy == 'true' }}
    outputs:
      target: ${{ steps.r.outputs.target }}
      mode: ${{ steps.r.outputs.mode }}
      web_ref: ${{ steps.r.outputs.web_ref }}
      draft_ref: ${{ steps.r.outputs.draft_ref }}
      prod_ref: ${{ steps.r.outputs.prod_ref }}
      text_ref: ${{ steps.r.outputs.text_ref }}
    steps:
      - id: r
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          REQ="${{ inputs.target || 'staging' }}"

          if [ "$REQ" = "production" ]; then
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "target=production" >> "$GITHUB_OUTPUT"
            S=$(curl -sf https://data.kaiyuanguji.com/staging/latest.json)
            P=$(curl -sf https://data.kaiyuanguji.com/latest.json || echo '{}')
            get() { echo "$1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('$2',''))"; }
            if [ "${{ inputs.promote }}" = data ]; then WEB=$(get "$P" webCommitId); else WEB=$(get "$S" webCommitId); fi
            if [ -z "$WEB" ]; then
              echo "❌ 指针里没有 webCommitId（首次 promote 请用 code+data，且需先有一次成功的测试站部署）"
              exit 1
            fi
            echo "web_ref=$WEB" >> "$GITHUB_OUTPUT"
            echo "draft_ref=$(get "$S" fullCommitId)" >> "$GITHUB_OUTPUT"
            echo "prod_ref=$(get "$S" productionCommitId)" >> "$GITHUB_OUTPUT"
            echo "text_ref=$(get "$S" textCommitId)" >> "$GITHUB_OUTPUT"
            echo "· promote(${{ inputs.promote }})：web=$WEB 数据=测试站所记三仓 commit"
            exit 0
          fi

          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "web_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            for k in draft_ref prod_ref text_ref; do echo "$k=main" >> "$GITHUB_OUTPUT"; done
            echo "· EDGEONE_API_TOKEN 未配置：测试站整段跳过，正式站照旧直接发布（与 T1 改造前行为一致）"
            exit 0
          fi

          echo "mode=staging" >> "$GITHUB_OUTPUT"
          echo "target=staging" >> "$GITHUB_OUTPUT"
          echo "web_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          for k in draft_ref prod_ref text_ref; do echo "$k=main" >> "$GITHUB_OUTPUT"; done
          echo "· 部署到测试站 kyg-staging"

  build:
    runs-on: ubuntu-latest
    needs: resolve
    env:
      DEPLOY_TARGET: ${{ needs.resolve.outputs.target }}
      DEPLOY_MODE: ${{ needs.resolve.outputs.mode }}
      # 测试站：数据写同桶 staging/ 前缀（current/、v/、h1/、latest.json 全在其下），与正式站互不覆盖
      COS_PATH_PREFIX: ${{ needs.resolve.outputs.target == 'staging' && 'staging' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.web_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      # npm ci 严格按 lockfile 安装（与 test.yml 保持一致）；
      # 原先的 npm install 会在 CI 里悄悄升级依赖，导致「本地能过、线上挂」
      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      # 部署前先跑单测：push 到 main 会直接上线，不能把未验证的代码发出去
      - name: Unit tests
        working-directory: nextjs
        run: npm test

      # --- 步骤 1：为 EdgeOne 构建（cos 模式） ---
      #
      # 必须同时克隆 draft 与 production 两个数据仓：
      # bundle-data.mjs 会合并二者（production 为已升格的正式条目），
      # 缺 production 时脚本**静默**只打包 draft，导致所有正式条目
      # （四库全书、红楼梦等）在站上 404 —— 升格后的 draft 条目是
      # tombstone，会重定向到 production ID，而该 ID 不在产物里。
      - name: Clone index data repos
        run: |
          # T1：按 resolve 给的 ref 取（staging/fallback=main；promote=测试站钉下的 commit）
          fetch_at() {
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "https://github.com/open-guji/$1.git" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch_at book-index-draft book-index-draft "${{ needs.resolve.outputs.draft_ref }}"
          fetch_at book-index book-index "${{ needs.resolve.outputs.prod_ref }}"
          # 文本仓（2026-08-26 自 book-index 拆出）：整理本／辑佚／全文／抓取素材。
          # 不 clone 则 items/ 全空，而 bundle-data 的 existsSync 为假只是静默跳过，
          # 构建照样成功——整理本页在站上空白，无人得知。
          fetch_at book-text book-text "${{ needs.resolve.outputs.text_ref }}"

      # 私有文本仓（P1-私有文本后端，2026-09-26）：内容不进 bundle-data.mjs 的产物、
      # 不进公开 COS 路径，只单独同步到私有前缀（见下面 Sync private text 步骤）。
      # BOOK_TEXT_PRIVATE_TOKEN 缺失时跳过——私有文本是增量功能，不能因为它没配
      # 就把整个公开站的部署堵死。
      - name: Clone private text repo
        if: ${{ env.HAS_BOOK_TEXT_PRIVATE == 'true' }}
        env:
          HAS_BOOK_TEXT_PRIVATE: ${{ secrets.BOOK_TEXT_PRIVATE_TOKEN != '' }}
          BOOK_TEXT_PRIVATE_TOKEN: ${{ secrets.BOOK_TEXT_PRIVATE_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${BOOK_TEXT_PRIVATE_TOKEN}@github.com/open-guji-core/book-text-private.git" book-text-private

      # S2：数据产物统一输出到 nextjs/ 之外（全栈 SSR 前提；也从源头杜绝数据混进 Pages 产物）。
      # 后续所有步骤与脚本（scripts/lib/data-dirs.mjs）都从 KYG_DATA_ROOT 读写。
      - name: Set data output root (outside nextjs/)
        run: echo "KYG_DATA_ROOT=$RUNNER_TEMP/kyg-data" >> "$GITHUB_ENV"

      - name: Bundle data for EdgeOne
        working-directory: nextjs
        env:
          BOOK_INDEX_DRAFT_DIR: ${{ github.workspace }}/book-index-draft
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
          BOOK_TEXT_DIR: ${{ github.workspace }}/book-text
        run: |
          node scripts/bundle-data.mjs
          # T1：指针里记下这次用的网站代码 commit，promote 时据此取同一版代码
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['KYG_DATA_ROOT'], 'latest.json')
          with open(p) as f:
              d = json.load(f)
          d['webCommitId'] = '${{ needs.resolve.outputs.web_ref }}'
          with open(p, 'w') as f:
              json.dump(d, f)
          PY

      - name: Verify bundled data
        run: |
          # S2：public/ 下不应再有任何数据产物
          for f in data data-h1 data-h1-text latest.json; do
            if [ -e "nextjs/public/$f" ]; then
              echo "❌ nextjs/public/$f 不应存在（数据产物应在 KYG_DATA_ROOT=$KYG_DATA_ROOT）" && exit 1
            fi
          done
          cd "$KYG_DATA_ROOT/data"
          # 历史遗留产物（Phase 1 之前的 index.json / search_s.json，Phase 2 的 chunks/）
          # 若仍存在说明 bundle-data.mjs 没走干净，提前阻止上线
          for f in index.json search_s.json; do
            if [ -f "$f" ]; then
              echo "❌ Stale $f should not be present" && exit 1
            fi
          done
          if [ -d chunks ]; then
            echo "❌ Stale chunks/ should not be present (Phase 3 改 entry/)" && exit 1
          fi
          for f in meta.json resource.json resource-catalog.json resource-collection.json resource-site.json recommended.json version.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing $f" && exit 1
            fi
            echo "✓ $f ($(wc -c < "$f") bytes)"
          done
          ls entry/*.json | wc -l | xargs -I{} echo "✓ {} entry files"
          ls search/core-*.json | wc -l | xargs -I{} echo "✓ {} search shards"
          # latest.json 由 bundle-data.mjs 输出到 public/ (data/ 同级)，sync-to-cos.mjs 单独上传
          [ -f ../latest.json ] && echo "✓ latest.json ($(wc -c < ../latest.json) bytes)" || (echo "❌ Missing \$KYG_DATA_ROOT/latest.json" && exit 1)

      # 守卫：production（已升格）条目必须进入产物。
      # bundle-data.mjs 在 production 仓缺失时是**静默**跳过的，只靠上面的
      # 文件存在性检查发现不了 —— 这里逐个比对正式库索引里的 ID。
      - name: Verify production entries bundled
        run: |
          node -e "
          const fs = require('fs');
          const prodIndex = JSON.parse(
            fs.readFileSync('book-index/index/collections.json', 'utf-8'));
          const ids = Object.keys(prodIndex);
          if (ids.length === 0) {
            console.log('· production 索引为空，跳过校验');
            process.exit(0);
          }
          const missing = ids.filter(
            id => !fs.existsSync(process.env.KYG_DATA_ROOT + '/data/entry/' + id + '.json'));
          if (missing.length) {
            console.error('❌ ' + missing.length + '/' + ids.length +
              ' 个正式条目未进入产物（BOOK_INDEX_PRODUCTION_DIR 没生效？）');
            console.error('   缺失示例: ' + missing.slice(0, 5).join(', '));
            process.exit(1);
          }
          console.log('✓ ' + ids.length + ' 个正式丛编条目均已打包');
          "

      # 私有文本（P1-私有文本后端）设计上从不进 bundle-data.mjs：上面 Bundle 步骤
      # 没传 BOOK_TEXT_PRIVATE_DIR 给它，它压根不知道这个目录存在。这一步是事后
      # 防线——防的是「以后有人手滑把私有目录接进 bundle-data.mjs」，而不是防
      # 这一次没接。命令与判据都在这（PR 里贴的实测即这一步的日志）。
      - name: Verify no private text leaked into public data
        run: |
          cd "$KYG_DATA_ROOT/data"
          if grep -rl "book-text-private\|仅内部校对使用\|不得公开" . ; then
            echo "❌ 公开产物里出现了私有文本相关内容，上一条命令列出的文件即命中位置" && exit 1
          fi
          echo "✓ public/data 全量 grep 私有文本标记（book-text-private／仅内部校对使用／不得公开）：0 命中"

      - name: Sync data to Tencent COS (Singapore)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-singapore
        run: |
          cd nextjs
          node scripts/sync-to-cos.mjs

      # 私有文本单独同步到同桶的私有前缀（ACL: private，逐对象覆盖）——见
      # nextjs/scripts/sync-private-text-to-cos.mjs 文件头。与上一步公开同步
      # 完全独立：任一步缺配置只跳过自己，不互相阻塞。
      # T1：私有文本只由正式发布同步；测试站的 private-text 函数只读同一私有前缀，
      # 不需要（也不应该）测试站自己再写一份。
      - name: Sync private text to Tencent COS
        if: ${{ env.DEPLOY_TARGET == 'production' && env.HAS_BOOK_TEXT_PRIVATE == 'true' && env.HAS_COS_SECRETS == 'true' }}
        env:
          HAS_BOOK_TEXT_PRIVATE: ${{ secrets.BOOK_TEXT_PRIVATE_TOKEN != '' }}
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-singapore
          BOOK_TEXT_PRIVATE_DIR: ${{ github.workspace }}/book-text-private
        run: |
          cd nextjs
          node scripts/sync-private-text-to-cos.mjs

      # --- A3 第一期：条目按内容哈希寻址，双写到同一个桶的新前缀 h1/ ---
      #
      # 与上面 current/ 那条链路完全并行、互不影响：读的是同一份 public/data/entry/
      # （上面 bundle-data.mjs 已产出），写到 h1/ 前缀，不覆盖、不清理 current/ 或
      # v/ 下的任何对象。前端默认（NEXT_PUBLIC_DATA_LAYOUT 不设或非 'hashed'）
      # 完全不读 h1/，这两步等于是「先把新布局在生产桶里跑通，但没人在用」。
      #
      # continue-on-error：新脚本还在验证阶段，一旦有 bug 也绝不能拖累 current/
      # 已经成功的发布——真实读者当下依赖的是 current/，不是 h1/。
      - name: Bundle hashed (h1) data — dual-write, parallel to current/ (A3 第一期)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
        working-directory: nextjs
        run: node scripts/bundle-hashed.mjs

      - name: Sync hashed (h1) data to Tencent COS — dual-write, parallel to current/ (A3 第一期)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-singapore
        run: |
          cd nextjs
          node scripts/sync-h1-to-cos.mjs

      # --- A3b 第二期：整理本／全文按内容哈希寻址，双写到同一个 h1/ 前缀 ---
      #
      # 与上面 entry 的两步是同一套机制（scripts/lib/h1-sync-core.mjs 共用），
      # 读的是同一次 bundle-data.mjs 已产出的 public/data/items/（整理本/全文
      # 部分），写到 h1/text/、h1/text-manifest/，不覆盖、不清理 current/、v/
      # 或上面 h1/entry/、h1/manifest/ 下的任何对象。前端默认同样不读，
      # continue-on-error 的理由与上面一致：新链路不能拖累 current/ 已经成功的发布。
      - name: Bundle hashed (h1) collated text/full text — dual-write, parallel to current/ (A3b 第二期)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
        working-directory: nextjs
        run: node scripts/bundle-hashed-text.mjs

      - name: Sync hashed (h1) collated text/full text to Tencent COS — dual-write, parallel to current/ (A3b 第二期)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        continue-on-error: true
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-singapore
        run: |
          cd nextjs
          node scripts/sync-h1-text-to-cos.mjs

      - name: Build for EdgeOne
        env:
          # 必须为空：NEXT_PUBLIC_MODE=local 会让 next.config.ts 关掉 output:'export'，
          # 产不出静态站。CI 里本来就没有 .env.local，这里显式置空作为防线。
          NEXT_PUBLIC_MODE: ''
          # 数据源 = cos：浏览器从 data.kaiyuanguji.com 拉，靠 latest.json 解析版本
          # 当 COS secrets 缺失时降级回 bundle 模式（数据走 EdgeOne Pages /data/）
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
          NEXT_PUBLIC_COS_BASE: ${{ env.DEPLOY_TARGET == 'staging' && 'https://data.kaiyuanguji.com/staging' || 'https://data.kaiyuanguji.com' }}
          # T1：驱动 robots 全禁＋页面「测试站」角标＋noindex meta（nextjs/src/lib/constants.ts）
          NEXT_PUBLIC_SITE_ENV: ${{ env.DEPLOY_TARGET == 'staging' && 'staging' || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ env.DEPLOY_TARGET == 'staging' && 'https://staging.kaiyuanguji.com' || 'https://www.kaiyuanguji.com' }}
          # Hybrid 搜索：L1 = Meilisearch on 上海云（EdgeOne 反代）
          # L1 失败时自动 fallback 到 worker 索引（L2，COS 或 /data/search）
          NEXT_PUBLIC_MEILI_URL: https://api.kaiyuanguji.com
          # 兜底值是「公开只读搜索 key」（本来就随 JS 发给每个浏览器，非机密；
          # 绝不能在这里放 master key）。secret 缺失曾导致构建时 key 为空、
          # 线上搜索全 401（2026-08 事故）。轮换 key 后请同步更新这里和 secret。
          NEXT_PUBLIC_MEILI_KEY: ${{ secrets.MEILI_SEARCH_KEY || '1b0b438f7eadd34e1a6b53c76d63bd3614822d3ec9856251c9340a78456c5465' }}
          # 访问统计站点 ID（G-24）：仓库 Settings → Variables 里配 BAIDU_TONGJI_ID / GA_ID。
          # 非机密（本来就写在页面里）；没配则不加载统计脚本。
          # T1：测试站不上报统计，免得把自测流量混进正式站数字
          NEXT_PUBLIC_BAIDU_TONGJI_ID: ${{ env.DEPLOY_TARGET == 'production' && vars.BAIDU_TONGJI_ID || '' }}
          NEXT_PUBLIC_GA_ID: ${{ env.DEPLOY_TARGET == 'production' && vars.GA_ID || '' }}
        run: |
          cd nextjs
          rm -rf .next out
          export NEXT_PUBLIC_BASE_PATH=""
          # T1：Google Fonts 在构建期抓取偶发抖动会导致整个 build 失败——只重试
          # 这一条命令本身，最多 3 次、每次间隔 20 秒，不重跑前面的克隆/装依赖。
          n=1
          until npm run build; do
            if [ "$n" -ge 3 ]; then
              echo "❌ npm run build 重试 3 次仍失败"
              exit 1
            fi
            echo "⚠️ npm run build 第 ${n} 次失败，20 秒后重试（下一次 $((n + 1))/3）"
            sleep 20
            n=$((n + 1))
          done
          mkdir -p ../build/edgeone
          cp -r out/* ../build/edgeone/
          # h1 哈希数据（public/data-h1、data-h1-text，约 15 万文件）只走 COS，绝不进 Pages 产物：
          # 2026-09-27 A3 起它们随 out/ 一起推到 edgeone-release，产物从 ~550 涨到 16 万文件，
          # Pages 静默不再发布，线上停在 09-26 23:09Z 那版，只有 verify 的 ui 版本下限测试报红。
          rm -rf ../build/edgeone/data-h1 ../build/edgeone/data-h1-text
          # cos 模式：数据全在 COS，Pages 产物不带数据（S2 起 out/ 里本就没有，rm 只是保险）。
          # bundle 降级模式（无 COS secrets）：数据要走 Pages /data/，从 KYG_DATA_ROOT 拷回——
          # 但约 14.7 万文件必然撞下面的文件数闸，降级模式实际上不上 Pages，闸会给出明确报错。
          if [ "$NEXT_PUBLIC_DATA_SOURCE" = "cos" ]; then
            rm -rf ../build/edgeone/data
          else
            echo "bundle 降级模式：从 $KYG_DATA_ROOT 拷回 data/ 与 latest.json"
            cp -r "$KYG_DATA_ROOT/data" ../build/edgeone/data
            cp "$KYG_DATA_ROOT/latest.json" ../build/edgeone/latest.json
          fi
          du -sh ../build/edgeone | xargs echo "EdgeOne bundle size:"
          find ../build/edgeone -type f | wc -l | xargs echo "EdgeOne file count:"

      - name: Verify EdgeOne build mode
        run: |
          MODE="${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}"
          if grep -r "\"$MODE\"" nextjs/out/_next/static/chunks/ > /dev/null 2>&1; then
            echo "✓ EdgeOne build confirmed using $MODE mode"
          else
            echo "❌ EdgeOne build not using $MODE mode!" && exit 1
          fi

      # T1 判据：测试站产物必须 robots 全禁＋noindex＋角标；正式站产物三者皆无。
      - name: Verify staging artifacts (robots / noindex / badge)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        run: |
          grep -qx 'Disallow: /' build/edgeone/robots.txt && echo "✓ robots.txt 全禁" \
            || { echo "❌ robots.txt 未全禁:"; cat build/edgeone/robots.txt; exit 1; }
          grep -q 'noindex' build/edgeone/index.html && echo "✓ index.html 含 noindex meta" \
            || { echo "❌ index.html 缺 noindex meta"; exit 1; }
          grep -q 'staging-badge' build/edgeone/index.html && echo "✓ 测试站角标已渲染" \
            || { echo "❌ 角标未出现"; exit 1; }

      - name: Verify production build has no staging artifacts
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        run: |
          if grep -q 'noindex' build/edgeone/index.html; then
            echo "❌ 正式站产物含 noindex meta，混入了测试站构建" && exit 1
          fi
          if grep -q 'staging-badge' build/edgeone/index.html; then
            echo "❌ 正式站产物含测试站角标" && exit 1
          fi
          echo "✓ 正式站产物无测试站痕迹（无 noindex、无角标）"

      - name: Copy Edge Functions to EdgeOne build
        run: cp -r edge-functions build/edgeone/edge-functions

      # 闸：产物文件数异常时直接失败，别让部署静默不生效——测试站（CLI 直接
      # 上传）与正式站（Pages）共用同一份 build/edgeone，闸不分 target，两边
      # 都覆盖。
      - name: Guard EdgeOne bundle file count
        run: |
          N=$(find build/edgeone -type f | wc -l)
          echo "EdgeOne bundle file count: $N"
          if [ "$N" -gt 5000 ]; then
            echo "❌ 产物 $N 个文件（上限 5000）——数据目录混进来了？按目录统计："
            find build/edgeone -type f | awk -F/ '{print $3}' | sort | uniq -c | sort -rn | head -10
            if [ "${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}" = bundle ]; then
              echo "❌ 当前是 bundle 降级模式（COS secrets 缺失）：降级产物上不了 Pages，请恢复 COS secrets，不要放宽本闸"
            fi
            exit 1
          fi

      # --- 步骤 2：部署 ---
      # 测试站：直接上传型项目 kyg-staging（CLI）。SSR 转正后正式站也改走这条（26 卡步骤 6）
      - name: Deploy to EdgeOne (staging, direct upload)
        if: ${{ env.DEPLOY_TARGET == 'staging' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          npx -y edgeone@latest makers deploy build/edgeone -n kyg-staging -t "$EDGEONE_API_TOKEN"

      - name: Deploy to EdgeOne Branch
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/edgeone
          branch: edgeone-release # 部署到专门给 EdgeOne 用的分支

      # --- 步骤 3：清除 EdgeOne CDN 缓存 ---
      - name: Purge EdgeOne CDN cache
        if: ${{ env.HAS_EDGEONE_SECRETS == 'true' }}
        env:
          HAS_EDGEONE_SECRETS: ${{ secrets.TENCENT_SECRET_ID != '' }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: |
          pip install tencentcloud-sdk-python-teo -q
          python3 -c "
          import json, os
          from tencentcloud.common import credential
          from tencentcloud.teo.v20220901 import teo_client, models

          cred = credential.Credential(os.environ['TENCENT_SECRET_ID'], os.environ['TENCENT_SECRET_KEY'])
          client = teo_client.TeoClient(cred, '')

          # ⚠️ EdgeOne 这个 zone 注册的加速域名是裸域名 kaiyuanguji.com，
          # www.kaiyuanguji.com 没有单独注册（它的流量靠 DNS 指到同一套边缘节点，
          # 但 purge_url 按注册域名精确匹配）。2026-08-30~2026-09-02 期间一直用
          # www.kaiyuanguji.com 做 purge_url 目标，EdgeOne 返回 FailedList
          # domain not found，purge 从未真正生效过，网站页面只能靠 CDN 节点 TTL
          # 自然过期——查 DescribeAccelerationDomains 确认注册域名列表后改为
          # purge_host kaiyuanguji.com（整站，含 www 在内的所有子路径/子域名都会被清）。
          # 注意：本段是 bash 双引号包裹的 python3 -c 内联脚本，注释里绝不能出现
          # 半角双引号——曾因写入 FailedList 这个词的 JSON 字面量形式（半角双引号
          # 包住）导致 shell 提前截断整段字符串，后半段 Python 代码整体消失不执行，
          # 且 step 仍然 exit 0（截断后剩下的部分恰好是合法的空程序，不报错）。
          # data.kaiyuanguji.com/latest.json 单独 purge_url（新版本指针，让浏览器
          # 拉到新 commit）；不 purge_host data.kaiyuanguji.com 整站——那 318MB
          # 缓存白丢，回源费贵。
          # T1：按目标清——测试站清 staging.kaiyuanguji.com 与 staging/latest.json；
          # 正式站照旧。purge_host 对「未开站点加速」方式绑定的自定义域名是否生效
          # 待网站总管核实（31 卡 §B.8.6），本步骤先按同一逻辑发出，不影响正式站。
          staging = os.environ.get('DEPLOY_TARGET') == 'staging'

          req_pointer = models.CreatePurgeTaskRequest()
          req_pointer.ZoneId = os.environ['EDGEONE_ZONE_ID']
          req_pointer.Type = 'purge_url'
          req_pointer.Targets = ['https://data.kaiyuanguji.com/staging/latest.json' if staging else 'https://data.kaiyuanguji.com/latest.json']
          resp_pointer = client.CreatePurgeTask(req_pointer)
          print('✅ latest.json purged:', resp_pointer.to_json_string())

          req_site = models.CreatePurgeTaskRequest()
          req_site.ZoneId = os.environ['EDGEONE_ZONE_ID']
          req_site.Type = 'purge_host'
          req_site.Targets = ['staging.kaiyuanguji.com' if staging else 'kaiyuanguji.com']
          resp_site = client.CreatePurgeTask(req_site)
          print('✅ EdgeOne cache purged:', resp_site.to_json_string())
          "

  # --- 部署后验收：确认功能没坏、数据真的上线了 ---
  #
  # 老 smoke 只看网络层（字节数/404/pageerror），2026-09-02~03 那批故障
  # （整理本 tab 消失、"0 部书"、书名不渲染）它一个都发现不了——那些请求全是
  # 200。这个 job 断言的是「内容」。
  verify:
    runs-on: ubuntu-latest
    needs: [resolve, build]
    # 部署失败就没必要验收了；但 build 被 check 跳过时（数据无变化）也不必跑
    if: needs.build.result == 'success'
    env:
      # e2e 已支持这两个变量（e2e/fixtures/anchors.ts）
      TARGET: ${{ needs.resolve.outputs.target == 'staging' && 'https://staging.kaiyuanguji.com' || 'https://www.kaiyuanguji.com' }}
      DATA_BASE: ${{ needs.resolve.outputs.target == 'staging' && 'https://data.kaiyuanguji.com/staging' || 'https://data.kaiyuanguji.com' }}
    steps:
      # e2e 必须和被测站点是同一版代码：promote=data 时正式站代码可能比 main 旧，
      # 用 main 的 e2e 去测会命中「线上前端不比本 commit 要求的旧」而误报红。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.web_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci || npm install

      - name: Install chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # CDN purge 在边缘节点传播需要时间，直接跑会拿到旧产物
      - name: Wait for CDN propagation
        run: sleep 60

      # 契约层先跑：不开浏览器、几秒出结果，红了就不用往下走
      - name: Contract tests
        working-directory: e2e
        run: npm run test:contract

      - name: UI tests
        working-directory: e2e
        run: npm run test:ui

      # 可降级依赖（目前只有搜索 L1）：仍然跑、仍然在日志里可见，
      # 但不把发版判定为失败——前端有 L2 兜底，用户无感。
      # 让它阻断的话每次发版都亮红灯，真正的回归反而会被淹没。
      - name: Degradable deps (non-blocking)
        working-directory: e2e
        continue-on-error: true
        run: npm run test:degradable

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/out/report
          retention-days: 14

      # T1：数据自动上正式站——用户批的是「数据自动推正式站」，默认开；
      # 仓库变量 AUTO_PROMOTE_DATA 只有显式设成 'false' 才关（不用配这个变量
      # 就是默认开，符合用户预期，也符合网站总管已告诉用户「不用配」的口径）。
      # 只在 mode=staging（真的经过了测试站且 e2e 已验）且触发是数据（dispatch／
      # 定时）时生效——mode=fallback 本身已经是正式站了，mode=promote 不该再
      # 自己触发下一轮 promote。走 data 模式：正式站代码不动，只换数据——所以
      # 没 promote 的代码不会被数据发布夹带上线。
      - name: Auto-promote data to production
        if: ${{ success() && needs.resolve.outputs.mode == 'staging' && vars.AUTO_PROMOTE_DATA != 'false' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # promote=data 读的是正式站现有 latest.json 的 webCommitId（T1 之前
          # 生成的正式站 latest.json 没有这个字段，得先手动 promote=code+data
          # 一次才会有）。缺失时是「正式站还没做过第一次 promote」，不是故障，
          # 打一行警告跳过即可，不能让 workflow 报红；手动 promote 仍按 resolve
          # job 现在的逻辑报错（那边是人在等结果，缺字段就该让人知道）。
          WEB=$(curl -sf https://data.kaiyuanguji.com/latest.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('webCommitId',''))" 2>/dev/null || echo '')
          if [ -z "$WEB" ]; then
            echo "⚠️ 正式站 latest.json 还没有 webCommitId（尚未做过一次 promote=code+data），自动 promote 跳过。请先手动 workflow_dispatch target=production promote=code+data 一次。"
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f target=production -f promote=data
