name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ data-updated ]

permissions:
  contents: write

# 同一时间只允许一个部署在跑；连续 push 时取消旧的排队任务，
# 避免两个 job 争抢 edgeone-release 分支导致部署乱序。
concurrency:
  group: deploy-edgeone
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      # npm ci 严格按 lockfile 安装（与 test.yml 保持一致）；
      # 原先的 npm install 会在 CI 里悄悄升级依赖，导致「本地能过、线上挂」
      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      # 部署前先跑单测：push 到 main 会直接上线，不能把未验证的代码发出去
      - name: Unit tests
        working-directory: nextjs
        run: npm test

      # --- 步骤 1：为 EdgeOne 构建（cos 模式） ---
      #
      # 必须同时克隆 draft 与 production 两个数据仓：
      # bundle-data.mjs 会合并二者（production 为已升格的正式条目），
      # 缺 production 时脚本**静默**只打包 draft，导致所有正式条目
      # （四库全书、红楼梦等）在站上 404 —— 升格后的 draft 条目是
      # tombstone，会重定向到 production ID，而该 ID 不在产物里。
      - name: Clone index data repos
        run: |
          git clone --depth 1 https://github.com/open-guji/book-index-draft.git book-index-draft
          git clone --depth 1 https://github.com/open-guji/book-index.git book-index

      - name: Bundle data for EdgeOne
        working-directory: nextjs
        env:
          BOOK_INDEX_DRAFT_DIR: ${{ github.workspace }}/book-index-draft
          BOOK_INDEX_PRODUCTION_DIR: ${{ github.workspace }}/book-index
        run: node scripts/bundle-data.mjs

      - name: Verify bundled data
        run: |
          cd nextjs/public/data
          # 历史遗留产物（Phase 1 之前的 index.json / search_s.json，Phase 2 的 chunks/）
          # 若仍存在说明 bundle-data.mjs 没走干净，提前阻止上线
          for f in index.json search_s.json; do
            if [ -f "$f" ]; then
              echo "❌ Stale $f should not be present" && exit 1
            fi
          done
          if [ -d chunks ]; then
            echo "❌ Stale chunks/ should not be present (Phase 3 改 entry/)" && exit 1
          fi
          for f in meta.json resource.json resource-catalog.json resource-collection.json resource-site.json recommended.json version.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing $f" && exit 1
            fi
            echo "✓ $f ($(wc -c < "$f") bytes)"
          done
          ls entry/*.json | wc -l | xargs -I{} echo "✓ {} entry files"
          ls search/core-*.json | wc -l | xargs -I{} echo "✓ {} search shards"
          # latest.json 由 bundle-data.mjs 输出到 public/ (data/ 同级)，sync-to-cos.mjs 单独上传
          [ -f ../latest.json ] && echo "✓ latest.json ($(wc -c < ../latest.json) bytes)" || (echo "❌ Missing public/latest.json" && exit 1)

      # 守卫：production（已升格）条目必须进入产物。
      # bundle-data.mjs 在 production 仓缺失时是**静默**跳过的，只靠上面的
      # 文件存在性检查发现不了 —— 这里逐个比对正式库索引里的 ID。
      - name: Verify production entries bundled
        run: |
          node -e "
          const fs = require('fs');
          const prodIndex = JSON.parse(
            fs.readFileSync('book-index/index/collections.json', 'utf-8'));
          const ids = Object.keys(prodIndex);
          if (ids.length === 0) {
            console.log('· production 索引为空，跳过校验');
            process.exit(0);
          }
          const missing = ids.filter(
            id => !fs.existsSync('nextjs/public/data/entry/' + id + '.json'));
          if (missing.length) {
            console.error('❌ ' + missing.length + '/' + ids.length +
              ' 个正式条目未进入产物（BOOK_INDEX_PRODUCTION_DIR 没生效？）');
            console.error('   缺失示例: ' + missing.slice(0, 5).join(', '));
            process.exit(1);
          }
          console.log('✓ ' + ids.length + ' 个正式丛编条目均已打包');
          "

      - name: Sync data to Tencent COS (Singapore)
        if: ${{ env.HAS_COS_SECRETS == 'true' }}
        env:
          HAS_COS_SECRETS: ${{ secrets.COS_SECRET_ID != '' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-singapore
        run: |
          cd nextjs
          node scripts/sync-to-cos.mjs

      - name: Build for EdgeOne
        env:
          # 必须为空：NEXT_PUBLIC_MODE=local 会让 next.config.ts 关掉 output:'export'，
          # 产不出静态站。CI 里本来就没有 .env.local，这里显式置空作为防线。
          NEXT_PUBLIC_MODE: ''
          # 数据源 = cos：浏览器从 data.kaiyuanguji.com 拉，靠 latest.json 解析版本
          # 当 COS secrets 缺失时降级回 bundle 模式（数据走 EdgeOne Pages /data/）
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
          NEXT_PUBLIC_COS_BASE: https://data.kaiyuanguji.com
          # Hybrid 搜索：L1 = Meilisearch on 上海云（EdgeOne 反代）
          # L1 失败时自动 fallback 到 worker 索引（L2，COS 或 /data/search）
          NEXT_PUBLIC_MEILI_URL: https://api.kaiyuanguji.com
          NEXT_PUBLIC_MEILI_KEY: ${{ secrets.MEILI_SEARCH_KEY }}
        run: |
          cd nextjs
          rm -rf .next out
          export NEXT_PUBLIC_BASE_PATH=""
          npm run build
          mkdir -p ../build/edgeone
          cp -r out/* ../build/edgeone/
          # cos 模式下，out/data/ 已在 COS，EdgeOne Pages 不需要重复，剥离以瘦身
          if [ "$NEXT_PUBLIC_DATA_SOURCE" = "cos" ]; then
            echo "Stripping out/data from EdgeOne Pages bundle (data served from COS)"
            rm -rf ../build/edgeone/data
            du -sh ../build/edgeone | xargs echo "EdgeOne bundle size after strip:"
            find ../build/edgeone -type f | wc -l | xargs echo "EdgeOne file count after strip:"
          fi

      - name: Verify EdgeOne build mode
        run: |
          MODE="${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}"
          if grep -r "\"$MODE\"" nextjs/out/_next/static/chunks/ > /dev/null 2>&1; then
            echo "✓ EdgeOne build confirmed using $MODE mode"
          else
            echo "❌ EdgeOne build not using $MODE mode!" && exit 1
          fi

      - name: Copy Edge Functions to EdgeOne build
        run: cp -r edge-functions build/edgeone/edge-functions

      # --- 步骤 2：部署到 EdgeOne 分支 ---
      - name: Deploy to EdgeOne Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/edgeone
          branch: edgeone-release # 部署到专门给 EdgeOne 用的分支

      # --- 步骤 3：清除 EdgeOne CDN 缓存 ---
      - name: Purge EdgeOne CDN cache
        if: ${{ env.HAS_EDGEONE_SECRETS == 'true' }}
        env:
          HAS_EDGEONE_SECRETS: ${{ secrets.TENCENT_SECRET_ID != '' }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          DATA_SOURCE_MODE: ${{ secrets.COS_SECRET_ID != '' && 'cos' || 'bundle' }}
        run: |
          pip install tencentcloud-sdk-python-teo -q
          python3 -c "
          import json, os
          from tencentcloud.common import credential
          from tencentcloud.teo.v20220901 import teo_client, models

          cred = credential.Credential(os.environ['TENCENT_SECRET_ID'], os.environ['TENCENT_SECRET_KEY'])
          client = teo_client.TeoClient(cred, '')

          req = models.CreatePurgeTaskRequest()
          req.ZoneId = os.environ['EDGEONE_ZONE_ID']
          # COS 模式：所有 v/{commit}/* 资源不可变、长期缓存；只需精准 purge
          # 1) www.kaiyuanguji.com 整站（Pages 部署变了）
          # 2) data.kaiyuanguji.com/latest.json（新版本指针，让浏览器拉到新 commit）
          # 不再 purge_host data.kaiyuanguji.com 整站 — 那 318MB 缓存白丢，回源费贵
          if os.environ.get('DATA_SOURCE_MODE', 'bundle') == 'cos':
              req.Type = 'purge_url'
              req.Targets = [
                  'https://data.kaiyuanguji.com/latest.json',
                  'https://www.kaiyuanguji.com/',
              ]
          else:
              # 旧 bundle 模式：data/ 在主站下，整站 purge
              req.Type = 'purge_host'
              req.Targets = ['kaiyuanguji.com']

          resp = client.CreatePurgeTask(req)
          print('✅ EdgeOne cache purged:', resp.to_json_string())
          "
