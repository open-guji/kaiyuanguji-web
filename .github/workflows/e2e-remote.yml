name: E2E on a live site

# 手动对任意一个线上站跑 e2e（Q4 #132：切域名前在 ssr-test 上补跑 ui 层）。
# 只读：e2e 不提交反馈、不上报错误（自动化浏览器不上报）、不登录——测试站用独立的 KV，www 连正式 KV。
# 不部署、不改任何线上状态；只把报告作为 artifact 留 14 天。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 被测站点
        required: true
        default: https://ssr-test.kaiyuanguji.com
        type: choice
        options:
          - https://ssr-test.kaiyuanguji.com
          - https://staging.kaiyuanguji.com
          - https://www.kaiyuanguji.com
          - https://www.openguji.com
      project:
        description: 跑哪一层（contract / ui / degradable / all）
        required: true
        default: ui
        type: choice
        options: [ui, contract, degradable, all]
      ref:
        description: e2e 代码取哪个 ref（应与被测站点同版）
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: e2e-remote-${{ inputs.target }}
  cancel-in-progress: false

env:
  # >>> hosts：由 ops/sync-hosts.mjs 从 config/hosts.json 生成，勿手改；改域名请改 config/hosts.json 后重跑
  HOST_DATA: https://data.kaiyuanguji.com
  HOST_API: https://api.kaiyuanguji.com
  HOST_SITE: https://www.openguji.com
  HOST_SITE_APEX: https://openguji.com
  HOST_STAGING: https://staging.kaiyuanguji.com
  HOST_SSR_TEST: https://ssr-test.kaiyuanguji.com
  HOST_LEGACY_SITE: https://www.kaiyuanguji.com
  HOST_LEGACY_APEX: https://kaiyuanguji.com
  HOST_OAUTH_ISSUER: https://www.kaiyuanguji.com
  # <<< hosts

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
    steps:
      # 数据根：测试站读 staging/ 前缀（域名取自 config/hosts.json → 顶部 HOST_*；任务级 env 里用不了 env 上下文）
      - name: Data base
        run: |
          if [ "$TARGET" = "$HOST_STAGING" ]; then D="$HOST_DATA/staging"; else D="$HOST_DATA"; fi
          echo "DATA_BASE=$D" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci || npm install

      - name: Install chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: e2e
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "$PROJECT" = all ]; then
            npx playwright test
          else
            npx playwright test --project="$PROJECT"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-remote-report
          path: e2e/out/report
          retention-days: 14
