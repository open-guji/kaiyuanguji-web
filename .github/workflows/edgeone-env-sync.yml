name: EdgeOne env sync

# 33 卡 §六·1：把旧正式站 Pages 项目的环境变量原样抄到 kyg-ssr-spike（新正式站）。
# 只打印变量名，不打印值。KV 绑定没有写接口，仍在控制台改绑（3 项）。
# 先跑 list 看项目名 → dry-run 看要写什么 → sync 真写。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: list=列项目与变量名；dry-run=只报要写哪些；sync=真写；set=按 set_json／gen_keys 写到 targets
        required: true
        default: list
        type: choice
        options: [list, dry-run, sync, set]
      source:
        description: 源项目名（旧正式站）
        required: false
        default: ''
      target:
        description: 目标项目名
        required: false
        default: kyg-ssr-spike
      targets:
        description: set 模式：逗号分隔的项目名（每个写同样的值）
        required: false
        default: 'kaiyuanguji,kyg-ssr-spike'
      set_json:
        description: set 模式：{"变量名":"值"}，只放非机密值（密钥用 gen_keys）
        required: false
        default: ''
      gen_keys:
        description: set 模式：逗号分隔，随机生成的密钥变量名（已有则沿用，不轮换）
        required: false
        default: ''
      secret_keys:
        description: set 模式：用 GitHub secret 的值覆盖（目前只支持 ERROR_VIEW_TOKEN）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  env-sync:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
          TARGETS: ${{ inputs.targets }}
          SET_JSON: ${{ inputs.set_json }}
          GEN_KEYS: ${{ inputs.gen_keys }}
          SECRET_KEYS: ${{ inputs.secret_keys }}
          SECRET_ERROR_VIEW_TOKEN: ${{ secrets.ERROR_VIEW_TOKEN }}
        run: python3 ops/edgeone-env-sync.py
