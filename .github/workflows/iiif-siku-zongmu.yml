name: IIIF slice — 四庫總目及其他书

# overview#388：四庫總目（武英殿本，IA 浙大 CADAL 扫描）书影切三档 WebP，上传数据桶 iiif/ 前缀，
# 每册生成一份 IIIF Presentation 3 manifest，书级 Collection 列出线上已有的各册。
# 方案见 overview `项目进展/古籍索引网站/进度/四库总目影像存储方案.md`，脚本 ops/iiif/siku_zongmu_iiif.py。
# 别的书（book 填 book-index id，如北行日錄 988g7gsqhd、全唐文 995ejelvk0）读 cv 页表出图，脚本 ops/iiif/pages_iiif.py，
# 书名与各册卷次在 ops/iiif/pages-books.json。
# 只手动触发。用现有 COS 数据桶（与 deploy.yml 同一组 secrets），不新开桶。
# 时长参考（4 核 runner）：vol02＋vol03 共 298 个 canvas，切片不到 1 分钟；全书 99 册约 1.6 万页，切片约 40 分钟。

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'book-index 书 id；96mid1ogzk＝四庫總目（下面 source／commons 只对它有用），别的书一律读 cv 页表'
        type: string
        default: '96mid1ogzk'
      vols:
        description: '册号，逗号分隔（如 02,03）；all = 全部 99 册'
        required: true
        default: '02,03'
        type: string
      upload:
        description: '上传到 COS 并从数据域名取回核对（关掉＝只切片，结果看工件）'
        type: boolean
        default: true
      force:
        description: '不看桶里已有的 ETag，图全部重传、线上核对核全部（默认：同内容的图跳过，核对只核新写的加抽样）'
        type: boolean
        default: false
      commons:
        description: 'manifest 里挂 Commons 回退源（Commons API 限流时自动不挂）'
        type: boolean
        default: true
      source:
        description: '源图：ia＝自己下 IA tif、按裁剪框表拆页（旧法）；pages＝读 cv 页表与页图（拆页、换页都已做好，与管线同一份图）'
        type: choice
        options: [ia, pages]
        default: ia
      rev:
        description: '换图源册：钉 cv 页表版本（暂存 staged 版也取；填册 yaml 的 source_rev）。留空＝最新已发布版。只对 source=pages 有用'
        type: string
        default: ''
      image_seg:
        description: '换图源册：图路径版本段（如 qiefen2），图放 <册>/<段>/<页序>/…，canvas id 与 manifest 路径不变。留空＝不加'
        type: string
        default: ''
      no_ia:
        description: '换图源册：manifest 不挂 Internet Archive 回退（页号已重编，IA 叶号对不上；同时关掉 commons）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 按册号分组：不同册的运行可以并行（大批量拆成几路跑）；同一组册重复触发仍排队
  group: iiif-siku-zongmu-${{ inputs.book }}-${{ inputs.vols }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python3 -m pip install -q 'pillow==12.3.0'

      - name: Unit tests
        run: python3 -m unittest ops/tests/test_siku_iiif.py ops/tests/test_pages_iiif.py -v

      - name: Cord ↔ 裁剪框表核对（拆页框与 book-text 不一致就停，免得切出与 cord 对不上的书影）
        if: inputs.book == '96mid1ogzk' && inputs.image_seg == ''
        env:
          VOLS: ${{ inputs.vols }}
        run: python3 ops/iiif/check_cord_vs_splits.py --vols "$VOLS"

      - name: Slice → manifest → upload → verify
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          VOLS: ${{ inputs.vols }}
          UPLOAD: ${{ inputs.upload }}
          COMMONS: ${{ inputs.commons }}
          FORCE: ${{ inputs.force }}
          SOURCE: ${{ inputs.source }}
          BOOK: ${{ inputs.book }}
          REV: ${{ inputs.rev }}
          IMAGE_SEG: ${{ inputs.image_seg }}
          NO_IA: ${{ inputs.no_ia }}
        run: |
          set -euo pipefail
          if ! [[ "$VOLS" =~ ^(all|[0-9]{1,2}(,[0-9]{1,2})*)$ ]]; then echo "❌ vols 格式不对：$VOLS"; exit 1; fi
          if ! [[ "$BOOK" =~ ^[0-9a-z]{10}$ ]]; then echo "❌ book 格式不对：$BOOK"; exit 1; fi
          ARGS=(--vols "$VOLS" --out "$RUNNER_TEMP/iiif/out" --cache "$RUNNER_TEMP/iiif/cache" --report "$RUNNER_TEMP/iiif/report.json")
          if [ "$UPLOAD" = "true" ]; then
            if [ -z "$COS_SECRET_ID" ]; then echo "❌ 没有 COS secrets"; exit 1; fi
            ARGS+=(--upload --verify)
          fi
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          if [ "$BOOK" != "96mid1ogzk" ]; then
            python3 ops/iiif/pages_iiif.py --book "$BOOK" "${ARGS[@]}"
            exit 0
          fi
          if ! [[ "$REV" =~ ^[0-9]*$ ]]; then echo "❌ rev 格式不对：$REV"; exit 1; fi
          if ! [[ "$IMAGE_SEG" =~ ^[0-9a-z]*$ ]]; then echo "❌ image_seg 格式不对：$IMAGE_SEG"; exit 1; fi
          [ "$COMMONS" = "true" ] && [ "$NO_IA" != "true" ] || ARGS+=(--no-commons)
          [ "$NO_IA" = "true" ] && ARGS+=(--no-ia)
          [ -n "$REV" ] && ARGS+=(--rev "$REV")
          [ -n "$IMAGE_SEG" ] && ARGS+=(--image-seg "$IMAGE_SEG")
          ARGS+=(--source "$SOURCE")
          python3 ops/iiif/siku_zongmu_iiif.py "${ARGS[@]}"

      - name: Upload report and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iiif-${{ inputs.book }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/iiif/report.json
            ${{ runner.temp }}/iiif/samples/
            ${{ runner.temp }}/iiif/out/iiif/*/**/manifest.json
          retention-days: 14
          if-no-files-found: warn
