name: IIIF 源图档 — 四庫總目 文淵閣

# 书影「显示完整书页」用：文淵閣每个 DjVu 整页转 2400 宽 WebP，传到 iiif/96mid1ogzk/<册>/src/<slug>/full/2400,/0/default.webp。
# 两个半叶共用一个源图档。脚本 ops/iiif/wyg_src_tier.py；DjVu 从页表 sources[0].commons_url 下（核 sha256），一册一册处理。
# 传完后再重跑 slice 工作流发 manifest，且 slice 加 --src-tier 才会写 src.url（工作流 inputs 里的 src_tier 开关）；传图前不要开。
# rev：该册页表版本（r003 或 r004；旁车按它的 table_sha256 对）。同一次运行里的册必须同一个 rev。

on:
  workflow_dispatch:
    inputs:
      vols:
        description: '册号，逗号分隔（如 01,02）'
        required: true
        type: string
      rev:
        description: '页表版本号（3 或 4）'
        required: true
        type: string
      upload:
        description: '上传到 COS（关掉＝只转换，不传）'
        type: boolean
        default: true
      force:
        description: '不看桶里 ETag，全部重传'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iiif-wyg-src-tier-${{ inputs.vols }}
  cancel-in-progress: false

jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python3 -m pip install -q 'pillow==12.3.0'
          sudo apt-get update -q && sudo apt-get install -y -q djvulibre-bin
      - name: DjVu → 2400 宽 WebP → 上传
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          VOLS: ${{ inputs.vols }}
          REV: ${{ inputs.rev }}
          UPLOAD: ${{ inputs.upload }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if ! [[ "$VOLS" =~ ^[0-9]{1,2}(,[0-9]{1,2})*$ ]]; then echo "❌ vols 格式不对：$VOLS"; exit 1; fi
          if ! [[ "$REV" =~ ^[0-9]+$ ]]; then echo "❌ rev 格式不对：$REV"; exit 1; fi
          ARGS=(--vols "$VOLS" --rev "$REV" --out "$RUNNER_TEMP/tier/out" --cache "$RUNNER_TEMP/tier/cache")
          if [ "$UPLOAD" = "true" ]; then
            if [ -z "$COS_SECRET_ID" ]; then echo "❌ 没有 COS secrets"; exit 1; fi
            ARGS+=(--upload)
          fi
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python3 ops/iiif/wyg_src_tier.py "${ARGS[@]}"
