name: Monitor

# 线上监控与告警（MON 道，2026-09-27）。取代原 health-check.yml（每 6 小时探活），
# 原脚本 ops/health-probe.sh 里的检查已全部并入 monitor/checks/probe.mjs 的 A2。
#
# 跑在 GitHub 托管 runner 上，与被监控对象解耦——上海机上的 self-hosted runner
# 在它自己故障时一并离线，不能拿来监控它自己（2026-09-03 教训）。
#
# 三类检查（每项测什么、阈值、误报怎么调：monitor/README.md）：
#   A 主动探测   每 15 分钟   纯 HTTP，单次 < 2 分钟
#   B 数据监测   每小时       顺带在 A 的 job 里跑（距上次满 55 分钟那一轮），省一次 runner 起停
#   C 契约冒烟   每 6 小时    e2e 的 contract 项目打正式站
#
# 告警 = GitHub Issue（标签 monitor），连续 2 次失败才开、恢复自动关、持续失败 6 小时提醒一次。
# 邮件由 GitHub 的 issue 通知发出。检查失败**不**让 job 变红——否则每 15 分钟再多一封
# 「workflow run failed」邮件；job 红只意味着告警链路自己坏了。
#
# 状态（每项的连续失败数、对应 issue 号、搜索命中基线）存 Actions cache，不往仓里提交；
# cache 丢了会从 open 的 monitor issue 找回「正在告警」，最坏晚一轮开单。

on:
  schedule:
    - cron: '*/15 * * * *'   # A（+B）
    - cron: '41 */6 * * *'   # C
  workflow_dispatch:
    inputs:
      suite:
        description: 'probe = A（满 55 分钟顺带 B）；data = 只跑 B；smoke = C'
        type: choice
        options: [probe, data, smoke]
        default: probe
      dry_run:
        description: '只出报告，不开／评／关 issue'
        type: boolean
        default: false
  # 改监控本身的 PR：跑单测＋一次只读的线上 dry-run（实测耗时）。
  # 打上标签 monitor-demo 时另跑一次真实故障注入演示（标签 monitor-test 的 issue，开了就关）。
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'monitor/**'
      - '.github/workflows/monitor.yml'
      - 'edge-functions/api/track-error.js'
      - 'edge-functions/api/feedback.js'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: A 主动探测（+B 数据监测）
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite != 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: monitor-probe
      cancel-in-progress: false
    steps:
      # 只取要用的几个文件；带 50 个提交的历史，给「部署停更」算 main 改 UI 版本的时间
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            monitor
            ops
            nextjs/package.json
            e2e/fixtures
          sparse-checkout-cone-mode: false

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor
          key: monitor-state-probe-${{ github.run_id }}
          restore-keys: monitor-state-probe-

      - name: Run checks
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 缺这两个 secret 时 B1／B2 自动跳过或降级，并在报告里注明「未配置」
          ERROR_VIEW_TOKEN: ${{ secrets.ERROR_VIEW_TOKEN }}
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
        run: |
          ARGS="--state .monitor/state.json --out .monitor/last.json"
          case "${{ inputs.suite }}" in
            data) ARGS="$ARGS --suite data" ;;
            *)    ARGS="$ARGS --suite probe --data-every 55" ;;
          esac
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          node monitor/run.mjs $ARGS

      - name: Save monitor state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .monitor
          key: monitor-state-probe-${{ github.run_id }}

      # 只在开单／内容变化／恢复时推；未配 HEALTH_NOTIFY_WEBHOOK 时脚本静默跳过
      - name: Push to IM webhook
        if: ${{ !cancelled() && steps.run.outputs.notify != '' }}
        env:
          HEALTH_NOTIFY_WEBHOOK: ${{ secrets.HEALTH_NOTIFY_WEBHOOK }}
          HEALTH_NOTIFY_FORMAT: ${{ vars.HEALTH_NOTIFY_FORMAT }}
          NOTIFY_TITLE: '开鉴古籍线上监控'
          REPORT: ${{ steps.run.outputs.notify }}
        run: bash ops/health-notify.sh

  smoke:
    name: C 契约冒烟（正式站）
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: monitor-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            monitor
            ops
            e2e
            perf/smoke.ts
            perf/scenarios.ts
            nextjs/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install (e2e，contract 只用 HTTP，不装浏览器)
        working-directory: e2e
        run: npm ci
      - name: Contract tests vs production
        working-directory: e2e
        continue-on-error: true
        env:
          CI: '1'
        run: npx playwright test --project=contract
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor
          key: monitor-state-smoke-${{ github.run_id }}
          restore-keys: monitor-state-smoke-
      - name: Fold report into alert
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS="--suite smoke --smoke-report e2e/out/results.json --state .monitor/state.json"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          node monitor/run.mjs $ARGS
      - name: Save monitor state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .monitor
          key: monitor-state-smoke-${{ github.run_id }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-smoke-${{ github.run_id }}
          path: e2e/out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Push to IM webhook
        if: ${{ !cancelled() && steps.run.outputs.notify != '' }}
        env:
          HEALTH_NOTIFY_WEBHOOK: ${{ secrets.HEALTH_NOTIFY_WEBHOOK }}
          HEALTH_NOTIFY_FORMAT: ${{ vars.HEALTH_NOTIFY_FORMAT }}
          NOTIFY_TITLE: '开鉴古籍线上监控'
          REPORT: ${{ steps.run.outputs.notify }}
        run: bash ops/health-notify.sh

  selftest:
    name: 监控自测（单测 + 线上只读 dry-run）
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            monitor
            e2e
            perf/smoke.ts
            perf/scenarios.ts
            nextjs/package.json
          sparse-checkout-cone-mode: false
      - name: Unit tests（状态机、故障注入：本地假服务器＋假 GitHub API）
        working-directory: monitor
        run: npm test
      - name: Live dry-run（A+B 全跑一遍，不碰 issue；报告见 Summary）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          node monitor/run.mjs --suite probe --with-data --dry-run --out monitor-dry-run.json
          echo "A+B 单次运行墙钟：$(( $(date +%s) - start )) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
      # C 类也 dry-run 一次：验证 contract 项目在 sparse checkout 下跑得起来、报告能折成一项
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: C dry-run（contract vs 正式站）
        env:
          CI: '1'
        run: |
          start=$(date +%s)
          (cd e2e && npm ci && npx playwright test --project=contract) || true
          node monitor/run.mjs --suite smoke --smoke-report e2e/out/results.json --dry-run
          echo "C 单次运行墙钟（含 npm ci）：$(( $(date +%s) - start )) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: monitor-dry-run
          path: |
            monitor-dry-run.json
            e2e/out/results.json
          retention-days: 7
          if-no-files-found: ignore

  # 真实故障注入演示：把测试站域名指向一个不存在的主机，连跑两轮 → 开单（标签 monitor-test、
  # 标题带「[演示]」），第三轮指回真域名 → 自动关单。只在 PR 打上 monitor-demo 标签时跑。
  demo:
    name: 故障注入演示（真 issue，标签 monitor-test）
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'monitor-demo')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MON_LABEL: monitor-test
      MON_TITLE_PREFIX: '[演示] '
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            monitor
            nextjs/package.json
            e2e/fixtures
          sparse-checkout-cone-mode: false
      - name: 第 1 轮（故障：测试站域名不可达）→ 不开单
        env:
          MON_STAGING: https://staging-monitor-demo.invalid
        run: node monitor/run.mjs --suite probe --only A6-staging --state demo.json
      - name: 第 2 轮（故障持续）→ 开单
        env:
          MON_STAGING: https://staging-monitor-demo.invalid
        run: node monitor/run.mjs --suite probe --only A6-staging --state demo.json
      - name: 第 3 轮（故障持续）→ 不刷评论
        env:
          MON_STAGING: https://staging-monitor-demo.invalid
        run: node monitor/run.mjs --suite probe --only A6-staging --state demo.json
      - name: 第 4 轮（恢复）→ 自动关单
        run: node monitor/run.mjs --suite probe --only A6-staging --state demo.json
