name: probe eo zone (temporary, read-only)
# 临时只读探针（overview#275）：列 EdgeOne 账号下的站点、kaiyuanguji.com 站点的加速域名与规则引擎、Pages 项目的域名字段。
# 只打印域名、规则条件与缓存动作；源站地址、请求头值、任何带 key/token/secret 的参数一律打码。用完删分支。
on:
  push:
    branches: [probe/eo-zone]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python3 -m pip install --user tencentcloud-sdk-python-teo -q
      - env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        shell: python3 {0}
        run: |
          import json, os, re, urllib.request
          from tencentcloud.common import credential
          from tencentcloud.teo.v20220901 import teo_client, models
          SECRETISH = re.compile(r'(key|token|secret|password|auth|sign)', re.I)
          def red(o, k=''):
              if isinstance(o, dict):
                  return {kk: red(v, kk) for kk, v in o.items()}
              if isinstance(o, list):
                  return [red(v, k) for v in o]
              if isinstance(o, str) and (SECRETISH.search(k) or k in ('Origin', 'OriginAddress', 'BackupOrigin', 'PrivateParameters', 'Value') and re.match(r'^\d+\.\d+\.\d+\.\d+', o)):
                  return '***'
              return o
          c = teo_client.TeoClient(credential.Credential(os.environ['TENCENT_SECRET_ID'], os.environ['TENCENT_SECRET_KEY']), '')
          def call(name, **kw):
              r = getattr(models, name + 'Request')()
              r.from_json_string(json.dumps(kw))
              try:
                  return json.loads(getattr(c, name)(r).to_json_string())
              except Exception as e:
                  return {'ERROR': str(e)[:300]}
          req = urllib.request.Request('https://pages-api.edgeone.ai/v1', data=json.dumps({'Action': 'DescribePagesProjects', 'PageNumber': 1, 'PageSize': 50}).encode(), method='POST', headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['EDGEONE_API_TOKEN']})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          resp = (data.get('Data') or {}).get('Response') or data
          for pr in resp.get('Projects') or []:
              if pr.get('Name') == 'kyg-ssr-spike':
                  print(json.dumps(red(pr.get('CustomDomains')), ensure_ascii=False, indent=1))
          for d in ('www.openguji.com', 'openguji.com'):
              r = call('DescribeAccelerationDomains', ZoneId='zone-3l07bqnx3ems', Limit=50, Filters=[{'Name': 'domain-name', 'Values': [d]}])
              print(d, json.dumps(red(r), ensure_ascii=False)[:1500])
