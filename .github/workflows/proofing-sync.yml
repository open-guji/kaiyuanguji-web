name: proofing-sync

# 待审单与公众意见的每日同步（ai-team `team/整理/设计/待审单与公众意见走中心库.md` 块 C）。
#   opinions：中心库待审单的 (书, rev) → 本站 /api/cellreview 管理读 → 中心库 feedback/lists/web/<书>/<rev>.jsonl
#   publish ：中心库待审单 → COS proof/index.json、proof/<书>/<章>.pending.json（网站精校页、阅读页提示读这里）
#             待审单带 sprites[]（GUJI-675，cv 写）的，先把 R2 里的雪碧图取回，传到 COS proof/<书>/<章>/<文件名>，再传单子、最后换 index
# 另（GUJI-597）：opinions 步顺带把 /api/charfix 的改字、一段有问题、专名意见并进中心库 feedback/lists/web/<书>/fixes.jsonl，
#   publish 步把它发成公开清单 proof/fixes/<书>.json（整册读者意见页 /feedback/text 读）。收哪几部书见 FIX_BOOKS。
# 另（M11 B2，GUJI-714）：opinions 步读中心库 feedback/lists/web/<书>/status.jsonl（cv `guji opinions publish-status` 写的处理结论），
#   与 KV 现状比，不同的才 POST /api/fixes（状态＋整理组回复）；publish 步把状态并进公开清单。
# 两步各自只拿自己要的密钥；COS 密钥只在 publish 步骤的 step 级 env。雪碧图仍由 sync-proof-sprites（GUJI-557）发。
# 中心库用的就是网站管理令牌 FEEDBACK_ADMIN_TOKEN（用户 10-19 定复用，Worker TOKENS_WEB_JSON 里登记为 web 角色），不另设 secret。
# 10-19 staging 真跑通过（11 票进中心库、staging/proof/ 可读）后直接开定时，不再要仓库变量。
# 与 data.yml 互不依赖：本任务失败不影响每日发布。日志与摘要只有计数（公开仓）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'production = proof/；staging = 演练，写 staging/proof/'
        type: choice
        options: [production, staging]
        default: staging
      parts:
        description: '跑哪几段'
        type: choice
        options: [all, opinions, publish]
        default: all
      dry_run:
        description: '只读不写（不写中心库、不传 COS）'
        type: boolean
        default: true
      only:
        description: '只发这几本书或这几章，如 96mid1ogzk/006（逗号分隔；空 = 全站）。落票重出单后用，一两分钟上线'
        type: string
        default: ''
  schedule:
    - cron: '23 21 * * *' # 每天，排在 data.yml 每日发布（21:43 UTC）之前

permissions:
  contents: read
  issues: write   # 「该重出单」提醒 issue（GUJI-688）

concurrency:
  group: proofing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROOF_WS: ${{ vars.PROOF_WS || 'siku-zongmu' }}
      FIX_BOOKS: ${{ vars.FIX_BOOKS || '96mid1ogzk' }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
      ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: nextjs
        run: npm ci
      - name: Unit tests (proofing-sync)
        id: tests
        working-directory: nextjs
        run: node --test scripts/lib/proofing-sync.test.mjs scripts/lib/fixes-sync.test.mjs scripts/lib/proofing-smoke.test.mjs
      - name: Opinions → central DB
        id: opinions
        if: github.event_name == 'schedule' || inputs.parts != 'publish'
        working-directory: nextjs
        env:
          PARTS: opinions
          REISSUE_OUT: ${{ runner.temp }}/reissue.tsv
          GUJI_DATA_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }} # 同一把网站管理令牌，中心库里登记为 web 角色
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
        run: node scripts/proofing-sync.mjs
      # 线上单已有 ≥ 20% 的格投过票 → 开提醒 issue「该重出单」（GUJI-688）；rev 换了、不再超线的自动关
      - name: Reissue reminder
        if: ${{ !cancelled() && steps.opinions.outcome != 'skipped' && (github.event_name == 'schedule' || (inputs.target == 'production' && inputs.only == '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIST: ${{ runner.temp }}/reissue.tsv
        run: |
          [ -f "$LIST" ] || { echo '· opinions 没出提醒清单，不动 issue'; exit 0; }
          gh label create proofing-reissue --color FBCA04 --description '线上待审单已投格达两成，该落票重出单' 2>/dev/null || true
          want=$(cut -f1 "$LIST")
          gh issue list --label proofing-reissue --state open --json number,title --jq '.[] | "\(.number)\t\(.title)"' | while IFS=$'\t' read -r num title; do
            key=${title#该落票重出单：}
            grep -qxF "$key" <<<"$want" || gh issue close "$num" --comment "已不在提醒清单里（rev 已换或投票数回落），自动关闭。"
          done
          while IFS=$'\t' read -r key voted n pct; do
            [ -n "$key" ] || continue
            title="该落票重出单：$key"
            num=$(gh issue list --label proofing-reissue --state open --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
            [ -n "$num" ] && { echo "· 已有 #$num：$key"; continue; }
            gh issue create --title "$title" --label proofing-reissue --body "线上待审单 $key 已有 $voted／$n 格（$pct%）投过票。用 open-guji-cv \`scripts/zhengli/proof_cycle.py plan\` 出计划、\`apply\` 落票并重出单。GUJI-688。"
          done < "$LIST"
      - name: Pending lists → COS
        id: publish
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && (github.event_name == 'schedule' || inputs.parts != 'opinions') }}
        working-directory: nextjs
        env:
          PARTS: publish
          GUJI_DATA_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }} # 同一把网站管理令牌，中心库里登记为 web 角色
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-shanghai
          COS_PATH_PREFIX: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') && 'staging' || '' }}
          PURGE_URLS_OUT: ${{ runner.temp }}/proof-purge.txt
        run: node scripts/proofing-sync.mjs
      # 数据域名的 EdgeOne 节点不认源站 max-age=300（10-21 实测旧待审单缓存了 14 小时），传了什么就按地址清什么
      - name: Purge uploaded proof files on the CDN
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_DATA_ZONE_ID: ${{ secrets.EDGEONE_DATA_ZONE_ID }}
          LIST: ${{ runner.temp }}/proof-purge.txt
        run: |
          if [ ! -s "$LIST" ]; then echo '· 没有新传的文件，不清'; exit 0; fi
          python3 -m pip install --user tencentcloud-sdk-python-teo -q
          # purge-urls.py 一次最多 20 个地址
          xargs -n 20 python3 ops/purge-urls.py < "$LIST"
      # 读者侧冒烟（GUJI-730 P0-2，发布标准 G3c）：每张在线单 rev 与 index 一致、引用的图都登记在 sprites[] 里且取得到。
      # 只读，红了这次 run 就红（watchdog／通知照常看得到）；不影响前面已发布的东西。
      - name: Reader-side smoke
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: nextjs
        env:
          PROOF_STAGING: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') && '1' || '' }}
        # 刚清完 CDN，边缘节点可能还在回旧 index：不过就隔 90 秒再看一次
        run: node scripts/proofing-smoke.mjs || { sleep 90; node scripts/proofing-smoke.mjs; }
