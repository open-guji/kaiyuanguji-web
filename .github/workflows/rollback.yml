name: Rollback

# DBG：一键退回上一版。先读 docs/runbook.md 的「回滚」一节。
#
# 两条路（method）：
#   promote（默认，首选）：复用平时发版那条路——把目标 web commit 在测试站重建（deploy.yml
#       target=staging，跑完整 verify），绿了再 deploy.yml target=production promote=code+data。
#       target=staging 时只做前半段 ＝ 在测试站演练。约 20 分钟。
#   release-branch（快，只限正式站）：edgeone-release 恢复成当时那版产物的树＋清 CDN，约 2 分钟，
#       不重建、数据不动；但下一次自动 promote=data 会冲掉它（计划里有提醒）。
# 数据不单独回退：deploy.yml 还没有「指定数据 commit」的入口（见 PR 描述「要改 deploy.yml 的部分」）。
#
# dry_run 默认开：只出计划（现在线上是哪版、要退到哪版、会连带动什么），不做任何改动。
# 本 workflow 不改 deploy.yml，只 dispatch 它。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'staging = 在测试站演练（只做重建测试站那半段）；production = 真回滚正式站'
        type: choice
        options: [staging, production]
        default: staging
      web_commit:
        description: '退回到哪个网站 commit（空 = 上一次正式发布的那版）'
        required: false
        default: ''
      method:
        description: 'promote = 测试站重建→verify→promote（首选）；release-branch = 直接恢复 edgeone-release 产物（快，仅正式站）'
        type: choice
        options: [promote, release-branch]
        default: promote
      dry_run:
        description: '只出计划、不做改动'
        type: boolean
        default: true
  # 改到回滚相关文件的 PR 自动跑一遍 dry-run（两个目标各一次），保证计划逻辑在真实历史上是通的
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rollback.yml
      - ops/rollback-*.py

permissions:
  contents: write   # 推临时 tag；release-branch 路推 edgeone-release
  actions: write    # dispatch deploy.yml

# 与发布不抢：同一时间只允许一个回滚
concurrency:
  group: rollback-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PR 上两个目标都 dry-run；手动触发只跑选中的那一个
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["staging","production"]' || format('["{0}"]', inputs.target)) }}
    outputs:
      web_commit: ${{ steps.plan.outputs.web_commit }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      has_version_endpoint: ${{ steps.plan.outputs.has_version_endpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 要看目标 commit 的 deploy.yml／有没有 version.js
      - run: git fetch -q origin edgeone-release
      - id: plan
        env:
          # 自由文本输入只经环境变量进脚本，不直接拼进 shell（防注入）；脚本里再校验是不是 commit
          TARGET: ${{ matrix.target }}
          METHOD: ${{ inputs.method || 'promote' }}
          WEB_INPUT: ${{ inputs.web_commit }}
          DRY: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && '--dry-run' || '' }}
        run: python3 ops/rollback-plan.py --target "$TARGET" --method "$METHOD" --web-commit "$WEB_INPUT" $DRY

  # ---- promote 路：测试站重建（target=staging 时即为演练） ----
  staging:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.method == 'promote' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WEB: ${{ needs.plan.outputs.web_commit }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops
      - id: tag
        run: |
          T="rollback-${WEB:0:12}-${{ github.run_id }}"
          # 走 refs API：浅克隆里没有旧 commit 对象，git push <sha> 推不上去
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$T" -f sha="$WEB" > /dev/null
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "· 临时 tag $T → $WEB"
      - name: Dispatch deploy.yml target=staging at the tag, wait for it
        run: |
          T="${{ steps.tag.outputs.tag }}"
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref "$T" -f target=staging
          RUN=''
          for i in $(seq 1 30); do
            sleep 10
            RUN=$(gh run list --workflow deploy.yml --event workflow_dispatch --limit 20 \
              --json databaseId,headBranch,createdAt \
              -q "[.[] | select(.headBranch == \"$T\" and .createdAt >= \"$SINCE\")][0].databaseId // empty")
            [ -n "$RUN" ] && break
          done
          [ -n "$RUN" ] || { echo "❌ 5 分钟内没等到 deploy.yml 的这次运行"; exit 1; }
          echo "· deploy.yml 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN"
          echo "- 测试站重建：${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$RUN" --exit-status --interval 30 > /dev/null || { echo "❌ 测试站重建（含 verify）没绿，回滚中止，正式站未动"; exit 1; }
          echo "✓ 测试站重建＋verify 绿"
      - name: Check staging is at the target
        run: python3 ops/rollback-check.py --site staging --web "$WEB" --pointer --version-endpoint "${{ needs.plan.outputs.has_version_endpoint }}" --timeout 300

  # ---- promote 路：正式站 ----
  production:
    needs: [plan, staging]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.method == 'promote' && inputs.target == 'production' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WEB: ${{ needs.plan.outputs.web_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops
      - name: Promote code+data to production, wait for it
        run: |
          # promote 取的是测试站指针此刻的 webCommitId：main 若刚好有 push，测试站会被改写成新代码。
          # 发之前再核一遍；发之后下一步再核正式站指针（见 PR 描述「promote 安全方案」）
          python3 ops/rollback-check.py --site staging --web "$WEB" --pointer --version-endpoint false --timeout 0
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main -f target=production -f promote=code+data
          RUN=''
          for i in $(seq 1 30); do
            sleep 10
            RUN=$(gh run list --workflow deploy.yml --event workflow_dispatch --branch main --limit 20 \
              --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$SINCE\")][0].databaseId // empty")
            [ -n "$RUN" ] && break
          done
          [ -n "$RUN" ] || { echo "❌ 5 分钟内没等到 promote 这次运行"; exit 1; }
          echo "- 正式站 promote：${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$RUN" --exit-status --interval 30 > /dev/null || { echo "❌ promote 没绿，去看上面那次运行"; exit 1; }
      - name: Check production is at the target
        run: python3 ops/rollback-check.py --site production --web "$WEB" --pointer --version-endpoint "${{ needs.plan.outputs.has_version_endpoint }}" --timeout 600

  cleanup:
    needs: [staging, production]
    if: ${{ always() && needs.staging.outputs.tag != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${{ needs.staging.outputs.tag }}"

  # ---- release-branch 路：直接恢复正式站产物 ----
  release-branch:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.method == 'release-branch' && inputs.target == 'production' }}
    runs-on: ubuntu-latest
    env:
      WEB: ${{ needs.plan.outputs.web_commit }}
      REL: ${{ needs.plan.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore edgeone-release tree (new commit, no history rewrite)
        run: |
          git fetch -q origin edgeone-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B rollback-release origin/edgeone-release
          git read-tree -u --reset "$REL"
          # 提交信息沿用发布格式，rollback-plan.py 据此把这次也当成一次正式发布
          git commit -q --allow-empty -m "Deploying to edgeone-release from @ ${{ github.repository }}@$WEB 🚀 (rollback to release ${REL:0:12}, run ${{ github.run_id }})"
          git push origin HEAD:edgeone-release
          echo "- edgeone-release 已恢复为 ${REL:0:12} 的产物（web ${WEB:0:12}）" >> "$GITHUB_STEP_SUMMARY"
      - run: pip install tencentcloud-sdk-python-teo -q
      - name: Purge CDN
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: python3 ops/rollback-purge.py
      - name: Check production is at the target
        if: ${{ needs.plan.outputs.has_version_endpoint == 'true' }}
        run: python3 ops/rollback-check.py --site production --web "$WEB" --timeout 600
      - name: Remind about auto-promote
        run: |
          echo "::warning title=回滚会被自动 promote 冲掉::正式站 latest.json 的 webCommitId 没变，每天 04:30 的自动 promote=data 会按它重建代码。修好前把仓库变量 AUTO_PROMOTE_DATA 设为 false，或补走一次 method=promote。"
