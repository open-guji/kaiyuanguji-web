name: Tests

# 触发：
#  - PR 提交：跑全套（单测、静态导出 smoke、全栈 e2e）
#  - 手动 workflow_dispatch
#  - 每日 02:00 UTC（10:00 北京时间）跑 perf 回归
#
# 不挂 push trigger：push 到 main 由 deploy.yml 负责（它自带 npm test），
# 这里再挂一次只会重复跑单测 + 拖一遍重的 smoke。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  unit:
    name: Jest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: nextjs
        run: npm ci
      - name: Test
        working-directory: nextjs
        run: npm test
      # 打包／同步脚本的单测（nextjs/scripts 下的 *.test.mjs，不进 jest）。此前没有任何 CI 跑它们，
      # #166 改了构建期核对而这里的期望没跟着改，main 上白挂了一阵（overview#307）。
      - name: Script tests (nextjs/scripts)
        working-directory: nextjs
        run: node --test scripts/*.test.mjs scripts/lib/*.test.mjs
      # 夜间性能门槛的判定逻辑（perf/gate.ts）：纯函数，PR 上就跑，不碰线上
      - name: Install (perf)
        working-directory: perf
        run: npm ci
      - name: Perf gate unit tests
        working-directory: perf
        run: npx tsx --test gate.test.ts

  smoke:
    name: Browser smoke (build + serve + Playwright)
    runs-on: ubuntu-latest
    # nightly schedule + 手动触发跑；PR 也跑，确保 build 流程不挂
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone book-index-draft
        run: git clone --depth 1 https://github.com/open-guji/book-index-draft.git book-index-draft
      - name: Install (nextjs)
        working-directory: nextjs
        run: npm ci
      - name: Install (perf)
        working-directory: perf
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: perf
        run: npx playwright install --with-deps chromium
      - name: Build static export
        working-directory: nextjs
        env:
          NEXT_PUBLIC_MODE: remote
          NEXT_PUBLIC_DATA_SOURCE: bundle
          NEXT_PUBLIC_BASE_PATH: ''
          BOOK_INDEX_DRAFT_DIR: ${{ github.workspace }}/book-index-draft
        # T1：Google Fonts 在构建期抓取偶发抖动会导致整个 build 失败——只重试
        # 这一条命令本身，最多 3 次、每次间隔 20 秒（与 deploy.yml 的 Build for
        # EdgeOne 步骤同一套重试逻辑）。
        run: |
          n=1
          until npm run build; do
            if [ "$n" -ge 3 ]; then
              echo "❌ npm run build 重试 3 次仍失败"
              exit 1
            fi
            echo "⚠️ npm run build 第 ${n} 次失败，20 秒后重试（下一次 $((n + 1))/3）"
            sleep 20
            n=$((n + 1))
          done
      - name: Serve build
        working-directory: nextjs
        run: |
          npx --yes serve -p 8765 out &
          # wait for server
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/data/version.json > /dev/null && break
            sleep 1
          done
      - name: Smoke test
        working-directory: perf
        run: npm run smoke -- --target=http://localhost:8765
      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: perf/out/
          retention-days: 7

  # 浏览器镜像版本＝e2e 锁定的 @playwright/test 版本（Fullstack 跑在 Playwright 官方镜像里，见下）
  pw-image:
    name: Playwright image version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e/package-lock.json
          sparse-checkout-cone-mode: false
      - id: pw
        run: |
          V=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ 从 e2e/package-lock.json 读不出 @playwright/test 版本：$V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  fullstack:
    # WEB2（overview#249 Q6）：smoke 只测静态导出，全栈路由（/item/*、/item/*/read、中间件跳转）
    # 以前要部署到测试站后 verify 才有人测——阅读页全 500（INT P1）就是这么漏过去的。
    # 这里全栈构建＋next start，跑 e2e 的 reader.spec、feedback.spec 与 contract/fullstack.spec。
    # 只读：数据取正式数据桶的公开地址（只发 GET），不接 KV、不提交反馈、不部署。
    name: Fullstack (build + next start + e2e reader/feedback/contract)
    needs: pw-image
    runs-on: ubuntu-latest
    # 正常约 6 分钟。10-01 两次被 12 分钟上限掐掉：都是「Install Chromium for Playwright」里 apt 源
    # 只有 ~100 kB/s，这一步从 39 秒拖到 574 秒，与代码无关。放到 20 分钟留出余量（overview#304）。
    # overview#341：改在 Playwright 官方镜像里跑，浏览器与系统依赖都在镜像里，不再 apt 装。
    # --user 1001：与 runner 同一个用户，checkout 进来的工作目录才有写权限（Playwright 文档的写法）。
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pw-image.outputs.version }}-noble
      options: --user 1001
    env:
      KYG_RENDER_MODE: fullstack
      NEXT_PUBLIC_MODE: ''
      NEXT_PUBLIC_DATA_SOURCE: cos
      NEXT_PUBLIC_COS_BASE: https://data.kaiyuanguji.com
      NEXT_PUBLIC_SITE_ENV: ''
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (nextjs)
        working-directory: nextjs
        run: npm ci
      - name: Install (e2e)
        working-directory: e2e
        run: npm ci
      - name: Build (fullstack)
        working-directory: nextjs
        run: npm run build
      - name: Start (next start)
        working-directory: nextjs
        # next start 也读 next.config：KYG_RENDER_MODE 必须同样是 fullstack，否则按静态导出拒绝启动
        run: |
          npx next start -p 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          # 镜像里不一定有 curl，用 node 探活
          for i in $(seq 1 60); do
            node -e "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && exit 0
            sleep 1
          done
          echo "❌ next start 60 秒内没起来"; cat "$RUNNER_TEMP/next-start.log"; exit 1
      - name: e2e contract (fullstack.spec)
        working-directory: e2e
        env:
          TARGET: http://localhost:3000
          SITE_ARCH: fullstack
          EXPECT_NOINDEX: '0'
        # 排除两条只有部署产物才有的：sitemap 分片（deploy 里 gen-sitemaps 生成）、
        # /api/feedback（EdgeOne 边缘函数，next start 没有）。它们仍由 deploy 的 verify 守着。
        run: npx playwright test --project=contract contract/fullstack.spec.ts --grep-invert "新架构：sitemap|/api/feedback"
      - name: e2e ui (reader.spec, feedback.spec, read-home.spec, a11y.spec)
        if: ${{ !cancelled() }}
        working-directory: e2e
        env:
          TARGET: http://localhost:3000
          SITE_ARCH: fullstack
        # feedback.spec 把 /api/feedback 全部拦在浏览器里 mock，不会提交到任何站点
        run: npx playwright test --project=ui ui/reader.spec.ts ui/feedback.spec.ts ui/read-home.spec.ts ui/a11y.spec.ts
      - name: Upload e2e report and server log on failure
        if: failure()
        run: mkdir -p e2e/out && cp "$RUNNER_TEMP/next-start.log" e2e/out/ || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-e2e-output
          path: |
            e2e/out/
            e2e/test-results/
          retention-days: 7

  search-quality:
    # nightly／手动：搜索质量用例（overview#280 T3）。只报告不拦发布：失败不让本 job 变红，
    # 结果贴在 job 摘要里、全文作为工件留 30 天；哪天想拦，把 continue-on-error 去掉即可。
    name: Search quality (report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run search quality cases vs prod
        id: sq
        continue-on-error: true
        run: |
          mkdir -p search-quality-out
          set +e
          node nextjs/scripts/test-search-quality.mjs -v 2>&1 | tee search-quality-out/report.txt
          echo "exit=${PIPESTATUS[0]}" >> search-quality-out/report.txt
          exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        run: |
          {
            echo "## 搜索质量（只报告，不拦发布）"
            echo
            echo "结果：\`${{ steps.sq.outcome }}\`（failure＝有用例失败）"
            echo
            echo '```'
            grep -E "❌|⚠️|通过 [0-9]+ / 失败" -A1 search-quality-out/report.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload search quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-${{ github.run_id }}
          path: search-quality-out/
          retention-days: 30

  perf-prod:
    # nightly only — 跑生产环境真实 perf，回归基线
    name: Production perf benchmark
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (perf)
        working-directory: perf
        run: npm ci
      - name: Install Chromium
        working-directory: perf
        run: npx playwright install --with-deps chromium
      - name: Run perf vs prod
        working-directory: perf
        run: npm run perf -- --profiles=fast
      # 门槛（overview#280 T2）：perf/thresholds.json。超标时先把报告上传、开单，最后让本 job 变红
      - name: Perf gate (thresholds.json)
        id: gate
        continue-on-error: true
        working-directory: perf
        run: npx tsx gate.ts --target=https://www.kaiyuanguji.com
      - name: Gate summary
        if: always()
        run: '[ -f perf/out/gate.md ] && cat perf/out/gate.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_id }}
          path: perf/out/
          retention-days: 30
      - name: Open or update perf issue on breach
        if: steps.gate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.existsSync('perf/out/gate.md') ? fs.readFileSync('perf/out/gate.md', 'utf8') : '（没有 gate.md，见 job 日志）';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '[perf] 夜间性能门槛未通过';
            const body = `${md}\n\n工件（完整报告）与日志：${run}\n\n门槛在 \`perf/thresholds.json\`；连续几晚都红再当真，单晚可能是网络抖动。恢复后请手动关闭本单。`;
            try { await github.rest.issues.createLabel({ ...context.repo, name: 'perf', color: 'fbca04' }); } catch (e) { /* 已存在 */ }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'perf', per_page: 20 });
            const existing = open.data.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['perf'] });
            }
      - name: Fail job on gate breach
        if: steps.gate.outcome == 'failure'
        run: exit 1
