<!-- 腾讯云邮件推送「HTML 富文本」模板：登录链接。变量只有 {{url}}（网址后面的路径与参数，不含域名和开头斜杠；链接写成 https://www.openguji.com/{{url}}，腾讯审核要求链接保留确定域名）。
     在控制台「邮件配置 > 邮件模板」新建，上传本文件，模板名「开源古籍登录链接」，摘要「登录链接」，
     提交审核（约 1 个工作日），通过后把模板 ID 配到环境变量 TENCENT_SES_TEMPLATE_ID。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>开源古籍 登录链接</title></head>
<body style="margin:0;padding:24px;background:#f6f4ef;font-family:'Noto Serif SC',serif,sans-serif;color:#222;">
  <div style="max-width:520px;margin:0 auto;background:#fff;padding:28px;border:1px solid #e2dbd1;">
    <h1 style="font-size:20px;margin:0 0 16px;">开源古籍 登录</h1>
    <p style="line-height:1.7;margin:0 0 20px;">请点击下面的按钮登录（10 分钟内有效，只能用一次）：</p>
    <p style="margin:0 0 20px;"><a href="https://www.openguji.com/{{url}}" style="display:inline-block;padding:10px 22px;background:#222;color:#fff;text-decoration:none;">登录开源古籍</a></p>
    <p style="line-height:1.7;margin:0 0 8px;color:#666;font-size:13px;">按钮点不开，请复制这个链接到浏览器：<br><span style="word-break:break-all;">https://www.openguji.com/{{url}}</span></p>
    <p style="line-height:1.7;margin:16px 0 0;color:#888;font-size:12px;">如果不是你本人操作，请忽略这封邮件。</p>
  </div>
</body>
</html>
