<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Pagefind 中文搜索质量测试</title>
    <style>
        body { font-family: 'Noto Serif CJK SC', serif; max-width: 1000px; margin: 2em auto; padding: 0 1em; }
        h2 { margin-top: 2em; border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
        .query { background: #f7f7f7; padding: 0.5em 1em; border-left: 3px solid #2980b9; margin: 0.5em 0; font-family: monospace; }
        .hit { padding: 0.4em 0.8em; margin: 0.2em 0; background: #f0f8ff; border-radius: 4px; }
        .meta { color: #666; font-size: 0.9em; }
        .stats { color: #888; font-size: 0.85em; margin-bottom: 0.5em; }
        .timing { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Pagefind 中文搜索质量测试</h1>
    <p>测试集：118,829 条 work/book/collection/entity。</p>
    <div id="output">加载中...</div>

    <script type="module">
        // OpenCC 浏览器端：把查询 → 简体（跟索引侧 t2s 同步）
        const opencc = await import('https://esm.sh/opencc-js@1.0.5');
        const t2s = opencc.Converter({ from: 't', to: 'cn' });

        const out = document.getElementById('output');
        out.innerHTML = '';

        async function load() {
            const pagefind = await import('/data/pagefind/pagefind.js');
            await pagefind.options({ baseUrl: '/data/' });
            return pagefind;
        }

        function append(html) {
            out.insertAdjacentHTML('beforeend', html);
        }

        const queries = [
            '红楼梦',       // 简体经典作品
            '紅樓夢',       // 繁体同一个作品
            '史記',         // 繁体史书
            '史记',         // 简体史书
            '司馬遷',       // 作者
            '司马迁',       // 作者简体
            '西游',         // 部分书名
            '楚辭',         // 小众作品
            '孟子',         // 经典
            '尚書',         // 经典
            '汉书艺文志',   // 长查询
            '王應麟',       // 学者人名
            '唐',           // 单字朝代（边界测试）
            '诗经',         // 经典
            '春秋',         // 经典
        ];

        const t0 = performance.now();
        const pf = await load();
        const loadMs = performance.now() - t0;
        append(`<p class="timing">Pagefind 加载完成（${loadMs.toFixed(0)} ms）</p>`);

        for (const q of queries) {
            // 查询归一化：转简体（索引侧也是简体）
            const qNorm = t2s(q);
            append(`<h2>查询: <code>${q}</code>${qNorm !== q ? ` <small>(→ ${qNorm})</small>` : ''}</h2>`);
            const qt0 = performance.now();
            const result = await pf.search(qNorm);
            const qMs = performance.now() - qt0;
            const total = result.results.length;
            const top10 = result.results.slice(0, 10);

            append(`<div class="stats">共 ${total} 条结果，查询耗时 <span class="timing">${qMs.toFixed(0)} ms</span></div>`);

            for (const r of top10) {
                const d = await r.data();
                const meta = d.meta || {};
                append(`<div class="hit">
                    <strong>${meta.title || '(无标题)'}</strong>
                    <span class="meta">
                        ${meta.author ? '· ' + meta.author : ''}
                        ${meta.dynasty ? '· ' + meta.dynasty : ''}
                        ${meta.edition ? '· ' + meta.edition : ''}
                    </span>
                    <span class="meta" style="float:right;">${(d.filters?.type || []).join(',')}</span>
                </div>`);
            }
        }

        append('<h2>测试完成 ✓</h2>');
        window.PAGEFIND_TEST_DONE = true;
    </script>
</body>
</html>
